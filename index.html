    <!-- 1. CONFIGURACIÓN DEL PROYECTO                         -->
    <!-- ===================================================== -->
    <script>
        window.ficha = {
            modelo: "./models/giro-torimask-opt.glb",
            marcadorMind: "./targets/imagen_rastreo.mind",

            // Escala base del modelo
            escala: 3.6,
            rotacionInicial: "0 0 0",

            // ===== Translucidez del tribal interior =====
            opacidadTribal: 0.62,
            opacidadEsfera: 0.38,

            // ===== Estabilidad y Materialización =====
            tiempoRetencionPerdidaMs: 4500, // Aguanta 4.5s si se pierde el sticker
            duracionMaterializacionMs: 1700,
            duracionDesmaterializacionMs: 550,
            suavizadoPose: 16.0,

            // ===== Calidad de captura =====
            calidadFotoJPEG: 0.94,
            bitrateVideo: 15000000,
            fpsVideo: 30,
            maxDuracionVideoSeg: 60,

            // ===== Cámara de entrada ágil =====
            camara: { width: 1280, height: 720 },
            viewerPixelRatioMax: 2.0,

            categoria: "Stickers RA",
            titulo: "Guerrero Demonio",
            autor: "Rawnin del Desierto",
            anio: "2026",
            ubicacion: "Mexa Web",
            mapa: "",
            historia: "."
        };

        window.modoCamaraActual = "environment";

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const getUserMediaOriginal = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
            navigator.mediaDevices.getUserMedia = function (constraints) {
                if (constraints && constraints.video) {
                    const videoBase = typeof constraints.video === "object" ? constraints.video : {};
                    constraints = {
                        ...constraints,
                        video: {
                            ...videoBase,
                            facingMode: { ideal: window.modoCamaraActual },
                            width: { ideal: window.ficha.camara.width },
                            height: { ideal: window.ficha.camara.height }
                        }
                    };
                }
                return getUserMediaOriginal(constraints);
            };
        }
    </script>

    <!-- ===================================================== -->
    <!-- 3. MOTOR AR: COMPOSITOR + MATERIAL TRANSLÚCIDO        -->
    <!-- ===================================================== -->
    <script>
        function calcularResolucionCaptura(vw, vh, modo) {
            const minSide = Math.min(vw, vh);
            const escalaBase = (modo === 'video' ? 1080 : 1440) / minSide;
            const capLong = modo === 'video' ? 2560 : 3840;

            let outW = Math.round((vw * escalaBase) / 2) * 2;
            let outH = Math.round((vh * escalaBase) / 2) * 2;

            if (Math.max(outW, outH) > capLong) {
                const s = capLong / Math.max(outW, outH);
                outW = Math.round((outW * s) / 2) * 2;
                outH = Math.round((outH * s) / 2) * 2;
            }
            return { w: Math.max(2, outW), h: Math.max(2, outH) };
        }

        window.capturadorAR = {
            solicitarFoto: false,
            grabandoVideo: false,
            canvasCompuesto: null,
            ctxCompuesto: null
        };

        // ============================================================
        // COMPOSITOR: une cámara + 3D para fotos y videos
        // ============================================================
        AFRAME.registerComponent('compositor-ar', {
            init: function () {
                const canvas = document.createElement('canvas');
                canvas.width = 720;
                canvas.height = 960;
                window.capturadorAR.canvasCompuesto = canvas;
                window.capturadorAR.ctxCompuesto = canvas.getContext('2d', { alpha: false });

                this._lastDrawTime = 0;
                this._rects = null;

                window.addEventListener('resize', () => { this._rects = null; });
                window.addEventListener('orientationchange', () => { this._rects = null; });
            },

            invalidarRects: function () { this._rects = null; },

            _getRects: function () {
                if (this._rects) return this._rects;

                const video = document.querySelector('video');
                const glCanvas = this.el.canvas;
                if (!glCanvas) return null;

                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;

                const vRect = (video && video.readyState >= 2)
                    ? video.getBoundingClientRect()
                    : { left: 0, top: 0, width: vw, height: vh };

                const cRect = glCanvas.getBoundingClientRect();

                this._rects = { video, glCanvas, vRect, cRect, vw, vh };
                return this._rects;
            },

            tock: function (time) {
                if (!window.capturadorAR.solicitarFoto && !window.capturadorAR.grabandoVideo) return;

                if (window.capturadorAR.grabandoVideo) {
                    if (time - this._lastDrawTime < 33) return;
                    this._lastDrawTime = time;
                }

                this.dibujarFrame();
            },

            dibujarFrame: function () {
                const compCanvas = window.capturadorAR.canvasCompuesto;
                const ctx = window.capturadorAR.ctxCompuesto;
                if (!compCanvas || !ctx) return;

                const r = this._getRects();
                if (!r || !r.glCanvas) return;

                const { video, glCanvas, vRect, cRect, vw, vh } = r;

                if (!window.capturadorAR.grabandoVideo && window.capturadorAR.solicitarFoto) {
                    const target = calcularResolucionCaptura(vw, vh, 'foto');
                    if (compCanvas.width !== target.w || compCanvas.height !== target.h) {
                        compCanvas.width = target.w;
                        compCanvas.height = target.h;
                    }
                }

                const W = compCanvas.width;
                const H = compCanvas.height;

                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, W, H);

                if (video && video.readyState >= 2) {
                    ctx.save();
                    if (window.modoCamaraActual === "user") {
                        ctx.translate(W, 0);
                        ctx.scale(-1, 1);
                    }
                    ctx.drawImage(
                        video,
                        (vRect.left / vw) * W,
                        (vRect.top / vh) * H,
                        (vRect.width / vw) * W,
                        (vRect.height / vh) * H
                    );
                    ctx.restore();
                }

                ctx.drawImage(
                    glCanvas,
                    (cRect.left / vw) * W,
                    (cRect.top / vh) * H,
                    (cRect.width / vw) * W,
                    (cRect.height / vh) * H
                );

                if (window.capturadorAR.solicitarFoto) {
                    window.capturadorAR.solicitarFoto = false;
                    compCanvas.toBlob((blob) => {
                        if (blob && window.mostrarVistaPreviaArchivo) {
                            window.mostrarVistaPreviaArchivo(blob, 'foto');
                        }
                    }, 'image/jpeg', window.ficha.calidadFotoJPEG || 0.94);
                }
            }
        });

        // ============================================================
        // MODELO 3D: TRIBAL TRANSLÚCIDO EN ESFERA + MATERIALIZACIÓN
        // + RETENCIÓN ANTI-PÉRDIDA
        // ============================================================
        AFRAME.registerComponent('modelo-cyberpunk-ar', {
            init: function () {
                const THREE = AFRAME.THREE;
                this.mixer = null;
                this.actions = [];
                this.giroRespaldo = false;
                this.contenedor = null;
                this.anilloEscaner = null;
                this.mallasOriginales = [];

                this.estado = 'OCULTO';
                this.progresoMat = 0;
                this.rastreandoEnVivo = false;
                this.tiempoPerdidaInicio = 0;
                this.poseInicializada = false;
                this.relojPulso = 0;

                this.minYLocal = -1.8;
                this.maxYLocal = 1.8;

                this._tPos = new THREE.Vector3();
                this._tQuat = new THREE.Quaternion();
                this._tScale = new THREE.Vector3();
                this._planeNormal = new THREE.Vector3();
                this._planePoint = new THREE.Vector3();
                this.planoCorte = new THREE.Plane(new THREE.Vector3(0, -1, 0), 10);

                const el = this.el;
                const anclaEstable = document.getElementById('anclaEstableAR');
                const targetEl = document.getElementById('objetivoAR');
                const estadoUI = document.getElementById('estadoCarga');
                const statusPill = document.getElementById('statusPill');

                this.anclaObj = anclaEstable.object3D;
                this.targetObj = targetEl.object3D;
                this.anclaObj.visible = false;

                const activarClipping = () => {
                    if (el.sceneEl && el.sceneEl.renderer) {
                        el.sceneEl.renderer.localClippingEnabled = true;
                        el.sceneEl.renderer.sortObjects = true;
                    }
                };
                if (el.sceneEl.hasLoaded) activarClipping();
                else el.sceneEl.addEventListener('loaded', activarClipping);

                // Anillo orgánico de materialización 3D
                const crearAnilloEscaner = (radio) => {
                    const group = new THREE.Group();

                    const geoRing = new THREE.RingGeometry(radio * 0.78, radio * 1.0, 48);
                    geoRing.rotateX(-Math.PI / 2);
                    const matRing = new THREE.MeshBasicMaterial({
                        color: 0x00f3ff,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.75,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });

                    const geoGlow = new THREE.RingGeometry(radio * 0.35, radio * 0.78, 48);
                    geoGlow.rotateX(-Math.PI / 2);
                    const matGlow = new THREE.MeshBasicMaterial({
                        color: 0xff2a75,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.25,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });

                    group.add(new THREE.Mesh(geoRing, matRing));
                    group.add(new THREE.Mesh(geoGlow, matGlow));
                    group.visible = false;
                    return group;
                };

                const cargarGLB = () => {
                    const loader = new THREE.GLTFLoader();

                    const meshopt = (typeof MeshoptDecoder !== 'undefined') ? MeshoptDecoder : window.MeshoptDecoder;
                    if (meshopt) loader.setMeshoptDecoder(meshopt);

                    if (THREE.DRACOLoader) {
                        const dracoLoader = new THREE.DRACOLoader();
                        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                        loader.setDRACOLoader(dracoLoader);
                    }

                    loader.load(
                        window.ficha.modelo,
                        (gltf) => {
                            const model = gltf.scene;

                            // 1. Inicializar animaciones en loop
                            if (gltf.animations && gltf.animations.length > 0) {
                                this.mixer = new THREE.AnimationMixer(model);
                                gltf.animations.forEach((clip) => {
                                    const action = this.mixer.clipAction(clip);
                                    action.setLoop(THREE.LoopRepeat, Infinity);
                                    action.play();
                                    this.actions.push(action);
                                });
                                this.mixer.update(0);
                            } else {
                                this.giroRespaldo = true;
                            }

                            // 2. Medir cada malla para identificar la esfera exterior y el tribal interior
                            model.updateMatrixWorld(true);
                            const boxGlobal = new THREE.Box3();
                            const infoMallas = [];

                            model.traverse((node) => {
                                if (node.isMesh) {
                                    node.frustumCulled = false;
                                    const mBox = new THREE.Box3().setFromObject(node);
                                    boxGlobal.union(mBox);
                                    const mSize = mBox.getSize(new THREE.Vector3());
                                    const volumen = mSize.x * mSize.y * mSize.z;
                                    infoMallas.push({ node, volumen, mSize });
                                }
                            });

                            if (boxGlobal.isEmpty()) boxGlobal.setFromObject(model);

                            // Ordenar de menor a mayor volumen (el tribal interno suele tener menor volumen o nombre específico)
                            infoMallas.sort((a, b) => a.volumen - b.volumen);
                            const maxVolumen = infoMallas.length > 0 ? infoMallas[infoMallas.length - 1].volumen : 1;

                            infoMallas.forEach((item, index) => {
                                const node = item.node;
                                const nombre = ((node.name || "") + " " + (node.parent?.name || "")).toLowerCase();

                                // Determinar si es el tribal/máscara interior o la esfera envolvente
                                const esEsferaExplicita = /sphere|esfera|ball|orb|glass|outer/i.test(nombre);
                                const esTribalExplicito = /tribal|mask|mascara|tori|demon|sigil|curve|logo|inner/i.test(nombre);

                                let esTribalInterior = true;
                                if (infoMallas.length > 1) {
                                    if (esTribalExplicito) {
                                        esTribalInterior = true;
                                    } else if (esEsferaExplicita) {
                                        esTribalInterior = false;
                                    } else {
                                        // Si no tienen nombres descriptivos, las mallas internas tienen menor volumen que la esfera exterior
                                        esTribalInterior = item.volumen < maxVolumen * 0.88 || index < infoMallas.length - 1;
                                    }
                                }

                                // Clonar materiales para no afectar instancias compartidas y aplicar translucidez
                                const origMats = Array.isArray(node.material) ? node.material : [node.material];
                                const nuevosMats = origMats.map((mat) => {
                                    if (!mat) return mat;
                                    const m = mat.clone();
                                    m.side = THREE.DoubleSide;
                                    m.transparent = true;
                                    m.clippingPlanes = [this.planoCorte];
                                    m.clipShadows = true;

                                    if (esTribalInterior) {
                                        // Material translúcido etéreo para el tribal dentro de la esfera
                                        m.opacity = window.ficha.opacidadTribal ?? 0.62;
                                        m.depthWrite = false;
                                        if ('roughness' in m) m.roughness = Math.min(m.roughness ?? 0.2, 0.22);
                                        if ('metalness' in m) m.metalness = Math.max(m.metalness ?? 0.15, 0.25);
                                        if ('transmission' in m) m.transmission = Math.max(m.transmission ?? 0, 0.45);
                                        if (m.emissive) {
                                            if (m.emissive.r === 0 && m.emissive.g === 0 && m.emissive.b === 0) {
                                                m.emissive.setHex(0x0a2e36);
                                            }
                                            m.emissiveIntensity = 0.85;
                                        }
                                    } else {
                                        // Si hay esfera exterior, asegurar que no bloquee el Z-buffer del tribal interior
                                        m.opacity = Math.min(m.opacity ?? 1.0, window.ficha.opacidadEsfera ?? 0.38);
                                        m.depthWrite = false;
                                        if ('roughness' in m) m.roughness = 0.1;
                                    }

                                    if (m.emissive) {
                                        m.userData.origEmissive = m.emissive.clone();
                                        m.userData.origEmissiveIntensity = m.emissiveIntensity ?? 0.85;
                                    }
                                    m.userData.baseOpacity = m.opacity;
                                    m.needsUpdate = true;
                                    this.mallasOriginales.push(m);
                                    return m;
                                });

                                node.material = Array.isArray(node.material) ? nuevosMats : nuevosMats[0];
                                // El tribal interior se dibuja primero (renderOrder menor) y la esfera después
                                node.renderOrder = esTribalInterior ? (10 + index) : (30 + index);
                            });

                            const size = boxGlobal.getSize(new THREE.Vector3());
                            const center = boxGlobal.getCenter(new THREE.Vector3());
                            const maxDim = Math.max(size.x, size.y, size.z);

                            const pivotGroup = new THREE.Group();
                            const offsetGroup = new THREE.Group();

                            offsetGroup.add(model);
                            pivotGroup.add(offsetGroup);

                            const escalaObjetivo = window.ficha.escala || 3.6;
                            if (Number.isFinite(maxDim) && maxDim > 0.0001) {
                                const factor = escalaObjetivo / maxDim;
                                offsetGroup.position.set(-center.x, -center.y, -center.z);
                                pivotGroup.scale.setScalar(factor);
                            } else {
                                pivotGroup.scale.setScalar(escalaObjetivo);
                            }

                            this.minYLocal = -escalaObjetivo * 0.58;
                            this.maxYLocal = escalaObjetivo * 0.58;

                            this.anilloEscaner = crearAnilloEscaner(escalaObjetivo * 0.52);
                            this.anilloEscaner.renderOrder = 50;
                            el.object3D.add(this.anilloEscaner);

                            el.setObject3D('mesh', pivotGroup);
                            this.contenedor = pivotGroup;

                            if (estadoUI) estadoUI.textContent = "Listo para escanear";
                        },
                        undefined,
                        (error) => {
                            console.error("Error cargando GLB:", error);
                            if (estadoUI) estadoUI.textContent = "Error al cargar modelo";
                        }
                    );
                };

                const meshoptGlobal = (typeof MeshoptDecoder !== 'undefined') ? MeshoptDecoder : window.MeshoptDecoder;
                if (meshoptGlobal && meshoptGlobal.ready) {
                    meshoptGlobal.ready.then(cargarGLB).catch(() => cargarGLB());
                } else {
                    cargarGLB();
                }

                targetEl.addEventListener('targetFound', () => {
                    this.rastreandoEnVivo = true;
                    this.anclaObj.visible = true;

                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(a => {
                            a.paused = false;
                            a.play();
                        });
                    }

                    if (this.estado === 'OCULTO' || this.estado === 'DESMATERIALIZANDO') {
                        if (this.estado === 'OCULTO') this.progresoMat = 0.0;
                        this.estado = 'MATERIALIZANDO';
                        this.aplicarClippingActivo(true);
                    } else if (this.estado === 'RETENCION') {
                        this.estado = this.progresoMat < 1.0 ? 'MATERIALIZANDO' : 'ACTIVO';
                    }

                    if (statusPill) {
                        statusPill.classList.remove('retencion');
                        statusPill.classList.add('activo');
                    }
                    if (estadoUI) estadoUI.textContent = "Conectado";
                });

                targetEl.addEventListener('targetLost', () => {
                    this.rastreandoEnVivo = false;
                    if (this.estado !== 'OCULTO') {
                        this.estado = 'RETENCION';
                        this.tiempoPerdidaInicio = performance.now();
                        if (statusPill) {
                            statusPill.classList.remove('activo');
                            statusPill.classList.add('retencion');
                        }
                        if (estadoUI) estadoUI.textContent = "Estabilizando...";
                    }
                });

                this._statusPill = statusPill;
                this._estadoUI = estadoUI;
            },

            aplicarClippingActivo: function (activo) {
                for (let i = 0; i < this.mallasOriginales.length; i++) {
                    const mat = this.mallasOriginales[i];
                    mat.clippingPlanes = activo ? [this.planoCorte] : null;
                    if (!activo && mat.emissive && mat.userData.origEmissive) {
                        mat.emissive.copy(mat.userData.origEmissive);
                        mat.emissiveIntensity = mat.userData.origEmissiveIntensity;
                    }
                    mat.needsUpdate = true;
                }
                if (this.anilloEscaner) {
                    this.anilloEscaner.visible = activo;
                }
            },

            actualizarEfectoMaterializacion: function (delta) {
                const THREE = AFRAME.THREE;
                if (this.estado === 'MATERIALIZANDO') {
                    const dur = (window.ficha.duracionMaterializacionMs || 1700) / 1000;
                    this.progresoMat = Math.min(1.0, this.progresoMat + delta / dur);
                    if (this.progresoMat >= 1.0) {
                        this.estado = 'ACTIVO';
                        this.aplicarClippingActivo(false);
                        return;
                    }
                } else if (this.estado === 'DESMATERIALIZANDO') {
                    const dur = (window.ficha.duracionDesmaterializacionMs || 550) / 1000;
                    this.progresoMat = Math.max(0.0, this.progresoMat - delta / dur);
                    if (this.progresoMat <= 0.0) {
                        this.estado = 'OCULTO';
                        this.anclaObj.visible = false;
                        this.poseInicializada = false;
                        this.aplicarClippingActivo(false);
                        if (window.notificarPerdidaDefinitivaUI) window.notificarPerdidaDefinitivaUI();
                        return;
                    }
                } else {
                    return;
                }

                const t = this.progresoMat;
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                const alturaLocal = THREE.MathUtils.lerp(this.minYLocal, this.maxYLocal, ease);

                if (this.anilloEscaner) {
                    this.anilloEscaner.visible = true;
                    this.anilloEscaner.position.set(0, alturaLocal, 0);
                    this.anilloEscaner.rotation.y += delta * 3.5;

                    this.el.object3D.updateMatrixWorld(true);
                    this.anilloEscaner.getWorldPosition(this._planePoint);

                    this._planeNormal.set(0, -1, 0).transformDirection(this.el.object3D.matrixWorld).normalize();
                    this.planoCorte.setFromNormalAndCoplanarPoint(this._planeNormal, this._planePoint);
                }

                const pulsoNeon = Math.sin(t * Math.PI);
                for (let i = 0; i < this.mallasOriginales.length; i++) {
                    const mat = this.mallasOriginales[i];
                    if (mat.emissive) {
                        mat.emissive.setRGB(
                            0.05 + pulsoNeon * 0.12,
                            pulsoNeon * 0.78,
                            pulsoNeon * 0.92
                        );
                        mat.emissiveIntensity = 0.85 + pulsoNeon * 1.4;
                    }
                }
            },

            tick: function (time, timeDelta) {
                if (this.estado === 'OCULTO') return;

                const delta = Math.min((timeDelta || 16.6) / 1000, 0.05);
                this.relojPulso += delta;

                if (this.rastreandoEnVivo && this.targetObj.visible) {
                    const mat = this.targetObj.matrix;
                    if (mat && mat.elements[15] !== 0) {
                        mat.decompose(this._tPos, this._tQuat, this._tScale);
                        if (this._tScale.lengthSq() > 0.000001) {
                            if (!this.poseInicializada) {
                                this.anclaObj.position.copy(this._tPos);
                                this.anclaObj.quaternion.copy(this._tQuat);
                                this.anclaObj.scale.copy(this._tScale);
                                this.poseInicializada = true;
                            } else {
                                const k = window.ficha.suavizadoPose || 16.0;
                                const alpha = 1.0 - Math.exp(-k * delta);
                                this.anclaObj.position.lerp(this._tPos, alpha);
                                this.anclaObj.quaternion.slerp(this._tQuat, alpha);
                                this.anclaObj.scale.lerp(this._tScale, alpha);
                            }
                        }
                    }
                } else if (this.estado === 'RETENCION') {
                    const transcurrido = performance.now() - this.tiempoPerdidaInicio;
                    const maxRetencion = window.ficha.tiempoRetencionPerdidaMs || 4500;

                    this.anclaObj.position.y += Math.sin(this.relojPulso * 3.2) * 0.00035;

                    if (transcurrido >= maxRetencion) {
                        this.estado = 'DESMATERIALIZANDO';
                        this.aplicarClippingActivo(true);
                    }
                }

                if (this.estado === 'MATERIALIZANDO' || this.estado === 'DESMATERIALIZANDO') {
                    this.actualizarEfectoMaterializacion(delta);
                }

                if (this.mixer) {
                    this.mixer.update(delta);
                } else if (this.giroRespaldo && this.contenedor) {
                    this.contenedor.rotation.y += delta * 1.5;
                }
            }
        });
    </script>
</head>

<body>

    <div id="flashPantalla"></div>

    <!-- BARRA SUPERIOR MINIMALISTA -->
    <div class="top-bar">
        <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="estadoCarga">Iniciando...</span>
        </div>
        <button id="btnAbrirFicha" aria-label="Información de la pieza">i</button>
    </div>

    <!-- GUÍA DE ESCANEO ORGÁNICA SIN TEXTO -->
    <div id="ui-escaneo">
        <div class="marco-escaner" id="marcoEscaner">
            <div class="linea-escaner"></div>
        </div>
    </div>

    <!-- CONTROLES DE CAPTURA -->
    <div class="contenedor-controles">
        <div id="badgeTiempo">
            <span class="punto-parpadeo"></span>
            <span id="textoTiempo">00:00</span>
        </div>

        <div class="dock-captura">
            <button class="btn-icono" id="btnFoto" aria-label="Tomar foto">
                <div class="nucleo-foto">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
            </button>

            <button class="btn-icono" id="btnVideo" aria-label="Grabar video">
                <div class="nucleo-video"></div>
            </button>

            <button class="btn-icono" id="btnCambiarCamara" aria-label="Cambiar cámara">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"></path>
                    <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- MODAL DE VISTA PREVIA MULTIMEDIA -->
    <div id="modalPreview">
        <div class="tarjeta-preview">
            <div class="cabecera-preview">
                <span id="tituloPreview">Captura lista</span>
                <span id="pesoArchivo">0 KB</span>
            </div>
            <div class="contenedor-media" id="contenedorMedia"></div>
            <div class="acciones-preview">
                <button class="btn-modal" id="btnCerrarPreview">✕</button>
                <button class="btn-modal" id="btnCompartir">Compartir</button>
                <button class="btn-modal" id="btnDescargar">⬇ Guardar</button>
            </div>
        </div>
    </div>

    <!-- PANEL INFERIOR DE INFORMACIÓN -->
    <section id="panelInferior">
        <div class="cabecera-ficha">
            <div>
                <span class="badge-categoria" id="uiCategoria"></span>
                <h1 class="titulo-obra" id="uiTitulo"></h1>
            </div>
            <button class="boton-cerrar-ficha" id="btnCerrarFicha">Cerrar</button>
        </div>

        <div class="datos-grid">
            <div>
                <span class="etiqueta">AUTOR</span>
                <div class="valor" id="uiAutor"></div>
            </div>
            <div>
                <span class="etiqueta">AÑO</span>
                <div class="valor" id="uiAnio"></div>
            </div>
            <div style="grid-column: span 2;">
                <span class="etiqueta">UBICACIÓN</span>
                <div class="valor" id="uiUbicacion"></div>
                <a id="botonMapa" href="#" target="_blank" rel="noopener noreferrer">VER UBICACIÓN EN GOOGLE MAPS</a>
            </div>
        </div>
        <span class="etiqueta">DESCRIPCIÓN</span>
        <p class="historia-texto" id="uiHistoria"></p>
    </section>

    <!-- ===================================================== -->
    <!-- ESCENA AR                                             -->
    <!-- ===================================================== -->
    <a-scene
        id="escenaAR"
        compositor-ar
        loading-screen="enabled: false"
        mindar-image="imageTargetSrc: ./targets/imagen_rastreo.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0005; filterBeta: 0.005; warmupTolerance: 1; missTolerance: 15;"
        color-space="sRGB"
        renderer="colorManagement: true; antialias: true; alpha: true; preserveDrawingBuffer: true; powerPreference: high-performance;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-light type="hemisphere" color="#e8faff" groundColor="#241634" intensity="1.05"></a-light>
        <a-light type="ambient" color="#ffffff" intensity="1.1"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2.0" position="1.5 2.5 2"></a-light>
        <a-light type="directional" color="#00f3ff" intensity="1.1" position="-2.0 1.2 1.5"></a-light>
        <a-light type="directional" color="#ff2a75" intensity="0.9" position="2.0 -1.2 1.2"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="objetivoAR"></a-entity>

        <a-entity id="anclaEstableAR">
            <a-entity
                id="entidadModelo"
                position="0 0 0.1"
                rotation="0 0 0"
                modelo-cyberpunk-ar>
            </a-entity>
        </a-entity>

    </a-scene>

    <!-- ===================================================== -->
    <!-- LÓGICA DE INTERFAZ, CÁMARA Y GRABACIÓN                -->
    <!-- ===================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const escenaEl = document.getElementById("escenaAR");

            // 1. Cargar datos de la ficha
            document.getElementById("uiCategoria").textContent = window.ficha.categoria;
            document.getElementById("uiTitulo").textContent = window.ficha.titulo;
            document.getElementById("uiAutor").textContent = window.ficha.autor;
            document.getElementById("uiAnio").textContent = window.ficha.anio;
            document.getElementById("uiUbicacion").textContent = window.ficha.ubicacion;
            document.getElementById("uiHistoria").textContent = window.ficha.historia;

            const entidadModelo = document.getElementById("entidadModelo");
            if (window.ficha.rotacionInicial) {
                entidadModelo.setAttribute("rotation", window.ficha.rotacionInicial);
            }

            const botonMapa = document.getElementById("botonMapa");
            if (window.ficha.mapa && window.ficha.mapa.trim() !== "") {
                botonMapa.href = window.ficha.mapa;
                botonMapa.style.display = "block";
            }

            // 2. Ajustar resolución del renderer
            function aplicarViewerPixelRatio() {
                const renderer = escenaEl && escenaEl.renderer;
                if (!renderer || typeof renderer.setPixelRatio !== 'function') return;
                const dpr = window.devicePixelRatio || 1;
                const target = Math.min(dpr, window.ficha.viewerPixelRatioMax || 2.0);
                const current = (typeof renderer.getPixelRatio === 'function') ? renderer.getPixelRatio() : 1;
                if (current < target) {
                    renderer.setPixelRatio(target);
                }
            }

            if (escenaEl.hasLoaded) {
                aplicarViewerPixelRatio();
            } else {
                escenaEl.addEventListener('loaded', aplicarViewerPixelRatio);
            }

            // 3. Ficha informativa
            const panelInferior = document.getElementById("panelInferior");
            const btnAbrirFicha = document.getElementById("btnAbrirFicha");
            const btnCerrarFicha = document.getElementById("btnCerrarFicha");

            btnAbrirFicha.addEventListener("click", () => panelInferior.classList.add("visible"));
            btnCerrarFicha.addEventListener("click", () => panelInferior.classList.remove("visible"));

            // 4. Detección visual
            const objetivoAR = document.getElementById("objetivoAR");
            const uiEscaneo = document.getElementById("ui-escaneo");
            const marcoEscaner = document.getElementById("marcoEscaner");
            const estadoCarga = document.getElementById("estadoCarga");
            const statusPill = document.getElementById("statusPill");

            let timeoutOcultarUI = null;

            objetivoAR.addEventListener("targetFound", () => {
                clearTimeout(timeoutOcultarUI);
                marcoEscaner.classList.add("detectado");
                btnAbrirFicha.style.display = "flex";
                if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }

                timeoutOcultarUI = setTimeout(() => {
                    uiEscaneo.style.opacity = "0";
                }, 450);
            });

            window.notificarPerdidaDefinitivaUI = () => {
                clearTimeout(timeoutOcultarUI);
                uiEscaneo.style.opacity = "1";
                marcoEscaner.classList.remove("detectado");
                panelInferior.classList.remove("visible");
                btnAbrirFicha.style.display = "none";
                statusPill.classList.remove("activo", "retencion");
                estadoCarga.textContent = "Listo para escanear";
            };

            // 5. Cambio de cámara
            const btnCambiarCamara = document.getElementById("btnCambiarCamara");

            function invalidarRectsCompositor() {
                const comp = escenaEl.components["compositor-ar"];
                if (comp && typeof comp.invalidarRects === "function") comp.invalidarRects();
            }

            async function cambiarCamara() {
                if (window._cambiandoCamara) return;
                window._cambiandoCamara = true;
                btnCambiarCamara.disabled = true;
                btnCambiarCamara.classList.toggle("girando");

                const modoPrevio = window.modoCamaraActual;
                const nuevoModo = modoPrevio === "environment" ? "user" : "environment";
                window.modoCamaraActual = nuevoModo;

                let ok = false;

                try {
                    const mindarSystem = escenaEl.systems["mindar-image-system"];
                    if (mindarSystem && typeof mindarSystem.switchCamera === "function") {
                        const r = mindarSystem.switchCamera();
                        if (r && typeof r.then === "function") await r;
                        ok = true;
                    }
                } catch (err) {
                    console.warn("[camera] switchCamera() falló:", err);
                }

                if (!ok) {
                    try {
                        const videos = document.querySelectorAll("video");
                        videos.forEach(v => {
                            if (v.srcObject) {
                                try { v.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {}
                            }
                        });

                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: {
                                facingMode: { ideal: nuevoModo },
                                width: { ideal: window.ficha.camara.width },
                                height: { ideal: window.ficha.camara.height }
                            },
                            audio: false
                        });

                        for (const video of videos) {
                            video.srcObject = stream;
                            try { await video.play(); } catch (e) {}
                        }
                        ok = true;
                    } catch (err) {
                        console.error("[camera] fallback getUserMedia falló:", err);
                    }
                }

                if (!ok) {
                    window.modoCamaraActual = modoPrevio;
                    btnCambiarCamara.classList.toggle("girando");
                } else {
                    invalidarRectsCompositor();
                    setTimeout(invalidarRectsCompositor, 400);
                }

                btnCambiarCamara.disabled = false;
                window._cambiandoCamara = false;
            }

            btnCambiarCamara.addEventListener("click", cambiarCamara);

            // 6. Captura de FOTO
            const btnFoto = document.getElementById("btnFoto");
            const flashPantalla = document.getElementById("flashPantalla");

            btnFoto.addEventListener("click", async () => {
                if (window.capturadorAR.grabandoVideo) return;

                flashPantalla.style.opacity = "0.75";
                setTimeout(() => { flashPantalla.style.opacity = "0"; }, 180);

                const renderer = escenaEl.renderer;
                const originalPR = renderer ? renderer.getPixelRatio() : 1;
                if (renderer) {
                    const boost = Math.min((window.devicePixelRatio || 1) * 1.5, 4);
                    renderer.setPixelRatio(Math.max(originalPR, boost));
                }

                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                window.capturadorAR.solicitarFoto = true;

                setTimeout(() => {
                    if (renderer) renderer.setPixelRatio(originalPR);
                }, 900);
            });

            // 7. Grabación de VIDEO HD
            const btnVideo = document.getElementById("btnVideo");
            const badgeTiempo = document.getElementById("badgeTiempo");
            const textoTiempo = document.getElementById("textoTiempo");

            let mediaRecorder = null;
            let fragmentosVideo = [];
            let intervaloTiempo = null;
            let segundosGrabados = 0;
            let originalPRForVideo = null;

            function obtenerMimeTypeOptimizado() {
                const tipos = [
                    "video/mp4;codecs=avc1.42E01E",
                    "video/mp4",
                    "video/webm;codecs=vp9",
                    "video/webm;codecs=vp8",
                    "video/webm"
                ];
                if (!window.MediaRecorder) return "";
                for (const t of tipos) {
                    if (MediaRecorder.isTypeSupported(t)) return t;
                }
                return "";
            }

            async function iniciarGrabacion() {
                const renderer = escenaEl.renderer;
                originalPRForVideo = renderer ? renderer.getPixelRatio() : 1;
                if (renderer) {
                    const boost = Math.min((window.devicePixelRatio || 1) * 1.5, 3);
                    renderer.setPixelRatio(Math.max(originalPRForVideo, boost));
                }

                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                const compCanvas = window.capturadorAR.canvasCompuesto;
                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;
                const target = calcularResolucionCaptura(vw, vh, 'video');
                compCanvas.width = target.w;
                compCanvas.height = target.h;

                invalidarRectsCompositor();

                window.capturadorAR.solicitarFoto = false;
                window.capturadorAR.grabandoVideo = true;

                const comp = escenaEl.components["compositor-ar"];
                if (comp) comp.dibujarFrame();

                fragmentosVideo = [];

                const stream = compCanvas.captureStream(window.ficha.fpsVideo || 30);
                const mimeType = obtenerMimeTypeOptimizado();

                const opciones = {
                    videoBitsPerSecond: window.ficha.bitrateVideo || 15000000
                };
                if (mimeType) opciones.mimeType = mimeType;

                try {
                    mediaRecorder = new MediaRecorder(stream, opciones);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) fragmentosVideo.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const tipoFinal = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : "video/mp4";
                    const blob = new Blob(fragmentosVideo, { type: tipoFinal });
                    if (blob.size > 0 && window.mostrarVistaPreviaArchivo) {
                        window.mostrarVistaPreviaArchivo(blob, "video");
                    }
                };

                mediaRecorder.start(250);
                btnVideo.classList.add("grabando");
                badgeTiempo.classList.add("activo");
                segundosGrabados = 0;
                textoTiempo.textContent = "00:00";

                intervaloTiempo = setInterval(() => {
                    segundosGrabados++;
                    const min = String(Math.floor(segundosGrabados / 60)).padStart(2, "0");
                    const seg = String(segundosGrabados % 60).padStart(2, "0");
                    textoTiempo.textContent = `${min}:${seg}`;

                    if (window.ficha.maxDuracionVideoSeg && segundosGrabados >= window.ficha.maxDuracionVideoSeg) {
                        detenerGrabacion();
                    }
                }, 1000);
            }

            function detenerGrabacion() {
                window.capturadorAR.grabandoVideo = false;
                clearInterval(intervaloTiempo);
                btnVideo.classList.remove("grabando");
                badgeTiempo.classList.remove("activo");

                if (escenaEl.renderer && originalPRForVideo !== null) {
                    setTimeout(() => {
                        escenaEl.renderer.setPixelRatio(originalPRForVideo);
                        originalPRForVideo = null;
                    }, 400);
                }

                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    try { mediaRecorder.requestData(); } catch (e) {}
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state !== "inactive") {
                            mediaRecorder.stop();
                        }
                    }, 120);
                }
            }

            btnVideo.addEventListener("click", () => {
                if (!window.capturadorAR.grabandoVideo) {
                    iniciarGrabacion().catch(err => {
                        console.error("[video] Error al iniciar grabación:", err);
                        window.capturadorAR.grabandoVideo = false;
                        btnVideo.classList.remove("grabando");
                        badgeTiempo.classList.remove("activo");
                        clearInterval(intervaloTiempo);
                    });
                } else {
                    detenerGrabacion();
                }
            });

            // 8. Modal de vista previa
            const modalPreview = document.getElementById("modalPreview");
            const contenedorMedia = document.getElementById("contenedorMedia");
            const pesoArchivo = document.getElementById("pesoArchivo");
            const tituloPreview = document.getElementById("tituloPreview");
            const btnCerrarPreview = document.getElementById("btnCerrarPreview");
            const btnCompartir = document.getElementById("btnCompartir");
            const btnDescargar = document.getElementById("btnDescargar");

            let urlArchivoActual = null;
            let archivoActualObj = null;
            let nombreArchivoActual = "";

            window.mostrarVistaPreviaArchivo = (blob, tipo) => {
                if (urlArchivoActual) {
                    try { URL.revokeObjectURL(urlArchivoActual); } catch (e) {}
                }

                urlArchivoActual = URL.createObjectURL(blob);
                contenedorMedia.innerHTML = "";

                const kb = blob.size / 1024;
                pesoArchivo.textContent = kb < 1024
                    ? `${Math.max(1, Math.round(kb))} KB`
                    : `${(kb / 1024).toFixed(2)} MB`;

                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");

                if (tipo === "foto") {
                    tituloPreview.textContent = "Fotografía AR";
                    nombreArchivoActual = `torimask-ar-${timestamp}.jpg`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: "image/jpeg" });

                    const img = document.createElement("img");
                    img.src = urlArchivoActual;
                    contenedorMedia.appendChild(img);
                } else {
                    tituloPreview.textContent = "Video AR";
                    const esMp4 = blob.type && blob.type.includes("mp4");
                    const ext = esMp4 ? "mp4" : "webm";
                    const mimeLimpio = esMp4 ? "video/mp4" : "video/webm";
                    nombreArchivoActual = `torimask-ar-${timestamp}.${ext}`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: mimeLimpio });

                    const vid = document.createElement("video");
                    vid.src = urlArchivoActual;
                    vid.controls = true;
                    vid.autoplay = true;
                    vid.loop = true;
                    vid.muted = true;
                    vid.playsInline = true;
                    contenedorMedia.appendChild(vid);
                }

                if (navigator.canShare && archivoActualObj && navigator.canShare({ files: [archivoActualObj] })) {
                    btnCompartir.style.display = "flex";
                } else {
                    btnCompartir.style.display = "none";
                }

                modalPreview.classList.add("activo");
            };

            btnCerrarPreview.addEventListener("click", () => {
                modalPreview.classList.remove("activo");
                contenedorMedia.innerHTML = "";
            });

            btnCompartir.addEventListener("click", async () => {
                if (!archivoActualObj) return;
                try {
                    await navigator.share({
                        files: [archivoActualObj],
                        title: window.ficha.titulo
                    });
                } catch (e) {
                    console.log("Compartir cancelado:", e);
                }
            });

            btnDescargar.addEventListener("click", () => {
                if (!urlArchivoActual) return;
                const a = document.createElement("a");
                a.style.display = "none";
                a.href = urlArchivoActual;
                a.download = nombreArchivoActual;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 200);
            });
        });
    </script>

</body>
</html>
