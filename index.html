<!DOCTYPE html>

    <title>Experiencia AR - Tori Mask</title>

    <!-- ===================================================== -->
    <!-- 1. CONFIGURACIÓN DEL PROYECTO (EDITAR AQUÍ)           -->
    <!-- ===================================================== -->
    <script>
        window.ficha = {
            modelo: "./models/giro-torimask-opt.glb",
            marcadorMind: "./targets/imagen_rastreo.mind",

            escala: 1.2,
            rotacionInicial: "0 0 0",

            // ===== Captura de alta calidad =====
            calidadFotoJPEG: 0.95,
            resolucionMaxPx: 3840,        // 4K para fotos
            resolucionVideoMaxPx: 3840,   // 4K nominal para video
            bitrateVideo: 35000000,       // 35 Mbps: máxima nitidez práctica a 4K
            maxDuracionVideoSeg: 60,      // auto-stop a 60s (protección de memoria)

            // ===== Cámara: balance entre nitidez y velocidad de detección =====
            // 1080p es lo máximo que MindAR procesa con fluidez en móviles.
            // El composite sigue siendo 4K (upscaling), pero el modelo 3D se
            // renderiza nativo a alta densidad de píxeles, así que se ve nítido.
            camara: { width: 1920, height: 1080 },

            categoria: "EXPERIENCIA INTERACTIVA",
            titulo: "TORI MASK",
            autor: "Colección Digital",
            anio: "2026",
            ubicacion: "Realidad Aumentada Web",
            mapa: "",
            historia: "Pieza tridimensional animada desplegada mediante reconocimiento óptico de imagen."
        };

        window.modoCamaraActual = "environment";

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const getUserMediaOriginal = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
            navigator.mediaDevices.getUserMedia = function (constraints) {
                if (constraints && constraints.video) {
                    const videoBase = typeof constraints.video === "object" ? constraints.video : {};
                    constraints = {
                        ...constraints,
                        video: {
                            ...videoBase,
                            facingMode: { ideal: window.modoCamaraActual },
                            width: { ideal: window.ficha.camara.width },
                            height: { ideal: window.ficha.camara.height }
                        }
                    };
                }
                return getUserMediaOriginal(constraints);
            };
        }
    </script>

    <!-- ===================================================== -->
    <!-- 3. COMPONENTES 3D Y COMPOSITOR DE FOTO/VIDEO          -->
    <!-- ===================================================== -->
    <script>
        window.capturadorAR = {
            solicitarFoto: false,
            grabandoVideo: false,
            canvasCompuesto: null,
            ctxCompuesto: null
        };

        // =====================================================
        // COMPOSITOR OPTIMIZADO
        // - Caché de rects (evita layout thrashing a 60fps)
        // - Throttle a 30fps durante grabación
        // - Auto-resize solo cuando captura foto
        // =====================================================
        AFRAME.registerComponent('compositor-ar', {
            init: function () {
                const canvas = document.createElement('canvas');
                canvas.width = 720;
                canvas.height = 960;
                window.capturadorAR.canvasCompuesto = canvas;
                window.capturadorAR.ctxCompuesto = canvas.getContext('2d', { alpha: false });

                this._lastDrawTime = 0;
                this._rects = null;
            },

            invalidarRects: function () {
                this._rects = null;
            },

            _medirRects: function () {
                const video = document.querySelector('video');
                const glCanvas = this.el.canvas;
                if (!glCanvas) return null;

                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;

                const vRect = (video && video.readyState >= 2)
                    ? video.getBoundingClientRect()
                    : { left: 0, top: 0, width: vw, height: vh };

                const cRect = glCanvas.getBoundingClientRect();

                this._rects = { video, glCanvas, vRect, cRect, vw, vh };
                return this._rects;
            },

            tock: function (time) {
                if (!window.capturadorAR.solicitarFoto && !window.capturadorAR.grabandoVideo) return;

                // Durante video, throttle a ~30fps (alineado con captureStream(30))
                if (window.capturadorAR.grabandoVideo) {
                    if (time - this._lastDrawTime < 33) return;
                    this._lastDrawTime = time;
                }

                this.dibujarFrame();
            },

            dibujarFrame: function () {
                const compCanvas = window.capturadorAR.canvasCompuesto;
                const ctx = window.capturadorAR.ctxCompuesto;
                if (!compCanvas || !ctx) return;

                const r = this._rects || this._medirRects();
                if (!r || !r.glCanvas) return;

                const { video, glCanvas, vRect, cRect, vw, vh } = r;

                // Auto-resize SOLO en captura de foto (video ya redimensiona externamente)
                if (!window.capturadorAR.grabandoVideo) {
                    const maxDim = window.ficha.resolucionMaxPx || 3840;
                    const escala = maxDim / Math.max(vw, vh);
                    const outW = Math.max(2, Math.round((vw * escala) / 2) * 2);
                    const outH = Math.max(2, Math.round((vh * escala) / 2) * 2);
                    if (compCanvas.width !== outW || compCanvas.height !== outH) {
                        compCanvas.width = outW;
                        compCanvas.height = outH;
                    }
                }

                const W = compCanvas.width;
                const H = compCanvas.height;

                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, W, H);

                if (video && video.readyState >= 2) {
                    ctx.save();
                    if (window.modoCamaraActual === "user") {
                        ctx.translate(W, 0);
                        ctx.scale(-1, 1);
                    }
                    ctx.drawImage(
                        video,
                        (vRect.left / vw) * W,
                        (vRect.top / vh) * H,
                        (vRect.width / vw) * W,
                        (vRect.height / vh) * H
                    );
                    ctx.restore();
                }

                ctx.drawImage(
                    glCanvas,
                    (cRect.left / vw) * W,
                    (cRect.top / vh) * H,
                    (cRect.width / vw) * W,
                    (cRect.height / vh) * H
                );

                if (window.capturadorAR.solicitarFoto) {
                    window.capturadorAR.solicitarFoto = false;
                    compCanvas.toBlob((blob) => {
                        if (blob && window.mostrarVistaPreviaArchivo) {
                            window.mostrarVistaPreviaArchivo(blob, 'foto');
                        }
                    }, 'image/jpeg', window.ficha.calidadFotoJPEG || 0.95);
                }
            }
        });

        // =====================================================
        // CARGADOR DE MODELO CON ANIMACIÓN ESTABLE
        // =====================================================
        AFRAME.registerComponent('modelo-animado-ar', {
            init: function () {
                this.mixer = null;
                this.actions = [];
                this.activo = false;
                this.giroRespaldo = false;
                this.contenedor = null;

                const el = this.el;
                const estadoUI = document.getElementById('estadoCarga');

                const cargarGLB = () => {
                    const loader = new AFRAME.THREE.GLTFLoader();

                    if (window.MeshoptDecoder) {
                        loader.setMeshoptDecoder(window.MeshoptDecoder);
                    }

                    if (AFRAME.THREE.DRACOLoader) {
                        const dracoLoader = new AFRAME.THREE.DRACOLoader();
                        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                        loader.setDRACOLoader(dracoLoader);
                    }

                    loader.load(
                        window.ficha.modelo,
                        (gltf) => {
                            const model = gltf.scene;
                            const wrapper = new AFRAME.THREE.Group();
                            wrapper.add(model);

                            const box = new AFRAME.THREE.Box3().setFromObject(model);
                            const size = box.getSize(new AFRAME.THREE.Vector3());
                            const center = box.getCenter(new AFRAME.THREE.Vector3());

                            const maxDim = Math.max(size.x, size.y, size.z);
                            if (maxDim > 0) {
                                const factor = (window.ficha.escala || 1.2) / maxDim;
                                wrapper.scale.setScalar(factor);
                                model.position.set(-center.x, -center.y, -center.z);
                            }

                            el.setObject3D('mesh', wrapper);
                            this.contenedor = wrapper;

                            if (gltf.animations && gltf.animations.length > 0) {
                                this.mixer = new AFRAME.THREE.AnimationMixer(model);
                                gltf.animations.forEach((clip) => {
                                    const action = this.mixer.clipAction(clip);
                                    action.setLoop(AFRAME.THREE.LoopRepeat, Infinity);
                                    this.actions.push(action);
                                });
                            } else {
                                this.giroRespaldo = true;
                            }
                            estadoUI.textContent = "✓ Listo para escanear";
                        },
                        undefined,
                        (error) => {
                            console.error("Error cargando GLB:", error);
                            estadoUI.textContent = "⚠️ Error al cargar modelo";
                            estadoUI.style.backgroundColor = "#8b0000";
                        }
                    );
                };

                if (window.MeshoptDecoder && window.MeshoptDecoder.ready) {
                    window.MeshoptDecoder.ready.then(cargarGLB);
                } else {
                    cargarGLB();
                }

                const targetEl = document.getElementById('objetivoAR');

                targetEl.addEventListener('targetFound', () => {
                    this.activo = true;
                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(action => {
                            action.reset();
                            action.play();
                        });
                    }
                });

                targetEl.addEventListener('targetLost', () => {
                    this.activo = false;
                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(action => {
                            action.paused = true;
                        });
                    }
                });
            },

            tick: function (time, timeDelta) {
                if (!this.activo) return;
                // Cap delta a 50ms: evita saltos si un frame tardó mucho
                const delta = Math.min(timeDelta / 1000, 0.05);
                if (this.mixer) {
                    this.mixer.update(delta);
                } else if (this.giroRespaldo && this.contenedor) {
                    this.contenedor.rotation.y += delta * 1.5;
                }
            }
        });
    </script>
</head>

<body>

    <!-- Flash para captura fotográfica -->
    <div id="flashPantalla"></div>

    <!-- Barra superior -->
    <div class="top-bar">
        <div id="estadoCarga">Iniciando cámara...</div>
        <button id="btnAbrirFicha" aria-label="Información de la pieza">i</button>
    </div>

    <!-- Guía de escaneo -->
    <div id="ui-escaneo">
        <div class="marco-escaner" id="marcoEscaner">
            <div class="linea-escaner"></div>
            <div class="check-detectado">✓</div>
        </div>
        <div class="instruccion-ar" id="instruccionAR">
            Apunta la cámara hacia la imagen marcador
        </div>
    </div>

    <!-- Controles inferiores UX/UI -->
    <div class="contenedor-controles">
        <div id="badgeTiempo">
            <span class="punto-parpadeo"></span>
            <span id="textoTiempo">00:00</span>
        </div>

        <div class="dock-captura">
            <button class="btn-icono" id="btnFoto" aria-label="Tomar foto">
                <div class="nucleo-foto">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
            </button>

            <button class="btn-icono" id="btnVideo" aria-label="Grabar video">
                <div class="nucleo-video"></div>
            </button>

            <button class="btn-icono" id="btnCambiarCamara" aria-label="Cambiar cámara">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"></path>
                    <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Modal de vista previa -->
    <div id="modalPreview">
        <div class="tarjeta-preview">
            <div class="cabecera-preview">
                <span id="tituloPreview">Captura lista</span>
                <span id="pesoArchivo">0 KB</span>
            </div>
            <div class="contenedor-media" id="contenedorMedia"></div>
            <div class="acciones-preview">
                <button class="btn-modal" id="btnCerrarPreview">✕</button>
                <button class="btn-modal" id="btnCompartir">Guardar</button>
                <button class="btn-modal" id="btnDescargar">⬇ Descargar</button>
            </div>
        </div>
    </div>

    <!-- Ficha informativa -->
    <section id="panelInferior">
        <div class="cabecera-ficha">
            <div>
                <span class="badge-categoria" id="uiCategoria"></span>
                <h1 class="titulo-obra" id="uiTitulo"></h1>
            </div>
            <button class="boton-cerrar-ficha" id="btnCerrarFicha">CERRAR</button>
        </div>

        <div class="datos-grid">
            <div>
                <span class="etiqueta">AUTOR</span>
                <div class="valor" id="uiAutor"></div>
            </div>
            <div>
                <span class="etiqueta">AÑO</span>
                <div class="valor" id="uiAnio"></div>
            </div>
            <div style="grid-column: span 2;">
                <span class="etiqueta">UBICACIÓN</span>
                <div class="valor" id="uiUbicacion"></div>
                <a id="botonMapa" href="#" target="_blank" rel="noopener noreferrer">
                    VER UBICACIÓN EN GOOGLE MAPS
                </a>
            </div>
        </div>
        <span class="etiqueta">DESCRIPCIÓN</span>
        <p class="historia-texto" id="uiHistoria"></p>
    </section>

    <!-- ===================================================== -->
    <!-- ESCENA AR                                             -->
    <!-- ===================================================== -->
    <a-scene
        id="escenaAR"
        compositor-ar
        loading-screen="enabled: false"
        mindar-image="imageTargetSrc: ./targets/imagen_rastreo.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 3; missTolerance: 10;"
        color-space="sRGB"
        renderer="colorManagement: true; antialias: true; alpha: true; preserveDrawingBuffer: true; powerPreference: high-performance;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-light type="ambient" color="#ffffff" intensity="1.6"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2.2" position="1.5 2.5 2"></a-light>
        <a-light type="directional" color="#ffdcb4" intensity="1.0" position="-1.5 -1 1"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="objetivoAR">
            <a-entity
                id="entidadModelo"
                position="0 0 0.1"
                rotation="0 0 0"
                modelo-animado-ar>
            </a-entity>
        </a-entity>

    </a-scene>

    <!-- ===================================================== -->
    <!-- LÓGICA DE INTERFAZ, CAMBIO DE CÁMARA Y GRABACIÓN      -->
    <!-- ===================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // ================================================
            // 1. Cargar datos de la ficha
            // ================================================
            document.getElementById("uiCategoria").textContent = window.ficha.categoria;
            document.getElementById("uiTitulo").textContent = window.ficha.titulo;
            document.getElementById("uiAutor").textContent = window.ficha.autor;
            document.getElementById("uiAnio").textContent = window.ficha.anio;
            document.getElementById("uiUbicacion").textContent = window.ficha.ubicacion;
            document.getElementById("uiHistoria").textContent = window.ficha.historia;

            const entidadModelo = document.getElementById("entidadModelo");
            if (window.ficha.rotacionInicial) {
                entidadModelo.setAttribute("rotation", window.ficha.rotacionInicial);
            }

            const botonMapa = document.getElementById("botonMapa");
            if (window.ficha.mapa && window.ficha.mapa.trim() !== "") {
                botonMapa.href = window.ficha.mapa;
                botonMapa.style.display = "block";
            }

            // ================================================
            // 2. Control de la Ficha Informativa
            // ================================================
            const panelInferior = document.getElementById("panelInferior");
            const btnAbrirFicha = document.getElementById("btnAbrirFicha");
            const btnCerrarFicha = document.getElementById("btnCerrarFicha");

            btnAbrirFicha.addEventListener("click", () => panelInferior.classList.add("visible"));
            btnCerrarFicha.addEventListener("click", () => panelInferior.classList.remove("visible"));

            // ================================================
            // 3. Eventos de detección con feedback visual
            // ================================================
            const objetivoAR = document.getElementById("objetivoAR");
            const uiEscaneo = document.getElementById("ui-escaneo");
            const marcoEscaner = document.getElementById("marcoEscaner");
            const instruccionAR = document.getElementById("instruccionAR");
            const estadoCarga = document.getElementById("estadoCarga");

            let timeoutOcultarUI = null;

            objetivoAR.addEventListener("targetFound", () => {
                clearTimeout(timeoutOcultarUI);

                marcoEscaner.classList.add("detectado");
                instruccionAR.classList.add("detectado");
                instruccionAR.textContent = "✓ Imagen detectada";
                btnAbrirFicha.style.display = "flex";

                // Haptic
                if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }

                // Ocultar UI de escaneo tras el feedback
                timeoutOcultarUI = setTimeout(() => {
                    uiEscaneo.style.opacity = "0";
                    estadoCarga.style.opacity = "0.5";
                }, 600);
            });

            objetivoAR.addEventListener("targetLost", () => {
                clearTimeout(timeoutOcultarUI);
                uiEscaneo.style.opacity = "1";
                marcoEscaner.classList.remove("detectado");
                instruccionAR.classList.remove("detectado");
                instruccionAR.textContent = "Apunta la cámara hacia la imagen marcador";
                panelInferior.classList.remove("visible");
                btnAbrirFicha.style.display = "none";
                estadoCarga.style.opacity = "1";
            });

            // ================================================
            // 4. Cambio de cámara frontal/trasera
            // ================================================
            const btnCambiarCamara = document.getElementById("btnCambiarCamara");
            const escenaEl = document.getElementById("escenaAR");

            btnCambiarCamara.addEventListener("click", async () => {
                btnCambiarCamara.classList.toggle("girando");
                window.modoCamaraActual = (window.modoCamaraActual === "environment") ? "user" : "environment";

                const mindarSystem = escenaEl.systems["mindar-image-system"];
                if (mindarSystem && typeof mindarSystem.switchCamera === "function") {
                    mindarSystem.switchCamera();
                } else {
                    const videoEl = document.querySelector("video");
                    if (videoEl && videoEl.srcObject) {
                        videoEl.srcObject.getTracks().forEach(t => t.stop());
                        try {
                            const nuevoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                            videoEl.srcObject = nuevoStream;
                            await videoEl.play();
                        } catch (err) {
                            console.error("Error al cambiar de cámara:", err);
                        }
                    }
                }
            });

            // ================================================
            // 5. Helpers para ajustar la resolución del renderer
            //    (evita que el modelo se vea borroso al hacer el composite)
            // ================================================
            function getSceneRenderer() { return escenaEl && escenaEl.renderer; }

            // Capturamos el pixelRatio original de A-Frame una sola vez
            let defaultPixelRatio = null;
            setTimeout(() => {
                const renderer = getSceneRenderer();
                if (renderer && typeof renderer.getPixelRatio === "function") {
                    defaultPixelRatio = renderer.getPixelRatio();
                }
            }, 1500);

            function getDefaultPR() {
                if (defaultPixelRatio !== null) return defaultPixelRatio;
                return Math.min(window.devicePixelRatio || 1, 2);
            }

            function setRenderPixelRatio(pr) {
                const renderer = getSceneRenderer();
                if (renderer && typeof renderer.setPixelRatio === "function") {
                    try { renderer.setPixelRatio(pr); } catch (e) {}
                }
            }

            // PixelRatio necesario para que el canvas WebGL (del modelo 3D)
            // se renderice a la resolución del composite (4K). Topes distintos:
            //   - FOTO: 6x (spike de un solo frame, no sostenido)
            //   - VIDEO: 3x (sostenido durante la grabación, sostenible)
            function getCapturePixelRatio(targetMaxPx, cap) {
                const vwCss = Math
