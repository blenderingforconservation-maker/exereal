<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Experiencia AR - Tori Mask</title>

    <!-- Precarga para acelerar el inicio -->
    <link rel="preconnect" href="https://aframe.io" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="./targets/imagen_rastreo.mind" as="fetch" crossorigin>
    <link rel="preload" href="./models/giro-torimask-opt.glb" as="fetch" crossorigin>

    <!-- ===================================================== -->
    <!-- 1. CONFIGURACIÓN DEL PROYECTO                         -->
    <!-- ===================================================== -->
    <script>
        window.ficha = {
            modelo: "./models/giro-torimask-opt.glb",
            marcadorMind: "./targets/imagen_rastreo.mind",

            // Escala multiplicada x4 (original era 3.6 -> ahora 14.4)
            escala: 14.4,
            rotacionInicial: "0 0 0",

            // ===== Calidad de captura =====
            calidadFotoJPEG: 0.92,
            bitrateVideo: 15000000,
            fpsVideo: 30,
            maxDuracionVideoSeg: 60,

            viewerPixelRatioMax: 2.0,

            categoria: "Stickers RA",
            titulo: "Guerrero Demonio",
            autor: "Rawnin del Desierto",
            anio: "2026",
            ubicacion: "Mexa Web",
            mapa: "",
            historia: "."
        };
        
        // Eliminado el bloque restrictivo de navigator.mediaDevices.getUserMedia
        // para permitir un inicio de cámara inmediato sin lag de hardware.
    </script>

    <!-- ===================================================== -->
    <!-- 2. LIBRERÍAS                                          -->
    <!-- ===================================================== -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #000000; color: #222222;
        }

        /* BARRA SUPERIOR */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 300;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
            pointer-events: none;
        }
        #estadoCarga {
            font-size: 11px; color: #ffffff;
            background: rgba(20,20,20,0.72); border: 1px solid rgba(255,255,255,0.18);
            padding: 7px 14px; border-radius: 20px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.4s ease, background-color 0.3s ease;
        }
        #btnAbrirFicha {
            pointer-events: auto; display: none; width: 40px; height: 40px;
            border-radius: 50%; background: rgba(255,255,255,0.9); color: #111;
            border: none; font-size: 16px; font-weight: 800;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3); cursor: pointer;
            align-items: center; justify-content: center; transition: transform 0.2s ease;
        }
        #btnAbrirFicha:active { transform: scale(0.9); }

        /* GUÍA DE ESCANEO */
        #ui-escaneo {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 150; pointer-events: none; transition: opacity 0.4s ease;
        }
        .marco-escaner {
            width: 64vw; max-width: 240px; height: 64vw; max-height: 240px;
            border: 2px dashed rgba(255,255,255,0.75); border-radius: 24px; position: relative;
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.35);
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .marco-escaner.detectado {
            border-color: rgba(48,209,88,0.95); border-style: solid;
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.35), 0 0 32px rgba(48,209,88,0.7);
        }
        .linea-escaner {
            width: 85%; height: 2px; background: #ffffff;
            box-shadow: 0 0 12px #ffffff; animation: barrido 2.2s infinite ease-in-out;
            transition: opacity 0.25s ease;
        }
        .marco-escaner.detectado .linea-escaner { opacity: 0; animation-play-state: paused; }
        .check-detectado {
            position: absolute; font-size: 64px; font-weight: 800; color: #30d158;
            opacity: 0; transform: scale(0.4);
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            text-shadow: 0 0 24px rgba(48,209,88,0.6);
        }
        .marco-escaner.detectado .check-detectado { opacity: 1; transform: scale(1); }
        @keyframes barrido {
            0%, 100% { transform: translateY(-80px); opacity: 0.3; }
            50% { transform: translateY(80px); opacity: 1; }
        }
        .instruccion-ar {
            margin-top: 22px; background: rgba(20,20,20,0.82); color: #f2f0eb;
            padding: 10px 18px; border-radius: 30px; font-size: 13px;
            text-align: center; max-width: 82%; backdrop-filter: blur(6px);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .instruccion-ar.detectado { background: rgba(48,209,88,0.9); color: #ffffff; }

        /* CONTROLES */
        .contenedor-controles {
            position: fixed; bottom: 28px; bottom: max(28px, env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%); z-index: 280;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        #badgeTiempo {
            display: none; align-items: center; gap: 6px;
            background: rgba(255,59,48,0.92); color: #ffffff;
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
            padding: 5px 12px; border-radius: 20px;
            box-shadow: 0 4px 12px rgba(255,59,48,0.4);
        }
        #badgeTiempo.activo { display: flex; }
        .punto-parpadeo {
            width: 7px; height: 7px; border-radius: 50%; background: #ffffff;
            animation: parpadeo 1s infinite;
        }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        .dock-captura {
            display: flex; align-items: center; gap: 22px;
            background: rgba(18,18,18,0.72); border: 1px solid rgba(255,255,255,0.16);
            padding: 12px 22px; border-radius: 50px;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        }
        .btn-icono {
            position: relative; border: none; background: none; padding: 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            touch-action: manipulation;
            transition: transform 0.18s cubic-bezier(0.2,0.8,0.2,1);
        }
        .btn-icono:active { transform: scale(0.88); }

        #btnFoto {
            width: 56px; height: 56px; border-radius: 50%;
            border: 3px solid #ffffff; background: rgba(255,255,255,0.15);
        }
        .nucleo-foto {
            width: 44px; height: 44px; border-radius: 50%; background: #ffffff;
            display: flex; align-items: center; justify-content: center; color: #111111;
        }
        #btnVideo {
            width: 56px; height: 56px; border-radius: 50%;
            border: 3px solid #ffffff; background: rgba(255,59,48,0.15);
        }
        .nucleo-video {
            width: 40px; height: 40px; border-radius: 50%; background: #ff3b30;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        #btnVideo.grabando { border-color: #ff3b30; }
        #btnVideo.grabando .nucleo-video {
            width: 22px; height: 22px; border-radius: 6px;
        }
        #btnCambiarCamara {
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
            color: #ffffff; transition: transform 0.4s ease;
        }
        #btnCambiarCamara.girando { transform: rotate(180deg); }
        #btnCambiarCamara[disabled] { opacity: 0.4; cursor: wait; }

        #flashPantalla {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff; opacity: 0; pointer-events: none; z-index: 500;
            transition: opacity 0.25s ease;
        }

        /* MODAL */
        #modalPreview {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.86); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); z-index: 600;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 18px;
        }
        #modalPreview.activo { display: flex; }
        .tarjeta-preview {
            background: #1c1c1e; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px; padding: 16px; width: 100%; max-width: 380px;
            color: #ffffff; box-shadow: 0 14px 40px rgba(0,0,0,0.6); text-align: center;
        }
        .cabecera-preview {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; font-size: 13px; font-weight: 600; color: #e5e5ea;
        }
        #pesoArchivo {
            background: rgba(48,209,88,0.15); color: #30d158;
            border: 1px solid rgba(48,209,88,0.3); padding: 4px 10px;
            border-radius: 12px; font-weight: 700; font-size: 11px;
        }
        .contenedor-media {
            width: 100%; max-height: 55vh; border-radius: 14px; overflow: hidden;
            background: #000000; margin-bottom: 14px;
            display: flex; justify-content: center; align-items: center;
        }
        .contenedor-media img, .contenedor-media video {
            max-width: 100%; max-height: 55vh; object-fit: contain; display: block;
        }
        .acciones-preview { display: flex; gap: 8px; }
        .btn-modal {
            flex: 1; padding: 12px 10px; border: none; border-radius: 12px;
            font-size: 13px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            touch-action: manipulation;
        }
        #btnCerrarPreview { background: #2c2c2e; color: #ffffff; flex: 0.7; }
        #btnCompartir { display: none; background: #30d158; color: #000000; }
        #btnDescargar { background: #0a84ff; color: #ffffff; }

        /* FICHA */
        #panelInferior {
            position: fixed; bottom: 0; left: 50%; transform: translate(-50%, 110%);
            width: 100%; max-width: 600px; background-color: #f2f0eb;
            border-radius: 22px 22px 0 0; padding: 20px 24px 28px 24px;
            z-index: 400; box-shadow: 0 -8px 30px rgba(0,0,0,0.45);
            transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
            max-height: 80vh; overflow-y: auto;
        }
        #panelInferior.visible { transform: translate(-50%, 0%); }
        .cabecera-ficha {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 12px; margin-bottom: 14px;
        }
        .badge-categoria {
            display: inline-block; font-size: 10px; font-weight: bold; letter-spacing: 1.5px;
            color: #ffffff; background-color: #202020; padding: 5px 10px;
            border-radius: 6px; margin-bottom: 6px;
        }
        .titulo-obra { margin: 0; font-size: 22px; font-weight: 700; color: #202020; }
        .boton-cerrar-ficha {
            background-color: #202020; color: #ffffff; border: none;
            border-radius: 8px; padding: 9px 14px; font-size: 12px;
            font-weight: bold; cursor: pointer;
        }
        .datos-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
            padding-top: 14px; border-top: 1px solid #dcd9d0; margin-bottom: 14px;
        }
        .etiqueta {
            display: block; font-size: 10px; font-weight: bold; letter-spacing: 1.4px;
            color: #777777; margin-bottom: 4px;
        }
        .valor { font-size: 14px; color: #222222; font-weight: 600; }
        .historia-texto {
            font-size: 14px; line-height: 1.6; color: #444444;
            margin: 8px 0 0 0; white-space: pre-line;
        }
        #botonMapa {
            display: none; margin-top: 14px; width: 100%; text-align: center;
            padding: 12px; background-color: #e4e1da; color: #202020;
            border: 1px solid #cccccc; border-radius: 8px;
            text-decoration: none; font-size: 12px; font-weight: bold;
        }
    </style>

    <!-- ===================================================== -->
    <!-- 3. HELPERS GLOBALES + COMPONENTES 3D                  -->
    <!-- ===================================================== -->
    <script>
        // Sincronización UI - Estado de carga
        window.estadoAR = {
            camaraLista: false,
            modeloListo: false,
            errorModelo: false,
            actualizarBadge: function () {
                const badge = document.getElementById('estadoCarga');
                if (!badge) return;
                if (this.errorModelo) {
                    badge.textContent = "⚠️ Error al cargar modelo";
                    badge.style.backgroundColor = "#8b0000";
                    return;
                }
                if (this.camaraLista && this.modeloListo) {
                    badge.textContent = "✓ Listo para escanear";
                } else if (this.camaraLista && !this.modeloListo) {
                    badge.textContent = "Cargando modelo 3D...";
                } else if (!this.camaraLista && this.modeloListo) {
                    badge.textContent = "Iniciando cámara...";
                }
            }
        };

        function calcularResolucionCaptura(vw, vh, modo) {
            const minSide = Math.min(vw, vh);
            const escalaBase = (modo === 'video' ? 1080 : 1440) / minSide;
            const capLong = modo === 'video' ? 2560 : 3840;

            let outW = Math.round((vw * escalaBase) / 2) * 2;
            let outH = Math.round((vh * escalaBase) / 2) * 2;

            if (Math.max(outW, outH) > capLong) {
                const s = capLong / Math.max(outW, outH);
                outW = Math.round((outW * s) / 2) * 2;
                outH = Math.round((outH * s) / 2) * 2;
            }
            return { w: Math.max(2, outW), h: Math.max(2, outH) };
        }

        window.capturadorAR = {
            solicitarFoto: false,
            grabandoVideo: false,
            canvasCompuesto: null,
            ctxCompuesto: null
        };

        AFRAME.registerComponent('compositor-ar', {
            init: function () {
                const canvas = document.createElement('canvas');
                canvas.width = 720;
                canvas.height = 960;
                window.capturadorAR.canvasCompuesto = canvas;
                window.capturadorAR.ctxCompuesto = canvas.getContext('2d', { alpha: false });

                this._lastDrawTime = 0;
                this._rects = null;

                window.addEventListener('resize', () => { this._rects = null; });
                window.addEventListener('orientationchange', () => { this._rects = null; });
            },

            invalidarRects: function () { this._rects = null; },

            _getRects: function () {
                if (this._rects) return this._rects;
                const video = document.querySelector('video');
                const glCanvas = this.el.canvas;
                if (!glCanvas) return null;

                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;
                const vRect = (video && video.readyState >= 2)
                    ? video.getBoundingClientRect()
                    : { left: 0, top: 0, width: vw, height: vh };

                const cRect = glCanvas.getBoundingClientRect();
                this._rects = { video, glCanvas, vRect, cRect, vw, vh };
                return this._rects;
            },

            tock: function (time) {
                if (!window.capturadorAR.solicitarFoto && !window.capturadorAR.grabandoVideo) return;
                if (window.capturadorAR.grabandoVideo) {
                    if (time - this._lastDrawTime < 33) return;
                    this._lastDrawTime = time;
                }
                this.dibujarFrame();
            },

            dibujarFrame: function () {
                const compCanvas = window.capturadorAR.canvasCompuesto;
                const ctx = window.capturadorAR.ctxCompuesto;
                if (!compCanvas || !ctx) return;

                const r = this._getRects();
                if (!r || !r.glCanvas) return;
                const { video, glCanvas, vRect, cRect, vw, vh } = r;

                if (!window.capturadorAR.grabandoVideo && window.capturadorAR.solicitarFoto) {
                    const target = calcularResolucionCaptura(vw, vh, 'foto');
                    if (compCanvas.width !== target.w || compCanvas.height !== target.h) {
                        compCanvas.width = target.w;
                        compCanvas.height = target.h;
                    }
                }

                const W = compCanvas.width;
                const H = compCanvas.height;

                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, W, H);

                if (video && video.readyState >= 2) {
                    ctx.save();
                    if (window.modoCamaraActual === "user") {
                        ctx.translate(W, 0);
                        ctx.scale(-1, 1);
                    }
                    ctx.drawImage(video, (vRect.left / vw) * W, (vRect.top / vh) * H, (vRect.width / vw) * W, (vRect.height / vh) * H);
                    ctx.restore();
                }

                ctx.drawImage(glCanvas, (cRect.left / vw) * W, (cRect.top / vh) * H, (cRect.width / vw) * W, (cRect.height / vh) * H);

                if (window.capturadorAR.solicitarFoto) {
                    window.capturadorAR.solicitarFoto = false;
                    compCanvas.toBlob((blob) => {
                        if (blob && window.mostrarVistaPreviaArchivo) {
                            window.mostrarVistaPreviaArchivo(blob, 'foto');
                        }
                    }, 'image/jpeg', window.ficha.calidadFotoJPEG || 0.92);
                }
            }
        });

        AFRAME.registerComponent('modelo-animado-ar', {
            init: function () {
                this.mixer = null;
                this.actions = [];
                this.activo = false;
                this.giroRespaldo = false;
                this.contenedor = null;

                const el = this.el;
                const THREE = AFRAME.THREE;

                const cargarGLB = () => {
                    const loader = new THREE.GLTFLoader();
                    if (window.MeshoptDecoder) loader.setMeshoptDecoder(window.MeshoptDecoder);

                    if (THREE.DRACOLoader) {
                        const dracoLoader = new THREE.DRACOLoader();
                        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                        loader.setDRACOLoader(dracoLoader);
                    }

                    loader.load(
                        window.ficha.modelo,
                        (gltf) => {
                            const model = gltf.scene;
                            const wrapper = new THREE.Group();
                            wrapper.add(model);

                            model.updateMatrixWorld(true);
                            const box = new THREE.Box3().setFromObject(model);
                            const size = box.getSize(new THREE.Vector3());
                            const center = box.getCenter(new THREE.Vector3());
                            const maxDim = Math.max(size.x, size.y, size.z);

                            if (Number.isFinite(maxDim) && maxDim > 0) {
                                const factor = (window.ficha.escala || 14.4) / maxDim;
                                model.position.set(-center.x, -center.y, -center.z);
                                wrapper.scale.setScalar(factor);
                            } else {
                                wrapper.scale.setScalar(window.ficha.escala || 14.4);
                            }

                            // Limpiado el error de WebGL: 
                            // Solo se desactiva frustum culling, sin forzar mipmaps en texturas comprimidas
                            model.traverse((node) => {
                                if (node.isMesh) node.frustumCulled = false;
                            });

                            el.setObject3D('mesh', wrapper);
                            this.contenedor = wrapper;

                            if (gltf.animations && gltf.animations.length > 0) {
                                this.mixer = new THREE.AnimationMixer(model);
                                gltf.animations.forEach((clip) => {
                                    const action = this.mixer.clipAction(clip);
                                    action.setLoop(THREE.LoopRepeat, Infinity);
                                    if (this.activo) action.play();
                                    this.actions.push(action);
                                });
                            } else {
                                this.giroRespaldo = true;
                            }

                            window.estadoAR.modeloListo = true;
                            window.estadoAR.actualizarBadge();
                        },
                        undefined,
                        (error) => {
                            console.error("Error cargando GLB:", error);
                            window.estadoAR.errorModelo = true;
                            window.estadoAR.actualizarBadge();
                        }
                    );
                };

                if (window.MeshoptDecoder && window.MeshoptDecoder.ready) {
                    window.MeshoptDecoder.ready.then(cargarGLB).catch(() => cargarGLB());
                } else {
                    cargarGLB();
                }

                const targetEl = document.getElementById('objetivoAR');
                targetEl.addEventListener('targetFound', () => {
                    this.activo = true;
                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(a => {
                            a.paused = false;
                            a.reset();
                            a.play();
                        });
                    }
                });

                targetEl.addEventListener('targetLost', () => {
                    this.activo = false;
                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(a => { a.paused = true; });
                    }
                });
            },

            tick: function (time, timeDelta) {
                if (!this.activo) return;
                const delta = Math.min(timeDelta / 1000, 0.05);
                if (this.mixer) {
                    this.mixer.update(delta);
                } else if (this.giroRespaldo && this.contenedor) {
                    this.contenedor.rotation.y += delta * 1.5;
                }
            }
        });
    </script>
</head>

<body>

    <div id="flashPantalla"></div>

    <div class="top-bar">
        <div id="estadoCarga">Iniciando cámara...</div>
        <button id="btnAbrirFicha" aria-label="Información de la pieza">i</button>
    </div>

    <div id="ui-escaneo">
        <div class="marco-escaner" id="marcoEscaner">
            <div class="linea-escaner"></div>
            <div class="check-detectado">✓</div>
        </div>
        <div class="instruccion-ar" id="instruccionAR">
            Apunta la cámara hacia la imagen marcador
        </div>
    </div>

    <div class="contenedor-controles">
        <div id="badgeTiempo">
            <span class="punto-parpadeo"></span>
            <span id="textoTiempo">00:00</span>
        </div>

        <div class="dock-captura">
            <button class="btn-icono" id="btnFoto" aria-label="Tomar foto">
                <div class="nucleo-foto">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
            </button>

            <button class="btn-icono" id="btnVideo" aria-label="Grabar video">
                <div class="nucleo-video"></div>
            </button>

            <button class="btn-icono" id="btnCambiarCamara" aria-label="Cambiar cámara">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"></path>
                    <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"></path>
                </svg>
            </button>
        </div>
    </div>

    <div id="modalPreview">
        <div class="tarjeta-preview">
            <div class="cabecera-preview">
                <span id="tituloPreview">Captura lista</span>
                <span id="pesoArchivo">0 KB</span>
            </div>
            <div class="contenedor-media" id="contenedorMedia"></div>
            <div class="acciones-preview">
                <button class="btn-modal" id="btnCerrarPreview">✕</button>
                <button class="btn-modal" id="btnCompartir">Guardar</button>
                <button class="btn-modal" id="btnDescargar">⬇ Descargar</button>
            </div>
        </div>
    </div>

    <section id="panelInferior">
        <div class="cabecera-ficha">
            <div>
                <span class="badge-categoria" id="uiCategoria"></span>
                <h1 class="titulo-obra" id="uiTitulo"></h1>
            </div>
            <button class="boton-cerrar-ficha" id="btnCerrarFicha">CERRAR</button>
        </div>

        <div class="datos-grid">
            <div>
                <span class="etiqueta">AUTOR</span>
                <div class="valor" id="uiAutor"></div>
            </div>
            <div>
                <span class="etiqueta">AÑO</span>
                <div class="valor" id="uiAnio"></div>
            </div>
            <div style="grid-column: span 2;">
                <span class="etiqueta">UBICACIÓN</span>
                <div class="valor" id="uiUbicacion"></div>
                <a id="botonMapa" href="#" target="_blank" rel="noopener noreferrer">VER UBICACIÓN EN GOOGLE MAPS</a>
            </div>
        </div>
        <span class="etiqueta">DESCRIPCIÓN</span>
        <p class="historia-texto" id="uiHistoria"></p>
    </section>

    <!-- ===================================================== -->
    <!-- ESCENA AR                                             -->
    <!-- ===================================================== -->
    <a-scene
        id="escenaAR"
        compositor-ar
        loading-screen="enabled: false"
        mindar-image="imageTargetSrc: ./targets/imagen_rastreo.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
        color-space="sRGB"
        renderer="colorManagement: true; antialias: true; alpha: true; preserveDrawingBuffer: true; powerPreference: high-performance;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-light type="hemisphere" color="#ffffff" groundColor="#5a5a5a" intensity="0.7"></a-light>
        <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2.0" position="1.5 2.5 2"></a-light>
        <a-light type="directional" color="#ffdcb4" intensity="0.9" position="-1.5 -1 1"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="objetivoAR">
            <a-entity
                id="entidadModelo"
                position="0 0 0.1"
                rotation="0 0 0"
                modelo-animado-ar>
            </a-entity>
        </a-entity>

    </a-scene>

    <!-- ===================================================== -->
    <!-- LÓGICA DE INTERFAZ, CÁMARA Y GRABACIÓN                -->
    <!-- ===================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const escenaEl = document.getElementById("escenaAR");
            const estadoCarga = document.getElementById("estadoCarga");

            // Eventos de estado de cámara MindAR
            escenaEl.addEventListener("arReady", () => {
                window.estadoAR.camaraLista = true;
                window.estadoAR.actualizarBadge();
            });

            escenaEl.addEventListener("arError", (ev) => {
                console.error("Error al iniciar MindAR:", ev);
                estadoCarga.textContent = "⚠️ Permiso de cámara requerido";
                estadoCarga.style.backgroundColor = "#8b0000";
            });

            document.getElementById("uiCategoria").textContent = window.ficha.categoria;
            document.getElementById("uiTitulo").textContent = window.ficha.titulo;
            document.getElementById("uiAutor").textContent = window.ficha.autor;
            document.getElementById("uiAnio").textContent = window.ficha.anio;
            document.getElementById("uiUbicacion").textContent = window.ficha.ubicacion;
            document.getElementById("uiHistoria").textContent = window.ficha.historia;

            const entidadModelo = document.getElementById("entidadModelo");
            if (window.ficha.rotacionInicial) {
                entidadModelo.setAttribute("rotation", window.ficha.rotacionInicial);
            }

            const botonMapa = document.getElementById("botonMapa");
            if (window.ficha.mapa && window.ficha.mapa.trim() !== "") {
                botonMapa.href = window.ficha.mapa;
                botonMapa.style.display = "block";
            }

            function aplicarViewerPixelRatio() {
                const renderer = escenaEl && escenaEl.renderer;
                if (!renderer || typeof renderer.setPixelRatio !== 'function') return;
                const dpr = window.devicePixelRatio || 1;
                const target = Math.min(dpr, window.ficha.viewerPixelRatioMax || 2.0);
                const current = (typeof renderer.getPixelRatio === 'function') ? renderer.getPixelRatio() : 1;
                if (current < target) renderer.setPixelRatio(target);
            }

            if (escenaEl.hasLoaded) aplicarViewerPixelRatio();
            else escenaEl.addEventListener('loaded', aplicarViewerPixelRatio);

            const panelInferior = document.getElementById("panelInferior");
            const btnAbrirFicha = document.getElementById("btnAbrirFicha");
            const btnCerrarFicha = document.getElementById("btnCerrarFicha");

            btnAbrirFicha.addEventListener("click", () => panelInferior.classList.add("visible"));
            btnCerrarFicha.addEventListener("click", () => panelInferior.classList.remove("visible"));

            const objetivoAR = document.getElementById("objetivoAR");
            const uiEscaneo = document.getElementById("ui-escaneo");
            const marcoEscaner = document.getElementById("marcoEscaner");
            const instruccionAR = document.getElementById("instruccionAR");
            let timeoutOcultarUI = null;

            objetivoAR.addEventListener("targetFound", () => {
                clearTimeout(timeoutOcultarUI);
                marcoEscaner.classList.add("detectado");
                instruccionAR.classList.add("detectado");
                instruccionAR.textContent = "✓ Imagen detectada";
                btnAbrirFicha.style.display = "flex";
                if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }

                timeoutOcultarUI = setTimeout(() => {
                    uiEscaneo.style.opacity = "0";
                    estadoCarga.style.opacity = "0.5";
                }, 600);
            });

            objetivoAR.addEventListener("targetLost", () => {
                clearTimeout(timeoutOcultarUI);
                uiEscaneo.style.opacity = "1";
                marcoEscaner.classList.remove("detectado");
                instruccionAR.classList.remove("detectado");
                instruccionAR.textContent = "Apunta la cámara hacia la imagen marcador";
                panelInferior.classList.remove("visible");
                btnAbrirFicha.style.display = "none";
                estadoCarga.style.opacity = "1";
            });

            const btnCambiarCamara = document.getElementById("btnCambiarCamara");

            function invalidarRectsCompositor() {
                const comp = escenaEl.components["compositor-ar"];
                if (comp && typeof comp.invalidarRects === "function") comp.invalidarRects();
            }

            btnCambiarCamara.addEventListener("click", () => {
                if (window._cambiandoCamara) return;
                window._cambiandoCamara = true;
                btnCambiarCamara.disabled = true;
                btnCambiarCamara.classList.toggle("girando");

                try {
                    const mindarSystem = escenaEl.systems["mindar-image-system"];
                    if (mindarSystem && typeof mindarSystem.switchCamera === "function") {
                        mindarSystem.switchCamera();
                    }
                } catch (err) {
                    console.warn("Error al cambiar cámara:", err);
                }
                
                invalidarRectsCompositor();
                setTimeout(invalidarRectsCompositor, 400);

                setTimeout(() => {
                    btnCambiarCamara.disabled = false;
                    window._cambiandoCamara = false;
                }, 800);
            });

            const btnFoto = document.getElementById("btnFoto");
            const flashPantalla = document.getElementById("flashPantalla");

            btnFoto.addEventListener("click", async () => {
                if (window.capturadorAR.grabandoVideo) return;
                flashPantalla.style.opacity = "0.85";
                setTimeout(() => { flashPantalla.style.opacity = "0"; }, 180);

                const renderer = escenaEl.renderer;
                const originalPR = renderer ? renderer.getPixelRatio() : 1;
                if (renderer) {
                    const boost = Math.min((window.devicePixelRatio || 1) * 1.5, 4);
                    renderer.setPixelRatio(Math.max(originalPR, boost));
                }

                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                window.capturadorAR.solicitarFoto = true;

                setTimeout(() => {
                    if (renderer) renderer.setPixelRatio(originalPR);
                }, 900);
            });

            const btnVideo = document.getElementById("btnVideo");
            const badgeTiempo = document.getElementById("badgeTiempo");
            const textoTiempo = document.getElementById("textoTiempo");

            let mediaRecorder = null;
            let fragmentosVideo = [];
            let intervaloTiempo = null;
            let segundosGrabados = 0;
            let originalPRForVideo = null;

            function obtenerMimeTypeOptimizado() {
                const tipos = ["video/mp4;codecs=avc1.42E01E", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
                if (!window.MediaRecorder) return "";
                for (const t of tipos) {
                    if (MediaRecorder.isTypeSupported(t)) return t;
                }
                return "";
            }

            async function iniciarGrabacion() {
                const renderer = escenaEl.renderer;
                originalPRForVideo = renderer ? renderer.getPixelRatio() : 1;
                if (renderer) {
                    const boost = Math.min((window.devicePixelRatio || 1) * 1.5, 3);
                    renderer.setPixelRatio(Math.max(originalPRForVideo, boost));
                }

                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                const compCanvas = window.capturadorAR.canvasCompuesto;
                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;
                const target = calcularResolucionCaptura(vw, vh, 'video');
                compCanvas.width = target.w;
                compCanvas.height = target.h;

                invalidarRectsCompositor();

                window.capturadorAR.solicitarFoto = false;
                window.capturadorAR.grabandoVideo = true;

                const comp = escenaEl.components["compositor-ar"];
                if (comp) comp.dibujarFrame();

                fragmentosVideo = [];
                const stream = compCanvas.captureStream(window.ficha.fpsVideo || 30);
                const mimeType = obtenerMimeTypeOptimizado();

                const opciones = { videoBitsPerSecond: window.ficha.bitrateVideo || 15000000 };
                if (mimeType) opciones.mimeType = mimeType;

                try {
                    mediaRecorder = new MediaRecorder(stream, opciones);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) fragmentosVideo.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const tipoFinal = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : "video/mp4";
                    const blob = new Blob(fragmentosVideo, { type: tipoFinal });
                    if (blob.size > 0 && window.mostrarVistaPreviaArchivo) {
                        window.mostrarVistaPreviaArchivo(blob, "video");
                    }
                };

                mediaRecorder.start(250);
                btnVideo.classList.add("grabando");
                badgeTiempo.classList.add("activo");
                segundosGrabados = 0;
                textoTiempo.textContent = "00:00";

                intervaloTiempo = setInterval(() => {
                    segundosGrabados++;
                    const min = String(Math.floor(segundosGrabados / 60)).padStart(2, "0");
                    const seg = String(segundosGrabados % 60).padStart(2, "0");
                    textoTiempo.textContent = `${min}:${seg}`;

                    if (window.ficha.maxDuracionVideoSeg && segundosGrabados >= window.ficha.maxDuracionVideoSeg) {
                        detenerGrabacion();
                    }
                }, 1000);
            }

            function detenerGrabacion() {
                window.capturadorAR.grabandoVideo = false;
                clearInterval(intervaloTiempo);
                btnVideo.classList.remove("grabando");
                badgeTiempo.classList.remove("activo");

                if (escenaEl.renderer && originalPRForVideo !== null) {
                    setTimeout(() => {
                        escenaEl.renderer.setPixelRatio(originalPRForVideo);
                        originalPRForVideo = null;
                    }, 400);
                }

                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    try { mediaRecorder.requestData(); } catch (e) {}
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
                    }, 120);
                }
            }

            btnVideo.addEventListener("click", () => {
                if (!window.capturadorAR.grabandoVideo) {
                    iniciarGrabacion().catch(err => {
                        window.capturadorAR.grabandoVideo = false;
                        btnVideo.classList.remove("grabando");
                        badgeTiempo.classList.remove("activo");
                        clearInterval(intervaloTiempo);
                    });
                } else {
                    detenerGrabacion();
                }
            });

            const modalPreview = document.getElementById("modalPreview");
            const contenedorMedia = document.getElementById("contenedorMedia");
            const pesoArchivo = document.getElementById("pesoArchivo");
            const tituloPreview = document.getElementById("tituloPreview");
            const btnCerrarPreview = document.getElementById("btnCerrarPreview");
            const btnCompartir = document.getElementById("btnCompartir");
            const btnDescargar = document.getElementById("btnDescargar");

            let urlArchivoActual = null;
            let archivoActualObj = null;
            let nombreArchivoActual = "";

            window.mostrarVistaPreviaArchivo = (blob, tipo) => {
                if (urlArchivoActual) try { URL.revokeObjectURL(urlArchivoActual); } catch (e) {}

                urlArchivoActual = URL.createObjectURL(blob);
                contenedorMedia.innerHTML = "";

                const kb = blob.size / 1024;
                pesoArchivo.textContent = kb < 1024 ? `${Math.max(1, Math.round(kb))} KB` : `${(kb / 1024).toFixed(2)} MB`;

                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");

                if (tipo === "foto") {
                    tituloPreview.textContent = "Fotografía AR";
                    nombreArchivoActual = `foto-ar-${timestamp}.jpg`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: "image/jpeg" });
                    const img = document.createElement("img");
                    img.src = urlArchivoActual;
                    contenedorMedia.appendChild(img);
                } else {
                    tituloPreview.textContent = "Video AR (HD)";
                    const esMp4 = blob.type && blob.type.includes("mp4");
                    const ext = esMp4 ? "mp4" : "webm";
                    const mimeLimpio = esMp4 ? "video/mp4" : "video/webm";
                    nombreArchivoActual = `video-ar-${timestamp}.${ext}`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: mimeLimpio });

                    const vid = document.createElement("video");
                    vid.src = urlArchivoActual;
                    vid.controls = true;
                    vid.autoplay = true;
                    vid.loop = true;
                    vid.muted = true;
                    vid.playsInline = true;
                    contenedorMedia.appendChild(vid);
                }

                if (navigator.canShare && archivoActualObj && navigator.canShare({ files: [archivoActualObj] })) {
                    btnCompartir.style.display = "flex";
                } else {
                    btnCompartir.style.display = "none";
                }

                modalPreview.classList.add("activo");
            };

            btnCerrarPreview.addEventListener("click", () => {
                modalPreview.classList.remove("activo");
                contenedorMedia.innerHTML = "";
            });

            btnCompartir.addEventListener("click", async () => {
                if (!archivoActualObj) return;
                try {
                    await navigator.share({ files: [archivoActualObj], title: window.ficha.titulo });
                } catch (e) { }
            });

            btnDescargar.addEventListener("click", () => {
                if (!urlArchivoActual) return;
                const a = document.createElement("a");
                a.style.display = "none";
                a.href = urlArchivoActual;
                a.download = nombreArchivoActual;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 200);
            });
        });
    </script>

</body>
</html>
