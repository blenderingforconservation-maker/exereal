    <script>
        window.ficha = {
            modelo: "./models/giro-torimask-opt.glb",
            marcadorMind: "./targets/imagen_rastreo.mind",
            instagramUrl: "https://www.instagram.com/asteroidae9999/?hl=en",

            // Escala base del modelo (3 veces la base 1.2 = 3.6)
            escala: 3.6,
            rotacionInicial: "0 0 0",

            // ===== Velocidad de Giro Más Lenta y Majestuosa =====
            velocidadAnimacion: 0.38,      // Escala de tiempo del AnimationMixer (0.38 = giro pausado y fluido)
            velocidadGiroRespaldo: 0.42,   // Radianes/seg si el GLB no trae pista o en modo respaldo

            // ===== Acabado Negro Metalizado para el Tribal =====
            tribalColorHex: 0x101216,
            tribalMetalness: 0.85,
            tribalRoughness: 0.22,

            // ===== Estabilidad de Seguimiento y Materialización =====
            tiempoRetencionPerdidaMs: 4500, // Retiene el modelo 4.5s si se pierde momentáneamente el sticker
            duracionMaterializacionMs: 1650,
            duracionDesmaterializacionMs: 500,
            suavizadoPose: 18.0,            // Seguimiento fluido del target en tiempo real

            // ===== Calidad de Captura Multimedia =====
            calidadFotoJPEG: 0.92,
            bitrateVideo: 12000000,
            fpsVideo: 30,
            maxDuracionVideoSeg: 60,

            // ===== Optimización de Cámara y GPU Móvil =====
            camara: { width: 1280, height: 720 },
            viewerPixelRatioMax: 1.5,

            categoria: "Stickers RA",
            titulo: "Guerrero Demonio",
            autor: "Rawnin del Desierto",
            anio: "2026",
            ubicacion: "Mexa Web",
            mapa: "",
            historia: "Pieza interactiva en Realidad Aumentada con seguimiento espacial del sticker, exploración táctil en 360° y materialización holográfica."
        };

        // Forzar cámara trasera (environment) con resolución ágil de 720p a 30fps
        window.modoCamaraActual = "environment";

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const getUserMediaOriginal = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
            navigator.mediaDevices.getUserMedia = function (constraints) {
                if (constraints && constraints.video) {
                    const videoBase = typeof constraints.video === "object" ? constraints.video : {};
                    constraints = {
                        ...constraints,
                        video: {
                            ...videoBase,
                            facingMode: { ideal: "environment" },
                            width: { ideal: window.ficha.camara.width },
                            height: { ideal: window.ficha.camara.height },
                            frameRate: { ideal: 30, max: 30 }
                        }
                    };
                }
                return getUserMediaOriginal(constraints);
            };
        }
    </script>

    <script>
        // Helper de Caché local para ahorrar datos móviles en visitas repetidas
        async function obtenerUrlConCache(url) {
            if (!('caches' in window)) return url;
            try {
                const cache = await caches.open('torimask-ar-cache-v1');
                let response = await cache.match(url);
                if (!response) {
                    response = await fetch(url, { cache: 'force-cache' });
                    if (response && response.ok) {
                        cache.put(url, response.clone());
                    } else {
                        return url;
                    }
                }
                const blob = await response.blob();
                return URL.createObjectURL(blob);
            } catch (e) {
                return url;
            }
        }

        function calcularResolucionCaptura(vw, vh, modo) {
            const minSide = Math.min(vw, vh);
            const escalaBase = (modo === 'video' ? 1080 : 1440) / minSide;
            const capLong = modo === 'video' ? 2560 : 3840;

            let outW = Math.round((vw * escalaBase) / 2) * 2;
            let outH = Math.round((vh * escalaBase) / 2) * 2;

            if (Math.max(outW, outH) > capLong) {
                const s = capLong / Math.max(outW, outH);
                outW = Math.round((outW * s) / 2) * 2;
                outH = Math.round((outH * s) / 2) * 2;
            }
            return { w: Math.max(2, outW), h: Math.max(2, outH) };
        }

        window.capturadorAR = {
            solicitarFoto: false,
            grabandoVideo: false,
            canvasCompuesto: null,
            ctxCompuesto: null
        };

        // ============================================================
        // COMPOSITOR: une cámara + 3D únicamente al tomar foto o video
        // ============================================================
        AFRAME.registerComponent('compositor-ar', {
            init: function () {
                const canvas = document.createElement('canvas');
                canvas.width = 720;
                canvas.height = 960;
                window.capturadorAR.canvasCompuesto = canvas;
                window.capturadorAR.ctxCompuesto = canvas.getContext('2d', { alpha: false });

                this._lastDrawTime = 0;
                this._rects = null;

                window.addEventListener('resize', () => { this._rects = null; }, { passive: true });
                window.addEventListener('orientationchange', () => { this._rects = null; }, { passive: true });
            },

            invalidarRects: function () { this._rects = null; },

            _getRects: function () {
                if (this._rects) return this._rects;

                const video = document.querySelector('video');
                const glCanvas = this.el.canvas;
                if (!glCanvas) return null;

                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;

                const vRect = (video && video.readyState >= 2)
                    ? video.getBoundingClientRect()
                    : { left: 0, top: 0, width: vw, height: vh };

                const cRect = glCanvas.getBoundingClientRect();

                this._rects = { video, glCanvas, vRect, cRect, vw, vh };
                return this._rects;
            },

            tock: function (time) {
                if (!window.capturadorAR.solicitarFoto && !window.capturadorAR.grabandoVideo) return;

                if (window.capturadorAR.grabandoVideo) {
                    if (time - this._lastDrawTime < 33) return;
                    this._lastDrawTime = time;
                }

                this.dibujarFrame();
            },

            dibujarFrame: function () {
                const compCanvas = window.capturadorAR.canvasCompuesto;
                const ctx = window.capturadorAR.ctxCompuesto;
                if (!compCanvas || !ctx) return;

                const r = this._getRects();
                if (!r || !r.glCanvas) return;

                const { video, glCanvas, vRect, cRect, vw, vh } = r;

                if (!window.capturadorAR.grabandoVideo && window.capturadorAR.solicitarFoto) {
                    const target = calcularResolucionCaptura(vw, vh, 'foto');
                    if (compCanvas.width !== target.w || compCanvas.height !== target.h) {
                        compCanvas.width = target.w;
                        compCanvas.height = target.h;
                    }
                }

                const W = compCanvas.width;
                const H = compCanvas.height;

                ctx.fillStyle = '#05070d';
                ctx.fillRect(0, 0, W, H);

                if (video && video.readyState >= 2) {
                    ctx.drawImage(
                        video,
                        (vRect.left / vw) * W,
                        (vRect.top / vh) * H,
                        (vRect.width / vw) * W,
                        (vRect.height / vh) * H
                    );
                }

                ctx.drawImage(
                    glCanvas,
                    (cRect.left / vw) * W,
                    (cRect.top / vh) * H,
                    (cRect.width / vw) * W,
                    (cRect.height / vh) * H
                );

                if (window.capturadorAR.solicitarFoto) {
                    window.capturadorAR.solicitarFoto = false;
                    compCanvas.toBlob((blob) => {
                        if (blob && window.mostrarVistaPreviaArchivo) {
                            window.mostrarVistaPreviaArchivo(blob, 'foto');
                        }
                    }, 'image/jpeg', window.ficha.calidadFotoJPEG || 0.92);
                }
            }
        });

        // ============================================================
        // COMPONENTE PRINCIPAL: SEGUIMIENTO DEL TARGET + GIRO LENTO +
        // EXPLORACIÓN TÁCTIL 360° + TRIBAL NEGRO METALIZADO
        // ============================================================
        AFRAME.registerComponent('modelo-cyberpunk-ar', {
            init: function () {
                const THREE = AFRAME.THREE;
                this.mixer = null;
                this.actions = [];
                this.giroRespaldo = false;
                this.contenedor = null;
                this.grupoExploracion = new THREE.Group();
                this.anilloEscaner = null;
                this.materialesAnimables = [];

                this.estado = 'OCULTO';
                this.progresoMat = 0;
                this.rastreandoEnVivo = false;
                this.simulandoPreview = false;
                this.tiempoPerdidaInicio = 0;
                this.poseInicializada = false;
                this.relojPulso = 0;
                this.smoothDelta = 1 / 60;

                // Variables para exploración interactiva 360° (drag + pinch zoom)
                this.rotUsuarioY = 0;
                this.rotUsuarioX = 0;
                this.targetRotUsuarioY = 0;
                this.targetRotUsuarioX = 0;
                this.escalaUsuario = 1.0;
                this.targetEscalaUsuario = 1.0;
                this.anguloGiroLento = 0;

                this.minYLocal = -1.8;
                this.maxYLocal = 1.8;

                this._tPos = new THREE.Vector3();
                this._tQuat = new THREE.Quaternion();
                this._tScale = new THREE.Vector3();
                this._planeNormal = new THREE.Vector3();
                this._planePoint = new THREE.Vector3();
                // Plano de corte persistente sin recompilación de shaders
                this.planoCorte = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1000);

                const el = this.el;
                const anclaEstable = document.getElementById('anclaEstableAR');
                const targetEl = document.getElementById('objetivoAR');
                const estadoUI = document.getElementById('estadoCarga');
                const statusPill = document.getElementById('statusPill');

                this.anclaObj = anclaEstable.object3D;
                this.targetObj = targetEl.object3D;
                this.anclaObj.visible = false;

                const configurarRenderer = () => {
                    if (el.sceneEl && el.sceneEl.renderer) {
                        el.sceneEl.renderer.localClippingEnabled = true;
                        el.sceneEl.renderer.shadowMap.enabled = false;
                    }
                };
                if (el.sceneEl.hasLoaded) configurarRenderer();
                else el.sceneEl.addEventListener('loaded', configurarRenderer);

                // Anillo de materialización holográfica
                const crearAnilloEscaner = (radio) => {
                    const group = new THREE.Group();

                    const geoRing = new THREE.RingGeometry(radio * 0.8, radio * 0.98, 36);
                    geoRing.rotateX(-Math.PI / 2);
                    const matRing = new THREE.MeshBasicMaterial({
                        color: 0x00f3ff,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.82,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });

                    const geoGlow = new THREE.RingGeometry(radio * 0.45, radio * 0.8, 36);
                    geoGlow.rotateX(-Math.PI / 2);
                    const matGlow = new THREE.MeshBasicMaterial({
                        color: 0xff2a75,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.25,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });

                    group.add(new THREE.Mesh(geoRing, matRing));
                    group.add(new THREE.Mesh(geoGlow, matGlow));
                    group.visible = false;
                    return group;
                };

                // Identifica la malla del tribal para aplicarle negro metalizado sin alterar la máscara
                const esMallaTribal = (node, mat, totalMallas) => {
                    const etiqueta = ((node.name || "") + " " + (node.parent?.name || "") + " " + (mat.name || "")).toLowerCase();
                    if (/tribal|sigil|symbol|curve|logo|tatu|demon|inner|vector|path/i.test(etiqueta)) {
                        return true;
                    }
                    if (/sphere|esfera|mask|mascara|face|cara|head|glass|orb/i.test(etiqueta)) {
                        return false;
                    }
                    if (!mat.map && mat.color) {
                        const luma = 0.299 * mat.color.r + 0.587 * mat.color.g + 0.114 * mat.color.b;
                        if (luma < 0.22 && totalMallas > 1) return true;
                    }
                    return false;
                };

                // ============================================================
                // MODELO 3D PROCEDURAL DE RESPALDO (PARA EL VISUALIZADOR LIVE)
                // Si ./models/giro-torimask-opt.glb no existe en el sandbox,
                // construye la esfera + Tribal Negro Metalizado + Tori Mask
                // ============================================================
                const construirModeloRespaldoProcedural = () => {
                    const root = new THREE.Group();

                    // 1. Tribal interior en Negro Metalizado (#101216)
                    const matTribal = new THREE.MeshStandardMaterial({
                        name: "tribal_metallic_black",
                        color: window.ficha.tribalColorHex ?? 0x101216,
                        metalness: window.ficha.tribalMetalness ?? 0.85,
                        roughness: window.ficha.tribalRoughness ?? 0.22,
                        side: THREE.DoubleSide,
                        clippingPlanes: [this.planoCorte]
                    });
                    matTribal.userData.origEmissive = matTribal.emissive.clone();
                    matTribal.userData.origEmissiveIntensity = 1.0;
                    this.materialesAnimables.push(matTribal);

                    const grupoTribal = new THREE.Group();
                    grupoTribal.name = "tribal_inner_sigil";

                    // Cuernos simétricos cyber-sigil + núcleo tribal
                    const geoCuerno = new THREE.TorusGeometry(0.42, 0.055, 16, 48, Math.PI * 1.15);
                    const cuernoIzq = new THREE.Mesh(geoCuerno, matTribal);
                    cuernoIzq.position.set(-0.22, 0.18, 0);
                    cuernoIzq.rotation.set(0.15, 0.2, 0.85);

                    const cuernoDer = new THREE.Mesh(geoCuerno, matTribal);
                    cuernoDer.position.set(0.22, 0.18, 0);
                    cuernoDer.rotation.set(0.15, -0.2, 2.29);

                    const geoNudo = new THREE.TorusKnotGeometry(0.28, 0.042, 80, 16, 2, 3);
                    const nudoCentral = new THREE.Mesh(geoNudo, matTribal);
                    nudoCentral.scale.set(1.0, 1.35, 0.55);

                    grupoTribal.add(cuernoIzq, cuernoDer, nudoCentral);
                    root.add(grupoTribal);

                    // 2. Acentos Oni / Tori Mask en rojo carmesí y dorado original
                    const matMascara = new THREE.MeshStandardMaterial({
                        name: "torimask_crimson",
                        color: 0xc81e32,
                        metalness: 0.35,
                        roughness: 0.32,
                        side: THREE.DoubleSide,
                        clippingPlanes: [this.planoCorte]
                    });
                    matMascara.userData.origEmissive = matMascara.emissive.clone();
                    matMascara.userData.origEmissiveIntensity = 1.0;
                    this.materialesAnimables.push(matMascara);

                    const geoAnilloMascara = new THREE.TorusGeometry(0.56, 0.025, 16, 64);
                    const aro1 = new THREE.Mesh(geoAnilloMascara, matMascara);
                    aro1.rotation.x = Math.PI / 3;
                    const aro2 = new THREE.Mesh(geoAnilloMascara, matMascara);
                    aro2.rotation.y = Math.PI / 3;
                    root.add(aro1, aro2);

                    // 3. Esfera exterior cristalina
                    const matEsfera = new THREE.MeshStandardMaterial({
                        name: "outer_sphere_mask",
                        color: 0xd8f4ff,
                        metalness: 0.2,
                        roughness: 0.12,
                        transparent: true,
                        opacity: 0.24,
                        depthWrite: false,
                        side: THREE.DoubleSide,
                        clippingPlanes: [this.planoCorte]
                    });
                    matEsfera.userData.origEmissive = matEsfera.emissive.clone();
                    matEsfera.userData.origEmissiveIntensity = 1.0;
                    this.materialesAnimables.push(matEsfera);

                    const geoEsfera = new THREE.SphereGeometry(0.68, 36, 36);
                    const meshEsfera = new THREE.Mesh(geoEsfera, matEsfera);
                    root.add(meshEsfera);

                    const escalaObjetivo = window.ficha.escala || 3.6;
                    root.scale.setScalar(escalaObjetivo * 0.55);

                    this.minYLocal = -escalaObjetivo * 0.58;
                    this.maxYLocal = escalaObjetivo * 0.58;

                    this.anilloEscaner = crearAnilloEscaner(escalaObjetivo * 0.52);
                    el.object3D.add(this.anilloEscaner);

                    this.grupoExploracion.add(root);
                    el.setObject3D('mesh', this.grupoExploracion);
                    this.contenedor = root;
                    this.giroRespaldo = true;

                    if (estadoUI) estadoUI.textContent = "Listo para escanear";
                    const btnSim = document.getElementById('btnSimularAR');
                    if (btnSim) btnSim.style.display = "inline-flex";
                };

                const cargarGLB = async () => {
                    const loader = new THREE.GLTFLoader();

                    const meshopt = (typeof MeshoptDecoder !== 'undefined') ? MeshoptDecoder : window.MeshoptDecoder;
                    if (meshopt) loader.setMeshoptDecoder(meshopt);

                    if (THREE.DRACOLoader) {
                        const dracoLoader = new THREE.DRACOLoader();
                        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                        loader.setDRACOLoader(dracoLoader);
                    }

                    const modelUrl = await obtenerUrlConCache(window.ficha.modelo);

                    loader.load(
                        modelUrl,
                        (gltf) => {
                            const model = gltf.scene;

                            // 1. Inicializar animaciones en loop infinito con velocidad más lenta (0.38x)
                            if (gltf.animations && gltf.animations.length > 0) {
                                this.mixer = new THREE.AnimationMixer(model);
                                this.mixer.timeScale = window.ficha.velocidadAnimacion ?? 0.38;
                                gltf.animations.forEach((clip) => {
                                    const action = this.mixer.clipAction(clip);
                                    action.setLoop(THREE.LoopRepeat, Infinity);
                                    action.play();
                                    this.actions.push(action);
                                });
                                this.mixer.update(0);
                            } else {
                                this.giroRespaldo = true;
                            }

                            // 2. Contar mallas y medir Bounding Box
                            model.updateMatrixWorld(true);
                            const boxGlobal = new THREE.Box3();
                            const listaNodos = [];

                            model.traverse((node) => {
                                if (node.isMesh) {
                                    node.frustumCulled = false;
                                    boxGlobal.expandByObject(node);
                                    listaNodos.push(node);
                                }
                            });

                            if (boxGlobal.isEmpty()) boxGlobal.setFromObject(model);

                            // 3. Configurar materiales manteniendo intactos los colores originales
                            // y aplicando negro metalizado al tribal interior
                            const materialesVistos = new Set();

                            listaNodos.forEach((node) => {
                                const origMats = Array.isArray(node.material) ? node.material : [node.material];
                                origMats.forEach((mat) => {
                                    if (!mat || materialesVistos.has(mat)) return;
                                    materialesVistos.add(mat);

                                    mat.side = THREE.DoubleSide;
                                    mat.clippingPlanes = [this.planoCorte];

                                    if (esMallaTribal(node, mat, listaNodos.length)) {
                                        if (mat.color) mat.color.setHex(window.ficha.tribalColorHex ?? 0x101216);
                                        if ('metalness' in mat) mat.metalness = window.ficha.tribalMetalness ?? 0.85;
                                        if ('roughness' in mat) mat.roughness = window.ficha.tribalRoughness ?? 0.22;
                                        mat.transparent = false;
                                        mat.opacity = 1.0;
                                        mat.depthWrite = true;
                                    }

                                    if (mat.emissive) {
                                        mat.userData.origEmissive = mat.emissive.clone();
                                        mat.userData.origEmissiveIntensity = mat.emissiveIntensity ?? 1.0;
                                    }
                                    mat.needsUpdate = true;
                                    this.materialesAnimables.push(mat);
                                });
                            });

                            const size = boxGlobal.getSize(new THREE.Vector3());
                            const center = boxGlobal.getCenter(new THREE.Vector3());
                            const maxDim = Math.max(size.x, size.y, size.z);

                            const pivotGroup = new THREE.Group();
                            const offsetGroup = new THREE.Group();

                            offsetGroup.add(model);
                            pivotGroup.add(offsetGroup);

                            const escalaObjetivo = window.ficha.escala || 3.6;
                            if (Number.isFinite(maxDim) && maxDim > 0.0001) {
                                const factor = escalaObjetivo / maxDim;
                                offsetGroup.position.set(-center.x, -center.y, -center.z);
                                pivotGroup.scale.setScalar(factor);
                            } else {
                                pivotGroup.scale.setScalar(escalaObjetivo);
                            }

                            this.minYLocal = -escalaObjetivo * 0.58;
                            this.maxYLocal = escalaObjetivo * 0.58;

                            this.anilloEscaner = crearAnilloEscaner(escalaObjetivo * 0.52);
                            el.object3D.add(this.anilloEscaner);

                            this.grupoExploracion.add(pivotGroup);
                            el.setObject3D('mesh', this.grupoExploracion);
                            this.contenedor = pivotGroup;

                            if (estadoUI) estadoUI.textContent = "Listo para escanear";
                        },
                        undefined,
                        () => {
                            // Si se ejecuta en el visualizador de código sin el archivo local .glb,
                            // activa automáticamente el modelo 3D procedural interactivo
                            construirModeloRespaldoProcedural();
                        }
                    );
                };

                const meshoptGlobal = (typeof MeshoptDecoder !== 'undefined') ? MeshoptDecoder : window.MeshoptDecoder;
                if (meshoptGlobal && meshoptGlobal.ready) {
                    meshoptGlobal.ready.then(cargarGLB).catch(() => cargarGLB());
                } else {
                    cargarGLB();
                }

                // ============================================================
                // GESTOS TÁCTILES Y DE MOUSE PARA EXPLORACIÓN 360° + ZOOM
                // ============================================================
                let arrastrando = false;
                let prevX = 0, prevY = 0;
                let distPinchInicial = 0;
                let escalaPinchInicial = 1.0;
                let ultimoTap = 0;

                const esElementoUI = (target) => {
                    return target && target.closest && target.closest('button, a, #panelInferior, #modalPreview');
                };

                window.addEventListener('pointerdown', (e) => {
                    if (this.estado === 'OCULTO' || esElementoUI(e.target)) return;
                    const ahora = performance.now();
                    if (ahora - ultimoTap < 280) {
                        // Doble toque: restablecer vista original
                        this.targetRotUsuarioY = 0;
                        this.targetRotUsuarioX = 0;
                        this.targetEscalaUsuario = 1.0;
                    }
                    ultimoTap = ahora;
                    arrastrando = true;
                    prevX = e.clientX;
                    prevY = e.clientY;
                }, { passive: true });

                window.addEventListener('pointermove', (e) => {
                    if (!arrastrando || this.estado === 'OCULTO') return;
                    const dx = e.clientX - prevX;
                    const dy = e.clientY - prevY;
                    prevX = e.clientX;
                    prevY = e.clientY;

                    this.targetRotUsuarioY += dx * 0.0085;
                    this.targetRotUsuarioX = THREE.MathUtils.clamp(
                        this.targetRotUsuarioX + dy * 0.0065,
                        -Math.PI * 0.42,
                        Math.PI * 0.42
                    );
                }, { passive: true });

                window.addEventListener('pointerup', () => { arrastrando = false; }, { passive: true });
                window.addEventListener('pointercancel', () => { arrastrando = false; }, { passive: true });

                // Pellizco con 2 dedos para zoom en móviles
                window.addEventListener('touchstart', (e) => {
                    if (this.estado === 'OCULTO') return;
                    if (e.touches.length === 2) {
                        arrastrando = false;
                        distPinchInicial = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        escalaPinchInicial = this.targetEscalaUsuario;
                    }
                }, { passive: true });

                window.addEventListener('touchmove', (e) => {
                    if (this.estado === 'OCULTO' || e.touches.length !== 2 || distPinchInicial <= 0) return;
                    const distActual = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const factor = distActual / distPinchInicial;
                    this.targetEscalaUsuario = THREE.MathUtils.clamp(escalaPinchInicial * factor, 0.5, 2.4);
                }, { passive: true });

                // Rueda del mouse para zoom en el visualizador de escritorio
                window.addEventListener('wheel', (e) => {
                    if (this.estado === 'OCULTO' || esElementoUI(e.target)) return;
                    this.targetEscalaUsuario = THREE.MathUtils.clamp(
                        this.targetEscalaUsuario - e.deltaY * 0.0012,
                        0.5,
                        2.4
                    );
                }, { passive: true });

                // ============================================================
                // ACTIVACIÓN POR TARGET DE MINDAR O SIMULADOR DEL VISUALIZADOR
                // ============================================================
                this.activarTarget = (esSimulacion = false) => {
                    this.rastreandoEnVivo = !esSimulacion;
                    this.simulandoPreview = esSimulacion;
                    this.anclaObj.visible = true;

                    if (esSimulacion && !this.poseInicializada) {
                        this.anclaObj.position.set(0, 0, -3.2);
                        this.anclaObj.quaternion.identity();
                        this.anclaObj.scale.setScalar(0.52);
                        this.poseInicializada = true;
                    }

                    if (this.mixer && this.actions.length > 0) {
                        this.mixer.timeScale = window.ficha.velocidadAnimacion ?? 0.38;
                        this.actions.forEach(a => {
                            a.paused = false;
                            a.play();
                        });
                    }

                    if (this.estado === 'OCULTO' || this.estado === 'DESMATERIALIZANDO') {
                        if (this.estado === 'OCULTO') this.progresoMat = 0.0;
                        this.estado = 'MATERIALIZANDO';
                        if (this.anilloEscaner) this.anilloEscaner.visible = true;
                    } else if (this.estado === 'RETENCION') {
                        this.estado = this.progresoMat < 1.0 ? 'MATERIALIZANDO' : 'ACTIVO';
                    }

                    if (statusPill) {
                        statusPill.classList.remove('retencion');
                        statusPill.classList.add('activo');
                    }
                    if (estadoUI) estadoUI.textContent = "Conectado · Explorable 360°";
                    if (window.mostrarHintExploracionUI) window.mostrarHintExploracionUI();
                };

                this.perderTarget = (inmediato = false) => {
                    this.rastreandoEnVivo = false;
                    this.simulandoPreview = false;
                    if (this.estado !== 'OCULTO') {
                        if (inmediato) {
                            this.estado = 'DESMATERIALIZANDO';
                            if (this.anilloEscaner) this.anilloEscaner.visible = true;
                        } else {
                            this.estado = 'RETENCION';
                            this.tiempoPerdidaInicio = performance.now();
                            if (statusPill) {
                                statusPill.classList.remove('activo');
                                statusPill.classList.add('retencion');
                            }
                            if (estadoUI) estadoUI.textContent = "Estabilizando...";
                        }
                    }
                };

                targetEl.addEventListener('targetFound', () => this.activarTarget(false));
                targetEl.addEventListener('targetLost', () => this.perderTarget(false));
            },

            restaurarColoresOriginales: function () {
                if (this.anilloEscaner) this.anilloEscaner.visible = false;
                this.planoCorte.constant = 1000;

                for (let i = 0; i < this.materialesAnimables.length; i++) {
                    const mat = this.materialesAnimables[i];
                    if (mat.emissive && mat.userData.origEmissive) {
                        mat.emissive.copy(mat.userData.origEmissive);
                        mat.emissiveIntensity = mat.userData.origEmissiveIntensity;
                    }
                }
            },

            actualizarEfectoMaterializacion: function (delta) {
                const THREE = AFRAME.THREE;
                if (this.estado === 'MATERIALIZANDO') {
                    const dur = (window.ficha.duracionMaterializacionMs || 1650) / 1000;
                    this.progresoMat = Math.min(1.0, this.progresoMat + delta / dur);
                    if (this.progresoMat >= 1.0) {
                        this.estado = 'ACTIVO';
                        this.restaurarColoresOriginales();
                        return;
                    }
                } else if (this.estado === 'DESMATERIALIZANDO') {
                    const dur = (window.ficha.duracionDesmaterializacionMs || 500) / 1000;
                    this.progresoMat = Math.max(0.0, this.progresoMat - delta / dur);
                    if (this.progresoMat <= 0.0) {
                        this.estado = 'OCULTO';
                        this.anclaObj.visible = false;
                        this.poseInicializada = false;
                        this.restaurarColoresOriginales();
                        if (window.notificarPerdidaDefinitivaUI) window.notificarPerdidaDefinitivaUI();
                        return;
                    }
                } else {
                    return;
                }

                const t = this.progresoMat;
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                const alturaLocal = THREE.MathUtils.lerp(this.minYLocal, this.maxYLocal, ease);

                if (this.anilloEscaner) {
                    this.anilloEscaner.visible = true;
                    this.anilloEscaner.position.set(0, alturaLocal, 0);
                    this.anilloEscaner.rotation.y += delta * 2.4;

                    this.el.object3D.updateMatrixWorld(true);
                    this.anilloEscaner.getWorldPosition(this._planePoint);

                    this._planeNormal.set(0, -1, 0).transformDirection(this.el.object3D.matrixWorld).normalize();
                    this.planoCorte.setFromNormalAndCoplanarPoint(this._planeNormal, this._planePoint);
                }

                const pulso = Math.sin(t * Math.PI) * 0.42;
                for (let i = 0; i < this.materialesAnimables.length; i++) {
                    const mat = this.materialesAnimables[i];
                    if (mat.emissive && mat.userData.origEmissive) {
                        const orig = mat.userData.origEmissive;
                        mat.emissive.setRGB(
                            orig.r + pulso * 0.05,
                            orig.g + pulso * 0.65,
                            orig.b + pulso * 0.85
                        );
                        mat.emissiveIntensity = mat.userData.origEmissiveIntensity + pulso;
                    }
                }
            },

            tick: function (time, timeDelta) {
                if (this.estado === 'OCULTO') return;

                const rawDelta = Math.min(Math.max((timeDelta || 16.6) * 0.001, 0.001), 0.04);
                this.smoothDelta += (rawDelta - this.smoothDelta) * 0.25;
                const delta = this.smoothDelta;
                this.relojPulso += delta;

                // 1. Seguir suavemente al target de MindAR cuando está visible en cámara
                if (this.rastreandoEnVivo && this.targetObj.visible) {
                    const mat = this.targetObj.matrix;
                    if (mat && mat.elements[15] !== 0) {
                        mat.decompose(this._tPos, this._tQuat, this._tScale);
                        if (this._tScale.lengthSq() > 0.000001) {
                            if (!this.poseInicializada) {
                                this.anclaObj.position.copy(this._tPos);
                                this.anclaObj.quaternion.copy(this._tQuat);
                                this.anclaObj.scale.copy(this._tScale);
                                this.poseInicializada = true;
                            } else {
                                const k = window.ficha.suavizadoPose || 18.0;
                                const alpha = 1.0 - Math.exp(-k * delta);
                                this.anclaObj.position.lerp(this._tPos, alpha);
                                this.anclaObj.quaternion.slerp(this._tQuat, alpha);
                                this.anclaObj.scale.lerp(this._tScale, alpha);
                            }
                        }
                    }
                } else if (this.estado === 'RETENCION' && !this.simulandoPreview) {
                    // Retención de 4.5s si se pierde momentáneamente el sticker
                    const transcurrido = performance.now() - this.tiempoPerdidaInicio;
                    const maxRetencion = window.ficha.tiempoRetencionPerdidaMs || 4500;

                    this.anclaObj.position.y += Math.sin(this.relojPulso * 2.5) * 0.00025;

                    if (transcurrido >= maxRetencion) {
                        this.estado = 'DESMATERIALIZANDO';
                        if (this.anilloEscaner) this.anilloEscaner.visible = true;
                    }
                }

                // 2. Actualizar barrido holográfico si está materializando o desmaterializando
                if (this.estado === 'MATERIALIZANDO' || this.estado === 'DESMATERIALIZANDO') {
                    this.actualizarEfectoMaterializacion(delta);
                }

                // 3. Interpolar suavemente la rotación y zoom táctil del usuario (Exploración 360°)
                const smoothInteract = 1.0 - Math.exp(-14.0 * delta);
                this.rotUsuarioY += (this.targetRotUsuarioY - this.rotUsuarioY) * smoothInteract;
                this.rotUsuarioX += (this.targetRotUsuarioX - this.rotUsuarioX) * smoothInteract;
                this.escalaUsuario += (this.targetEscalaUsuario - this.escalaUsuario) * smoothInteract;

                // 4. Giro lento y majestuoso en loop + rotación de exploración del usuario
                if (this.mixer) {
                    this.mixer.update(delta);
                    this.grupoExploracion.rotation.set(this.rotUsuarioX, this.rotUsuarioY, 0);
                } else if (this.giroRespaldo) {
                    const velLenta = window.ficha.velocidadGiroRespaldo ?? 0.42;
                    this.anguloGiroLento += delta * velLenta;
                    this.grupoExploracion.rotation.set(
                        this.rotUsuarioX,
                        this.anguloGiroLento + this.rotUsuarioY,
                        0
                    );
                }
                this.grupoExploracion.scale.setScalar(this.escalaUsuario);
            }
        });
    </script>
</head>

<body>

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                <span>Seguir en Instagram · @asteroidae9999</span>

    <!-- ===================================================== -->
    <!-- ESCENA AR                                             -->
    <!-- ===================================================== -->
    <a-scene
        id="escenaAR"
        compositor-ar
        loading-screen="enabled: false"
        mindar-image="imageTargetSrc: ./targets/imagen_rastreo.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.001; filterBeta: 0.008; warmupTolerance: 1; missTolerance: 12;"
        color-space="sRGB"
        renderer="colorManagement: true; antialias: true; alpha: true; preserveDrawingBuffer: true; powerPreference: high-performance;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Iluminación balanceada que respeta los colores originales y realza el negro metálico -->
        <a-light type="hemisphere" color="#ffffff" groundColor="#4a4a52" intensity="1.0"></a-light>
        <a-light type="ambient" color="#ffffff" intensity="1.1"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2.0" position="1.5 2.5 2"></a-light>
        <a-light type="directional" color="#e0f2fe" intensity="0.95" position="-1.5 -1 1.2"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="objetivoAR"></a-entity>

        <a-entity id="anclaEstableAR">
            <a-entity
                id="entidadModelo"
                position="0 0 0.1"
                rotation="0 0 0"
                modelo-cyberpunk-ar>
            </a-entity>
        </a-entity>

    </a-scene>

    <!-- ===================================================== -->
    <!-- LÓGICA DE INTERFAZ Y CAPTURA MULTIMEDIA               -->
    <!-- ===================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const escenaEl = document.getElementById("escenaAR");

            if (window.ficha.marcadorMind) {
                obtenerUrlConCache(window.ficha.marcadorMind);
            }

            // 1. Cargar datos de la ficha e Instagram
            document.getElementById("uiCategoria").textContent = window.ficha.categoria;
            document.getElementById("uiTitulo").textContent = window.ficha.titulo;
            document.getElementById("uiAutor").textContent = window.ficha.autor;
            document.getElementById("uiAnio").textContent = window.ficha.anio;
            document.getElementById("uiUbicacion").textContent = window.ficha.ubicacion;
            document.getElementById("uiHistoria").textContent = window.ficha.historia;

            if (window.ficha.instagramUrl) {
                document.getElementById("btnInstagramTop").href = window.ficha.instagramUrl;
                document.getElementById("botonInstagramFicha").href = window.ficha.instagramUrl;
            }

            const entidadModelo = document.getElementById("entidadModelo");
            if (window.ficha.rotacionInicial) {
                entidadModelo.setAttribute("rotation", window.ficha.rotacionInicial);
            }

            const botonMapa = document.getElementById("botonMapa");
            if (window.ficha.mapa && window.ficha.mapa.trim() !== "") {
                botonMapa.href = window.ficha.mapa;
                botonMapa.style.display = "inline-flex";
            }

            // 2. Ajustar resolución del renderer para máxima fluidez (60fps)
            function aplicarViewerPixelRatio() {
                const renderer = escenaEl && escenaEl.renderer;
                if (!renderer || typeof renderer.setPixelRatio !== 'function') return;
                const dpr = window.devicePixelRatio || 1;
                const target = Math.min(dpr, window.ficha.viewerPixelRatioMax || 1.5);
                renderer.setPixelRatio(target);
            }

            if (escenaEl.hasLoaded) {
                aplicarViewerPixelRatio();
            } else {
                escenaEl.addEventListener('loaded', aplicarViewerPixelRatio);
            }

            // 3. Ficha informativa
            const panelInferior = document.getElementById("panelInferior");
            const btnAbrirFicha = document.getElementById("btnAbrirFicha");
            const btnCerrarFicha = document.getElementById("btnCerrarFicha");

            btnAbrirFicha.addEventListener("click", () => panelInferior.classList.add("visible"));
            btnCerrarFicha.addEventListener("click", () => panelInferior.classList.remove("visible"));

            // 4. Detección visual y modo de prueba para el visualizador
            const objetivoAR = document.getElementById("objetivoAR");
            const uiEscaneo = document.getElementById("ui-escaneo");
            const marcoEscaner = document.getElementById("marcoEscaner");
            const estadoCarga = document.getElementById("estadoCarga");
            const statusPill = document.getElementById("statusPill");
            const hintExploracion = document.getElementById("hintExploracion");
            const btnSimularAR = document.getElementById("btnSimularAR");

            let timeoutOcultarUI = null;
            let timeoutHint = null;

            window.mostrarHintExploracionUI = () => {
                clearTimeout(timeoutHint);
                hintExploracion.classList.add("visible");
                timeoutHint = setTimeout(() => {
                    hintExploracion.classList.remove("visible");
                }, 4200);
            };

            function alDetectarTargetUI() {
                clearTimeout(timeoutOcultarUI);
                marcoEscaner.classList.add("detectado");
                btnAbrirFicha.style.display = "inline-flex";
                if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }

                timeoutOcultarUI = setTimeout(() => {
                    uiEscaneo.style.opacity = "0";
                }, 400);
            }

            objetivoAR.addEventListener("targetFound", () => {
                btnSimularAR.classList.remove("activo");
                alDetectarTargetUI();
            });

            window.notificarPerdidaDefinitivaUI = () => {
                clearTimeout(timeoutOcultarUI);
                uiEscaneo.style.opacity = "1";
                marcoEscaner.classList.remove("detectado");
                panelInferior.classList.remove("visible");
                hintExploracion.classList.remove("visible");
                btnAbrirFicha.style.display = "none";
                btnSimularAR.classList.remove("activo");
                statusPill.classList.remove("activo", "retencion");
                estadoCarga.textContent = "Listo para escanear";
            };

            // Botón de simulación para probar en el visualizador en vivo sin el sticker físico
            btnSimularAR.addEventListener("click", () => {
                const comp = entidadModelo.components["modelo-cyberpunk-ar"];
                if (!comp) return;
                if (comp.estado === "OCULTO" || comp.estado === "DESMATERIALIZANDO") {
                    btnSimularAR.classList.add("activo");
                    alDetectarTargetUI();
                    comp.activarTarget(true);
                } else {
                    btnSimularAR.classList.remove("activo");
                    comp.perderTarget(true);
                }
            });

            // 5. Captura de FOTO
            const btnFoto = document.getElementById("btnFoto");
            const flashPantalla = document.getElementById("flashPantalla");

            function invalidarRectsCompositor() {
                const comp = escenaEl.components["compositor-ar"];
                if (comp && typeof comp.invalidarRects === "function") comp.invalidarRects();
            }

            btnFoto.addEventListener("click", async () => {
                if (window.capturadorAR.grabandoVideo) return;

                flashPantalla.style.opacity = "0.75";
                setTimeout(() => { flashPantalla.style.opacity = "0"; }, 180);

                const renderer = escenaEl.renderer;
                const originalPR = renderer ? renderer.getPixelRatio() : 1;
                if (renderer) {
                    const boost = Math.min((window.devicePixelRatio || 1) * 1.5, 3);
                    renderer.setPixelRatio(Math.max(originalPR, boost));
                }

                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                window.capturadorAR.solicitarFoto = true;

                setTimeout(() => {
                    if (renderer) renderer.setPixelRatio(originalPR);
                }, 600);
            });

            // 6. Grabación de VIDEO HD
            const btnVideo = document.getElementById("btnVideo");
            const badgeTiempo = document.getElementById("badgeTiempo");
            const textoTiempo = document.getElementById("textoTiempo");

            let mediaRecorder = null;
            let fragmentosVideo = [];
            let intervaloTiempo = null;
            let segundosGrabados = 0;

            function obtenerMimeTypeOptimizado() {
                const tipos = [
                    "video/mp4;codecs=avc1.42E01E",
                    "video/mp4",
                    "video/webm;codecs=vp9",
                    "video/webm;codecs=vp8",
                    "video/webm"
                ];
                if (!window.MediaRecorder) return "";
                for (const t of tipos) {
                    if (MediaRecorder.isTypeSupported(t)) return t;
                }
                return "";
            }

            async function iniciarGrabacion() {
                const compCanvas = window.capturadorAR.canvasCompuesto;
                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;
                const target = calcularResolucionCaptura(vw, vh, 'video');
                compCanvas.width = target.w;
                compCanvas.height = target.h;

                invalidarRectsCompositor();

                window.capturadorAR.solicitarFoto = false;
                window.capturadorAR.grabandoVideo = true;

                const comp = escenaEl.components["compositor-ar"];
                if (comp) comp.dibujarFrame();

                fragmentosVideo = [];

                const stream = compCanvas.captureStream(window.ficha.fpsVideo || 30);
                const mimeType = obtenerMimeTypeOptimizado();

                const opciones = {
                    videoBitsPerSecond: window.ficha.bitrateVideo || 12000000
                };
                if (mimeType) opciones.mimeType = mimeType;

                try {
                    mediaRecorder = new MediaRecorder(stream, opciones);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) fragmentosVideo.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const tipoFinal = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : "video/mp4";
                    const blob = new Blob(fragmentosVideo, { type: tipoFinal });
                    if (blob.size > 0 && window.mostrarVistaPreviaArchivo) {
                        window.mostrarVistaPreviaArchivo(blob, "video");
                    }
                };

                mediaRecorder.start(250);
                btnVideo.classList.add("grabando");
                badgeTiempo.classList.add("activo");
                segundosGrabados = 0;
                textoTiempo.textContent = "00:00";

                intervaloTiempo = setInterval(() => {
                    segundosGrabados++;
                    const min = String(Math.floor(segundosGrabados / 60)).padStart(2, "0");
                    const seg = String(segundosGrabados % 60).padStart(2, "0");
                    textoTiempo.textContent = `${min}:${seg}`;

                    if (window.ficha.maxDuracionVideoSeg && segundosGrabados >= window.ficha.maxDuracionVideoSeg) {
                        detenerGrabacion();
                    }
                }, 1000);
            }

            function detenerGrabacion() {
                window.capturadorAR.grabandoVideo = false;
                clearInterval(intervaloTiempo);
                btnVideo.classList.remove("grabando");
                badgeTiempo.classList.remove("activo");

                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    try { mediaRecorder.requestData(); } catch (e) {}
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state !== "inactive") {
                            mediaRecorder.stop();
                        }
                    }, 120);
                }
            }

            btnVideo.addEventListener("click", () => {
                if (!window.capturadorAR.grabandoVideo) {
                    iniciarGrabacion().catch(err => {
                        console.error("[video] Error al iniciar grabación:", err);
                        window.capturadorAR.grabandoVideo = false;
                        btnVideo.classList.remove("grabando");
                        badgeTiempo.classList.remove("activo");
                        clearInterval(intervaloTiempo);
                    });
                } else {
                    detenerGrabacion();
                }
            });

            // 7. Modal de vista previa
            const modalPreview = document.getElementById("modalPreview");
            const contenedorMedia = document.getElementById("contenedorMedia");
            const pesoArchivo = document.getElementById("pesoArchivo");
            const tituloPreview = document.getElementById("tituloPreview");
            const btnCerrarPreview = document.getElementById("btnCerrarPreview");
            const btnCompartir = document.getElementById("btnCompartir");
            const btnDescargar = document.getElementById("btnDescargar");

            let urlArchivoActual = null;
            let archivoActualObj = null;
            let nombreArchivoActual = "";

            window.mostrarVistaPreviaArchivo = (blob, tipo) => {
                if (urlArchivoActual) {
                    try { URL.revokeObjectURL(urlArchivoActual); } catch (e) {}
                }

                urlArchivoActual = URL.createObjectURL(blob);
                contenedorMedia.innerHTML = "";

                const kb = blob.size / 1024;
                pesoArchivo.textContent = kb < 1024
                    ? `${Math.max(1, Math.round(kb))} KB`
                    : `${(kb / 1024).toFixed(2)} MB`;

                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");

                if (tipo === "foto") {
                    tituloPreview.textContent = "Fotografía AR";
                    nombreArchivoActual = `torimask-ar-${timestamp}.jpg`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: "image/jpeg" });

                    const img = document.createElement("img");
                    img.src = urlArchivoActual;
                    contenedorMedia.appendChild(img);
                } else {
                    tituloPreview.textContent = "Video AR";
                    const esMp4 = blob.type && blob.type.includes("mp4");
                    const ext = esMp4 ? "mp4" : "webm";
                    const mimeLimpio = esMp4 ? "video/mp4" : "video/webm";
                    nombreArchivoActual = `torimask-ar-${timestamp}.${ext}`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: mimeLimpio });

                    const vid = document.createElement("video");
                    vid.src = urlArchivoActual;
                    vid.controls = true;
                    vid.autoplay = true;
                    vid.loop = true;
                    vid.muted = true;
                    vid.playsInline = true;
                    contenedorMedia.appendChild(vid);
                }

                if (navigator.canShare && archivoActualObj && navigator.canShare({ files: [archivoActualObj] })) {
                    btnCompartir.style.display = "flex";
                } else {
                    btnCompartir.style.display = "none";
                }

                modalPreview.classList.add("activo");
            };

            btnCerrarPreview.addEventListener("click", () => {
                modalPreview.classList.remove("activo");
                contenedorMedia.innerHTML = "";
            });

            btnCompartir.addEventListener("click", async () => {
                if (!archivoActualObj) return;
                try {
                    await navigator.share({
                        files: [archivoActualObj],
                        title: window.ficha.titulo
                    });
                } catch (e) {
                    console.log("Compartir cancelado:", e);
                }
            });

            btnDescargar.addEventListener("click", () => {
                if (!urlArchivoActual) return;
                const a = document.createElement("a");
                a.style.display = "none";
                a.href = urlArchivoActual;
                a.download = nombreArchivoActual;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 200);
            });
        });
    </script>

</body>
</html>
