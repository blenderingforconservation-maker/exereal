<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patrimonio Digital AR - Tori Mask</title>

    <!-- ===================================================== -->
    <!-- 1. CONFIGURACIÓN DE LA OBRA (EDITAR AQUÍ)             -->
    <!-- ===================================================== -->
    <script>
        window.ficha = {
            // Ruta del modelo en tu repositorio
            modelo: "./models/giro-torimask-opt.glb",

            // Ruta del archivo compilado de la imagen a detectar
            marcadorMind: "./targets/imagen_rastreo.mind",

            // Ajustes visuales del modelo sobre la imagen
            escala: 1.2,               // Tamaño relativo sobre la imagen (1.0 = tamaño del marcador)
            rotacionInicial: "0 0 0",  // Cambia a "90 0 0" si el modelo aparece acostado

            // Datos de la Ficha Patrimonial (UI)
            categoria: "PATRIMONIO DIGITAL INTERACTIVO",
            titulo: "TORI MASK",
            autor: "Colección Digital",
            anio: "2026",
            ubicacion: "Exhibición de Realidad Aumentada",
            mapa: "", // Si pones un link de Google Maps, aparecerá el botón automáticamente
            historia: "Pieza tridimensional optimizada y animada para visualización mediante reconocimiento de imagen (Image Tracking). Al detectar el marcador gráfico, el modelo se despliega en el espacio físico reproduciendo su secuencia de animación en tiempo real."
        };
    </script>

    <!-- ===================================================== -->
    <!-- 2. LIBRERÍAS GRATUITAS: A-FRAME + MINDAR + MESHOPT    -->
    <!-- NO MODIFICAR                                          -->
    <!-- ===================================================== -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Decodificador obligatorio para archivos comprimidos (-opt.glb) -->
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #121212;
            color: #222222;
        }

        /* ================================================= */
        /* BARRA SUPERIOR Y DIAGNÓSTICO DE CARGA             */
        /* ================================================= */
        .header-ar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 300;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
            color: white;
            pointer-events: none;
        }

        .marca {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #estadoCarga {
            font-size: 11px;
            background: rgba(32, 32, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
        }

        /* ================================================= */
        /* GUÍA DE ESCANEO (CUANDO NO SE DETECTA LA IMAGEN)  */
        /* ================================================= */
        #ui-escaneo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 150;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .marco-escaner {
            width: 68vw;
            max-width: 260px;
            height: 68vw;
            max-height: 260px;
            border: 2px dashed rgba(255, 255, 255, 0.75);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .linea-escaner {
            width: 85%;
            height: 2px;
            background: #ffffff;
            box-shadow: 0 0 12px #ffffff;
            animation: barrido 2.2s infinite ease-in-out;
        }

        @keyframes barrido {
            0%, 100% { transform: translateY(-90px); opacity: 0.3; }
            50% { transform: translateY(90px); opacity: 1; }
        }

        .instruccion-ar {
            margin-top: 24px;
            background: rgba(20, 20, 20, 0.85);
            color: #f2f0eb;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-align: center;
            max-width: 85%;
            backdrop-filter: blur(6px);
        }

        /* ================================================= */
        /* TARJETA INFERIOR Y FICHA PATRIMONIAL              */
        /* ================================================= */
        #panelInferior {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translate(-50%, 110%);
            width: 100%;
            max-width: 600px;
            background-color: #f2f0eb;
            border-radius: 22px 22px 0 0;
            padding: 20px 24px 26px 24px;
            z-index: 250;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        #panelInferior.visible {
            transform: translate(-50%, 0%);
        }

        .barra-arrastre {
            width: 42px;
            height: 4px;
            background-color: #cccccc;
            border-radius: 4px;
            margin: 0 auto 14px auto;
        }

        .cabecera-ficha {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .badge-categoria {
            display: inline-block;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #ffffff;
            background-color: #202020;
            padding: 5px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .titulo-obra {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #202020;
        }

        .boton-detalles {
            background-color: #202020;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        #contenidoExpandible {
            display: none;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #dcd9d0;
        }

        #contenidoExpandible.abierto {
            display: block;
        }

        .datos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .etiqueta {
            display: block;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1.4px;
            color: #777777;
            margin-bottom: 4px;
        }

        .valor {
            font-size: 14px;
            color: #222222;
            font-weight: 600;
        }

        .historia-texto {
            font-size: 14px;
            line-height: 1.6;
            color: #444444;
            margin: 12px 0 0 0;
            white-space: pre-line;
        }

        #botonMapa {
            display: none;
            margin-top: 14px;
            width: 100%;
            text-align: center;
            padding: 12px;
            background-color: #e4e1da;
            color: #202020;
            border: 1px solid #cccccc;
            border-radius: 8px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
    </style>

    <!-- ===================================================== -->
    <!-- 3. COMPONENTE PERSONALIZADO: CARGA MESHOPT Y ANIMA    -->
    <!-- ===================================================== -->
    <script>
        AFRAME.registerComponent('modelo-animado-ar', {
            init: function () {
                this.mixer = null;
                this.actions = [];
                this.activo = false;
                this.giroRespaldo = false;
                this.contenedor = null;

                const el = this.el;
                const estadoUI = document.getElementById('estadoCarga');

                const cargarGLB = () => {
                    const loader = new AFRAME.THREE.GLTFLoader();

                    // Activar decodificador Meshopt (indispensable para giro-torimask-opt.glb)
                    if (window.MeshoptDecoder) {
                        loader.setMeshoptDecoder(window.MeshoptDecoder);
                    }

                    // Activar decodificador Draco por compatibilidad adicional
                    if (AFRAME.THREE.DRACOLoader) {
                        const dracoLoader = new AFRAME.THREE.DRACOLoader();
                        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                        loader.setDRACOLoader(dracoLoader);
                    }

                    loader.load(
                        window.ficha.modelo,
                        (gltf) => {
                            const model = gltf.scene;

                            // Contenedor para normalizar escala y centrar el modelo sobre la imagen
                            const wrapper = new AFRAME.THREE.Group();
                            wrapper.add(model);

                            const box = new AFRAME.THREE.Box3().setFromObject(model);
                            const size = box.getSize(new AFRAME.THREE.Vector3());
                            const center = box.getCenter(new AFRAME.THREE.Vector3());

                            const maxDim = Math.max(size.x, size.y, size.z);
                            if (maxDim > 0) {
                                const factor = (window.ficha.escala || 1.2) / maxDim;
                                wrapper.scale.setScalar(factor);
                                model.position.set(-center.x, -center.y, -center.z);
                            }

                            el.setObject3D('mesh', wrapper);
                            this.contenedor = wrapper;

                            // Extraer todas las animaciones guardadas en el archivo GLB
                            if (gltf.animations && gltf.animations.length > 0) {
                                this.mixer = new AFRAME.THREE.AnimationMixer(model);
                                gltf.animations.forEach((clip) => {
                                    const action = this.mixer.clipAction(clip);
                                    action.setLoop(AFRAME.THREE.LoopRepeat, Infinity);
                                    this.actions.push(action);
                                });
                                estadoUI.textContent = "✓ Modelo y animación listos";
                            } else {
                                // Si el GLB no tuviera keyframes internos, aplicamos rotación continua
                                this.giroRespaldo = true;
                                estadoUI.textContent = "✓ Modelo listo (giro activo)";
                            }
                        },
                        undefined,
                        (error) => {
                            console.error("Error cargando el modelo GLB:", error);
                            estadoUI.textContent = "⚠️ Error al cargar el archivo .glb";
                            estadoUI.style.backgroundColor = "#8b0000";
                        }
                    );
                };

                if (window.MeshoptDecoder && window.MeshoptDecoder.ready) {
                    window.MeshoptDecoder.ready.then(cargarGLB);
                } else {
                    cargarGLB();
                }

                // Escuchar eventos cuando MindAR detecta o pierde la imagen
                const targetEl = document.getElementById('objetivoAR');

                targetEl.addEventListener('targetFound', () => {
                    this.activo = true;
                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(action => {
                            action.reset();
                            action.play();
                        });
                    }
                });

                targetEl.addEventListener('targetLost', () => {
                    this.activo = false;
                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(action => {
                            action.paused = true;
                        });
                    }
                });
            },

            tick: function (time, timeDelta) {
                if (!this.activo) return;

                const delta = timeDelta / 1000;
                if (this.mixer) {
                    this.mixer.update(delta);
                } else if (this.giroRespaldo && this.contenedor) {
                    this.contenedor.rotation.y += delta * 1.5;
                }
            }
        });
    </script>
</head>

<body>

    <!-- ===================================================== -->
    <!-- INTERFAZ DE USUARIO (UI)                              -->
    <!-- ===================================================== -->
    <header class="header-ar">
        <div class="marca">PATRIMONIO DIGITAL</div>
        <div id="estadoCarga">Cargando modelo 3D...</div>
    </header>

    <div id="ui-escaneo">
        <div class="marco-escaner">
            <div class="linea-escaner"></div>
        </div>
        <div class="instruccion-ar">
            Apunta la cámara hacia la imagen marcador para desplegar la pieza animada
        </div>
    </div>

    <section id="panelInferior">
        <div class="barra-arrastre"></div>
        <div class="cabecera-ficha">
            <div>
                <span class="badge-categoria" id="uiCategoria"></span>
                <h1 class="titulo-obra" id="uiTitulo"></h1>
            </div>
            <button class="boton-detalles" id="btnToggleInfo">VER FICHA</button>
        </div>

        <div id="contenidoExpandible">
            <div class="datos-grid">
                <div>
                    <span class="etiqueta">AUTOR</span>
                    <div class="valor" id="uiAutor"></div>
                </div>
                <div>
                    <span class="etiqueta">AÑO</span>
                    <div class="valor" id="uiAnio"></div>
                </div>
                <div style="grid-column: span 2;">
                    <span class="etiqueta">UBICACIÓN</span>
                    <div class="valor" id="uiUbicacion"></div>
                    <a id="botonMapa" href="#" target="_blank" rel="noopener noreferrer">
                        VER UBICACIÓN EN GOOGLE MAPS
                    </a>
                </div>
            </div>
            <span class="etiqueta">INFORMACIÓN DE LA OBRA</span>
            <p class="historia-texto" id="uiHistoria"></p>
        </div>
    </section>

    <!-- ===================================================== -->
    <!-- ESCENA AR E ILUMINACIÓN TRIDIMENSIONAL                -->
    <!-- ===================================================== -->
    <a-scene
        id="escenaAR"
        mindar-image="imageTargetSrc: ./targets/imagen_rastreo.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
        color-space="sRGB"
        renderer="colorManagement: true, antialias: true, alpha: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Sistema de iluminación para que las texturas se vean nítidas y con volumen -->
        <a-light type="ambient" color="#ffffff" intensity="1.6"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2.2" position="1.5 2.5 2"></a-light>
        <a-light type="directional" color="#ffdcb4" intensity="1.0" position="-1.5 -1 1"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Ancla que sigue a la imagen física -->
        <a-entity mindar-image-target="targetIndex: 0" id="objetivoAR">
            <a-entity
                id="entidadModelo"
                position="0 0 0.1"
                rotation="0 0 0"
                modelo-animado-ar>
            </a-entity>
        </a-entity>

    </a-scene>

    <!-- ===================================================== -->
    <!-- LÓGICA DE INTERFAZ Y EVENTOS                          -->
    <!-- ===================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Poblar datos de la ficha
            document.getElementById("uiCategoria").textContent = window.ficha.categoria;
            document.getElementById("uiTitulo").textContent = window.ficha.titulo;
            document.getElementById("uiAutor").textContent = window.ficha.autor;
            document.getElementById("uiAnio").textContent = window.ficha.anio;
            document.getElementById("uiUbicacion").textContent = window.ficha.ubicacion;
            document.getElementById("uiHistoria").textContent = window.ficha.historia;

            const entidadModelo = document.getElementById("entidadModelo");
            if (window.ficha.rotacionInicial) {
                entidadModelo.setAttribute("rotation", window.ficha.rotacionInicial);
            }

            const botonMapa = document.getElementById("botonMapa");
            if (window.ficha.mapa && window.ficha.mapa.trim() !== "") {
                botonMapa.href = window.ficha.mapa;
                botonMapa.style.display = "block";
            }

            // Botón para desplegar/ocultar detalles de la ficha
            const btnToggleInfo = document.getElementById("btnToggleInfo");
            const contenidoExpandible = document.getElementById("contenidoExpandible");
            btnToggleInfo.addEventListener("click", () => {
                const abierto = contenidoExpandible.classList.toggle("abierto");
                btnToggleInfo.textContent = abierto ? "CERRAR" : "VER FICHA";
            });

            // Eventos de detección de imagen para la UI
            const objetivoAR = document.getElementById("objetivoAR");
            const uiEscaneo = document.getElementById("ui-escaneo");
            const panelInferior = document.getElementById("panelInferior");

            objetivoAR.addEventListener("targetFound", () => {
                uiEscaneo.style.opacity = "0";
                panelInferior.classList.add("visible");
            });

            objetivoAR.addEventListener("targetLost", () => {
                uiEscaneo.style.opacity = "1";
                panelInferior.classList.remove("visible");
                contenidoExpandible.classList.remove("abierto");
                btnToggleInfo.textContent = "VER FICHA";
            });
        });
    </script>

</body>
</html>
