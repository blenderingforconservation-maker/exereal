<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05070e">
    <title>Experiencia AR // Guerrero Demonio - Tori Mask</title>

    <!-- Tipografías Cyberpunk HUD -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- ===================================================== -->
    <!-- 1. CONFIGURACIÓN DEL PROYECTO                         -->
    <!-- ===================================================== -->
    <script>
        window.ficha = {
            modelo: "./models/giro-torimask-opt.glb",
            marcadorMind: "./targets/imagen_rastreo.mind",
            stickerLogo: "./kimage (1).png",

            // Escala base solicitada (3.6)
            escala: 3.6,
            rotacionInicial: "0 0 0",

            // ===== Estabilidad y Materialización Cyberpunk =====
            tiempoRetencionPerdidaMs: 4500, // Aguanta 4.5 segundos si se pierde el target
            duracionMaterializacionMs: 1800, // 1.8s de escaneo holográfico al aparecer
            duracionDesmaterializacionMs: 550,
            suavizadoPose: 16.0, // Interpolación suave anti-temblor

            // ===== Calidad de captura =====
            calidadFotoJPEG: 0.94,
            bitrateVideo: 15000000,
            fpsVideo: 30,
            maxDuracionVideoSeg: 60,

            // ===== Cámara de entrada ágil (720p inicia rápido sin saturar MindAR) =====
            camara: { width: 1280, height: 720 },

            // ===== Calidad del viewer 3D en vivo =====
            viewerPixelRatioMax: 2.0,

            categoria: "Stickers RA // Cyber-Sigil",
            titulo: "Guerrero Demonio",
            autor: "Rawnin del Desierto",
            anio: "2026",
            ubicacion: "Mexa Web",
            mapa: "",
            historia: "Entidad digital invocada mediante rastreo óptico neuronal. Diseño cyber-sigilism fusionado con materialización holográfica en tiempo real."
        };

        window.modoCamaraActual = "environment";

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const getUserMediaOriginal = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
            navigator.mediaDevices.getUserMedia = function (constraints) {
                if (constraints && constraints.video) {
                    const videoBase = typeof constraints.video === "object" ? constraints.video : {};
                    constraints = {
                        ...constraints,
                        video: {
                            ...videoBase,
                            facingMode: { ideal: window.modoCamaraActual },
                            width: { ideal: window.ficha.camara.width },
                            height: { ideal: window.ficha.camara.height }
                        }
                    };
                }
                return getUserMediaOriginal(constraints);
            };
        }
    </script>

    <!-- ===================================================== -->
    <!-- 2. LIBRERÍAS                                          -->
    <!-- ===================================================== -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

    <style>
        :root {
            --cyber-bg: rgba(6, 9, 18, 0.82);
            --cyber-panel: rgba(8, 12, 24, 0.94);
            --cyber-cyan: #00f3ff;
            --cyber-magenta: #ff0055;
            --cyber-yellow: #fcee0a;
            --cyber-green: #00ff9d;
            --cyber-text: #e2f6ff;
            --font-hud: 'Orbitron', sans-serif;
            --font-tech: 'Share Tech Mono', monospace;
            --font-body: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: var(--font-body);
            background-color: transparent; color: var(--cyber-text);
        }

        /* CAPA DE SCANLINES Y VIÑETA CYBERPUNK */
        .cyber-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 120;
            background:
                radial-gradient(circle at center, transparent 58%, rgba(3, 5, 12, 0.55) 100%),
                repeating-linear-gradient(0deg, rgba(0, 243, 255, 0.025) 0px, rgba(0, 243, 255, 0.025) 1px, transparent 1px, transparent 3px);
        }

        /* BARRA SUPERIOR HUD */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 300;
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top));
            pointer-events: none; gap: 10px;
        }

        .hud-status-wrap {
            display: flex; flex-direction: column; gap: 6px; max-width: 68%;
        }

        #estadoCarga {
            font-family: var(--font-tech); font-size: 11px; letter-spacing: 1.2px;
            color: var(--cyber-cyan); text-transform: uppercase;
            background: var(--cyber-bg);
            border: 1px solid rgba(0, 243, 255, 0.45);
            border-left: 3px solid var(--cyber-cyan);
            padding: 8px 14px;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.2);
            transition: all 0.3s ease;
        }

        /* Barra de retención cuando se pierde momentáneamente el sticker */
        #barraRetencionWrap {
            display: none; flex-direction: column; gap: 4px;
            background: rgba(20, 6, 16, 0.85);
            border: 1px solid rgba(255, 0, 85, 0.6);
            padding: 6px 10px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
        }
        #barraRetencionWrap.activo { display: flex; }
        .retencion-label {
            font-family: var(--font-tech); font-size: 10px; color: var(--cyber-yellow);
            letter-spacing: 1px; display: flex; justify-content: space-between; gap: 8px;
        }
        .retencion-pista {
            width: 100%; height: 4px; background: rgba(255, 255, 255, 0.14); overflow: hidden;
        }
        #retencionProgreso {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, var(--cyber-magenta), var(--cyber-yellow));
            box-shadow: 0 0 10px var(--cyber-magenta);
            transform-origin: left center;
        }

        .top-actions {
            display: flex; align-items: center; gap: 8px; pointer-events: auto;
        }

        .btn-hud-top {
            height: 40px; padding: 0 13px;
            background: var(--cyber-bg); color: var(--cyber-cyan);
            border: 1px solid var(--cyber-cyan);
            font-family: var(--font-hud); font-size: 11px; font-weight: 700;
            letter-spacing: 1px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .btn-hud-top:active { transform: scale(0.92); background: var(--cyber-cyan); color: #05070e; }

        #btnAbrirFicha {
            display: none; width: 40px; padding: 0;
            border-color: var(--cyber-yellow); color: var(--cyber-yellow);
            box-shadow: 0 0 15px rgba(252, 238, 10, 0.28);
        }

        /* GUÍA DE ESCANEO CYBERPUNK CON SILUETA DEL STICKER */
        #ui-escaneo {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 150; pointer-events: none; transition: opacity 0.45s ease;
        }
        .marco-escaner {
            width: 66vw; max-width: 250px; height: 66vw; max-height: 250px;
            position: relative; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.06) 0%, transparent 72%);
            box-shadow: 0 0 0 4000px rgba(4, 6, 14, 0.42);
            transition: all 0.35s ease;
        }
        /* Esquinas angulares Cyberpunk */
        .esquina-hud {
            position: absolute; width: 28px; height: 28px;
            border-color: var(--cyber-cyan); border-style: solid;
            filter: drop-shadow(0 0 8px var(--cyber-cyan));
            transition: all 0.3s ease;
        }
        .esquina-hud.tl { top: 0; left: 0; border-width: 3px 0 0 3px; }
        .esquina-hud.tr { top: 0; right: 0; border-width: 3px 3px 0 0; }
        .esquina-hud.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
        .esquina-hud.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; }

        .marco-escaner.detectado .esquina-hud {
            border-color: var(--cyber-green);
            filter: drop-shadow(0 0 14px var(--cyber-green));
            width: 36px; height: 36px;
        }

        /* Silueta holográfica del Sticker Guerrero Demonio en el centro del escáner */
        .silueta-sticker-guia {
            width: 72%; height: 72%; opacity: 0.26;
            stroke: var(--cyber-cyan); fill: var(--cyber-cyan);
            filter: drop-shadow(0 0 6px var(--cyber-cyan));
            transition: opacity 0.3s ease, transform 0.35s ease;
        }
        .marco-escaner.detectado .silueta-sticker-guia {
            opacity: 0; transform: scale(1.12);
        }

        .linea-escaner {
            position: absolute; width: 88%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyber-cyan), var(--cyber-magenta), var(--cyber-cyan), transparent);
            box-shadow: 0 0 14px var(--cyber-cyan), 0 0 24px var(--cyber-magenta);
            animation: barridoCyber 2.1s infinite ease-in-out;
            transition: opacity 0.25s ease;
        }
        .marco-escaner.detectado .linea-escaner { opacity: 0; animation-play-state: paused; }

        .check-detectado {
            position: absolute; font-family: var(--font-hud); font-size: 15px; font-weight: 900;
            letter-spacing: 2px; color: var(--cyber-green);
            background: rgba(5, 16, 14, 0.88); border: 1px solid var(--cyber-green);
            padding: 8px 16px; opacity: 0; transform: scale(0.6);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            text-shadow: 0 0 12px var(--cyber-green);
            box-shadow: 0 0 24px rgba(0, 255, 157, 0.35);
        }
        .marco-escaner.detectado .check-detectado { opacity: 1; transform: scale(1); }

        @keyframes barridoCyber {
            0%, 100% { transform: translateY(-92px); opacity: 0.35; }
            50% { transform: translateY(92px); opacity: 1; }
        }

        .instruccion-ar {
            margin-top: 22px; background: var(--cyber-bg); color: var(--cyber-text);
            border: 1px solid rgba(0, 243, 255, 0.38);
            border-right: 3px solid var(--cyber-magenta);
            padding: 9px 18px; font-family: var(--font-tech); font-size: 12px;
            letter-spacing: 1px; text-transform: uppercase;
            text-align: center; max-width: 86%;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .instruccion-ar.detectado {
            border-color: var(--cyber-green); color: var(--cyber-green);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
        }

        /* DOCK INFERIOR DE CONTROLES CYBERPUNK (FOTO, VIDEO, CÁMARA) */
        .contenedor-controles {
            position: fixed; bottom: 24px; bottom: max(24px, env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%); z-index: 280;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        #badgeTiempo {
            display: none; align-items: center; gap: 8px;
            background: rgba(24, 4, 14, 0.92); color: var(--cyber-magenta);
            border: 1px solid var(--cyber-magenta);
            font-family: var(--font-tech); font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
            padding: 6px 14px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.5);
        }
        #badgeTiempo.activo { display: flex; }
        .punto-parpadeo {
            width: 8px; height: 8px; background: var(--cyber-magenta);
            box-shadow: 0 0 8px var(--cyber-magenta);
            animation: parpadeo 0.9s infinite;
        }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        .dock-captura {
            display: flex; align-items: center; gap: 22px;
            background: var(--cyber-bg);
            border: 1px solid rgba(0, 243, 255, 0.45);
            padding: 12px 26px;
            clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.65), 0 0 22px rgba(0, 243, 255, 0.18);
            position: relative;
        }
        .dock-captura::before {
            content: "REC // SYS.2026";
            position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
            font-family: var(--font-tech); font-size: 8px; letter-spacing: 2px;
            color: rgba(0, 243, 255, 0.55); pointer-events: none;
        }

        .btn-icono {
            position: relative; border: none; background: none; padding: 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            touch-action: manipulation;
            transition: transform 0.18s cubic-bezier(0.2,0.8,0.2,1);
        }
        .btn-icono:active { transform: scale(0.88); }

        #btnFoto {
            width: 56px; height: 56px;
            border: 2px solid var(--cyber-cyan);
            background: rgba(0, 243, 255, 0.12);
            clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0% 75%, 0% 25%);
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.35);
        }
        .nucleo-foto {
            width: 42px; height: 42px;
            background: var(--cyber-cyan); color: #05070e;
            clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0% 75%, 0% 25%);
            display: flex; align-items: center; justify-content: center;
        }

        #btnVideo {
            width: 56px; height: 56px;
            border: 2px solid var(--cyber-magenta);
            background: rgba(255, 0, 85, 0.12);
            clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0% 75%, 0% 25%);
            box-shadow: 0 0 16px rgba(255, 0, 85, 0.35);
        }
        .nucleo-video {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--cyber-magenta);
            box-shadow: 0 0 12px var(--cyber-magenta);
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        #btnVideo.grabando {
            border-color: var(--cyber-yellow);
            box-shadow: 0 0 22px rgba(252, 238, 10, 0.6);
        }
        #btnVideo.grabando .nucleo-video {
            width: 22px; height: 22px; border-radius: 4px;
            background: var(--cyber-yellow);
        }

        #btnCambiarCamara {
            width: 46px; height: 46px;
            background: rgba(252, 238, 10, 0.1);
            border: 1.5px solid var(--cyber-yellow);
            color: var(--cyber-yellow);
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
            transition: transform 0.4s ease;
        }
        #btnCambiarCamara.girando { transform: rotate(180deg); }
        #btnCambiarCamara[disabled] { opacity: 0.4; cursor: wait; }

        #flashPantalla {
            position: fixed; inset: 0;
            background: var(--cyber-cyan); opacity: 0; pointer-events: none; z-index: 500;
            transition: opacity 0.25s ease;
        }

        /* MODAL DE VISTA PREVIA DE FOTO / VIDEO */
        #modalPreview, #modalQR {
            position: fixed; inset: 0;
            background: rgba(3, 5, 12, 0.88); backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px); z-index: 600;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 18px;
        }
        #modalPreview.activo, #modalQR.activo { display: flex; }

        .tarjeta-preview {
            background: var(--cyber-panel);
            border: 1.5px solid var(--cyber-cyan);
            clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
            padding: 18px; width: 100%; max-width: 390px;
            color: var(--cyber-text);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.25); text-align: center;
        }
        .cabecera-preview {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; font-family: var(--font-hud); font-size: 13px;
            font-weight: 700; color: var(--cyber-cyan); letter-spacing: 1px;
        }
        #pesoArchivo {
            background: rgba(0, 255, 157, 0.12); color: var(--cyber-green);
            border: 1px solid var(--cyber-green); padding: 4px 10px;
            font-family: var(--font-tech); font-size: 11px;
        }
        .contenedor-media {
            width: 100%; max-height: 52vh; overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.3);
            background: #000000; margin-bottom: 14px;
            display: flex; justify-content: center; align-items: center;
        }
        .contenedor-media img, .contenedor-media video {
            max-width: 100%; max-height: 52vh; object-fit: contain; display: block;
        }
        .acciones-preview { display: flex; gap: 8px; }
        .btn-modal {
            flex: 1; padding: 12px 10px; border: 1px solid transparent;
            font-family: var(--font-hud); font-size: 11px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            touch-action: manipulation;
        }
        #btnCerrarPreview, #btnCerrarQR {
            background: rgba(255, 0, 85, 0.18); color: var(--cyber-magenta);
            border-color: var(--cyber-magenta); flex: 0.55;
        }
        #btnCompartir {
            display: none; background: var(--cyber-green); color: #040810;
        }
        #btnDescargar, #btnDescargarQR {
            background: var(--cyber-cyan); color: #040810;
        }

        /* CONTROLES DEL MODAL QR PERSONALIZADO */
        .qr-canvas-box {
            background: #05070e; border: 1px solid rgba(0, 243, 255, 0.35);
            padding: 12px; margin-bottom: 12px; display: flex; justify-content: center;
        }
        #qrCanvas {
            width: 100%; max-width: 270px; height: auto; display: block;
            box-shadow: 0 0 22px rgba(0, 243, 255, 0.2);
        }
        .qr-field {
            text-align: left; margin-bottom: 10px;
        }
        .qr-field label {
            display: block; font-family: var(--font-tech); font-size: 10px;
            color: var(--cyber-cyan); letter-spacing: 1px; margin-bottom: 4px;
            text-transform: uppercase;
        }
        .qr-field input[type="url"] {
            width: 100%; padding: 9px 11px; background: #050811;
            border: 1px solid rgba(0, 243, 255, 0.45); color: var(--cyber-text);
            font-family: var(--font-tech); font-size: 12px;
        }
        .qr-tools-row {
            display: flex; gap: 8px; margin-bottom: 12px;
        }
        .btn-qr-tool {
            flex: 1; padding: 8px; background: rgba(252, 238, 10, 0.1);
            border: 1px solid var(--cyber-yellow); color: var(--cyber-yellow);
            font-family: var(--font-tech); font-size: 11px; cursor: pointer;
            text-transform: uppercase;
        }

        /* FICHA TÉCNICA INFERIOR CYBERPUNK */
        #panelInferior {
            position: fixed; bottom: 0; left: 50%; transform: translate(-50%, 110%);
            width: 100%; max-width: 600px;
            background: var(--cyber-panel);
            border-top: 2px solid var(--cyber-cyan);
            border-left: 1px solid rgba(0, 243, 255, 0.35);
            border-right: 1px solid rgba(0, 243, 255, 0.35);
            padding: 22px 24px 30px; z-index: 400;
            box-shadow: 0 -10px 35px rgba(0, 243, 255, 0.22);
            transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
            max-height: 80vh; overflow-y: auto; color: var(--cyber-text);
        }
        #panelInferior.visible { transform: translate(-50%, 0%); }
        .cabecera-ficha {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 12px; margin-bottom: 14px;
        }
        .badge-categoria {
            display: inline-block; font-family: var(--font-tech); font-size: 10px;
            letter-spacing: 1.6px; color: #05070e; background-color: var(--cyber-yellow);
            padding: 4px 10px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase;
        }
        .titulo-obra {
            margin: 0; font-family: var(--font-hud); font-size: 22px;
            font-weight: 900; color: var(--cyber-cyan); letter-spacing: 1px;
            text-transform: uppercase;
        }
        .boton-cerrar-ficha {
            background: rgba(255, 0, 85, 0.16); color: var(--cyber-magenta);
            border: 1px solid var(--cyber-magenta); padding: 8px 14px;
            font-family: var(--font-hud); font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .datos-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
            padding-top: 14px; border-top: 1px solid rgba(0, 243, 255, 0.25); margin-bottom: 14px;
        }
        .etiqueta {
            display: block; font-family: var(--font-tech); font-size: 10px;
            letter-spacing: 1.4px; color: var(--cyber-cyan); margin-bottom: 4px;
        }
        .valor { font-size: 15px; color: var(--cyber-text); font-weight: 700; }
        .historia-texto {
            font-size: 14.5px; line-height: 1.6; color: #b8d4e3;
            margin: 8px 0 0 0; white-space: pre-line;
        }
        #botonMapa {
            display: none; margin-top: 14px; width: 100%; text-align: center;
            padding: 12px; background: rgba(0, 243, 255, 0.15); color: var(--cyber-cyan);
            border: 1px solid var(--cyber-cyan); text-decoration: none;
            font-family: var(--font-hud); font-size: 11px; font-weight: 700;
        }
    </style>

    <!-- ===================================================== -->
    <!-- 3. MOTOR AR: COMPOSITOR + MATERIALIZACIÓN + RETENCIÓN -->
    <!-- ===================================================== -->
    <script>
        function calcularResolucionCaptura(vw, vh, modo) {
            const minSide = Math.min(vw, vh);
            const escalaBase = (modo === 'video' ? 1080 : 1440) / minSide;
            const capLong = modo === 'video' ? 2560 : 3840;

            let outW = Math.round((vw * escalaBase) / 2) * 2;
            let outH = Math.round((vh * escalaBase) / 2) * 2;

            if (Math.max(outW, outH) > capLong) {
                const s = capLong / Math.max(outW, outH);
                outW = Math.round((outW * s) / 2) * 2;
                outH = Math.round((outH * s) / 2) * 2;
            }
            return { w: Math.max(2, outW), h: Math.max(2, outH) };
        }

        window.capturadorAR = {
            solicitarFoto: false,
            grabandoVideo: false,
            canvasCompuesto: null,
            ctxCompuesto: null
        };

        // ============================================================
        // COMPOSITOR: une cámara + 3D para fotos y videos HD
        // ============================================================
        AFRAME.registerComponent('compositor-ar', {
            init: function () {
                const canvas = document.createElement('canvas');
                canvas.width = 720;
                canvas.height = 960;
                window.capturadorAR.canvasCompuesto = canvas;
                window.capturadorAR.ctxCompuesto = canvas.getContext('2d', { alpha: false });

                this._lastDrawTime = 0;
                this._rects = null;

                window.addEventListener('resize', () => { this._rects = null; });
                window.addEventListener('orientationchange', () => { this._rects = null; });
            },

            invalidarRects: function () { this._rects = null; },

            _getRects: function () {
                if (this._rects) return this._rects;

                const video = document.querySelector('video');
                const glCanvas = this.el.canvas;
                if (!glCanvas) return null;

                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;

                const vRect = (video && video.readyState >= 2)
                    ? video.getBoundingClientRect()
                    : { left: 0, top: 0, width: vw, height: vh };

                const cRect = glCanvas.getBoundingClientRect();

                this._rects = { video, glCanvas, vRect, cRect, vw, vh };
                return this._rects;
            },

            tock: function (time) {
                if (!window.capturadorAR.solicitarFoto && !window.capturadorAR.grabandoVideo) return;

                if (window.capturadorAR.grabandoVideo) {
                    if (time - this._lastDrawTime < 33) return;
                    this._lastDrawTime = time;
                }

                this.dibujarFrame();
            },

            dibujarFrame: function () {
                const compCanvas = window.capturadorAR.canvasCompuesto;
                const ctx = window.capturadorAR.ctxCompuesto;
                if (!compCanvas || !ctx) return;

                const r = this._getRects();
                if (!r || !r.glCanvas) return;

                const { video, glCanvas, vRect, cRect, vw, vh } = r;

                if (!window.capturadorAR.grabandoVideo && window.capturadorAR.solicitarFoto) {
                    const target = calcularResolucionCaptura(vw, vh, 'foto');
                    if (compCanvas.width !== target.w || compCanvas.height !== target.h) {
                        compCanvas.width = target.w;
                        compCanvas.height = target.h;
                    }
                }

                const W = compCanvas.width;
                const H = compCanvas.height;

                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, W, H);

                if (video && video.readyState >= 2) {
                    ctx.save();
                    if (window.modoCamaraActual === "user") {
                        ctx.translate(W, 0);
                        ctx.scale(-1, 1);
                    }
                    ctx.drawImage(
                        video,
                        (vRect.left / vw) * W,
                        (vRect.top / vh) * H,
                        (vRect.width / vw) * W,
                        (vRect.height / vh) * H
                    );
                    ctx.restore();
                }

                ctx.drawImage(
                    glCanvas,
                    (cRect.left / vw) * W,
                    (cRect.top / vh) * H,
                    (cRect.width / vw) * W,
                    (cRect.height / vh) * H
                );

                if (window.capturadorAR.solicitarFoto) {
                    window.capturadorAR.solicitarFoto = false;
                    compCanvas.toBlob((blob) => {
                        if (blob && window.mostrarVistaPreviaArchivo) {
                            window.mostrarVistaPreviaArchivo(blob, 'foto');
                        }
                    }, 'image/jpeg', window.ficha.calidadFotoJPEG || 0.94);
                }
            }
        });

        // ============================================================
        // COMPONENTE PRINCIPAL: MODELO ANIMADO + MATERIALIZACIÓN CYBERPUNK
        // + RETENCIÓN ANTI-PÉRDIDA DE VARIOS SEGUNDOS
        // ============================================================
        AFRAME.registerComponent('modelo-cyberpunk-ar', {
            init: function () {
                const THREE = AFRAME.THREE;
                this.mixer = null;
                this.actions = [];
                this.giroRespaldo = false;
                this.contenedor = null;
                this.anilloEscaner = null;
                this.mallasOriginales = [];
                this.mallasHolograma = [];

                // Estado: 'OCULTO' | 'MATERIALIZANDO' | 'ACTIVO' | 'RETENCION' | 'DESMATERIALIZANDO'
                this.estado = 'OCULTO';
                this.progresoMat = 0; // 0.0 (oculto) -> 1.0 (100% materializado)
                this.rastreandoEnVivo = false;
                this.tiempoPerdidaInicio = 0;
                this.poseInicializada = false;
                this.relojPulso = 0;

                // Límites locales de barrido vertical
                this.minYLocal = -1.8;
                this.maxYLocal = 1.8;

                // Vectores auxiliares para interpolación suave y plano de corte
                this._tPos = new THREE.Vector3();
                this._tQuat = new THREE.Quaternion();
                this._tScale = new THREE.Vector3();
                this._planeNormal = new THREE.Vector3();
                this._planePoint = new THREE.Vector3();
                this.planoCorte = new THREE.Plane(new THREE.Vector3(0, -1, 0), 10);

                const el = this.el;
                const anclaEstable = document.getElementById('anclaEstableAR');
                const targetEl = document.getElementById('objetivoAR');
                const estadoUI = document.getElementById('estadoCarga');
                const barraRetencionWrap = document.getElementById('barraRetencionWrap');
                const retencionProgreso = document.getElementById('retencionProgreso');
                const retencionSegTxt = document.getElementById('retencionSegTxt');

                this.anclaObj = anclaEstable.object3D;
                this.targetObj = targetEl.object3D;
                this.anclaObj.visible = false;

                // Habilitar Local Clipping en el renderer de Three.js para el efecto de materialización
                const activarClipping = () => {
                    if (el.sceneEl && el.sceneEl.renderer) {
                        el.sceneEl.renderer.localClippingEnabled = true;
                    }
                };
                if (el.sceneEl.hasLoaded) activarClipping();
                else el.sceneEl.addEventListener('loaded', activarClipping);

                // Construir anillo láser de escaneo Cyberpunk 3D
                const crearAnilloLaser = (radio) => {
                    const group = new THREE.Group();

                    // Anillo principal Neon Cyan
                    const geoRing = new THREE.RingGeometry(radio * 0.72, radio * 1.05, 8);
                    geoRing.rotateX(-Math.PI / 2);
                    const matRing = new THREE.MeshBasicMaterial({
                        color: 0x00f3ff,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.85,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    const meshRing = new THREE.Mesh(geoRing, matRing);

                    // Borde interior Magenta
                    const geoInner = new THREE.RingGeometry(radio * 0.25, radio * 0.7, 16);
                    geoInner.rotateX(-Math.PI / 2);
                    const matInner = new THREE.MeshBasicMaterial({
                        color: 0xff0055,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.35,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    const meshInner = new THREE.Mesh(geoInner, matInner);

                    group.add(meshRing);
                    group.add(meshInner);
                    group.visible = false;
                    return group;
                };

                const cargarGLB = () => {
                    const loader = new THREE.GLTFLoader();

                    const meshopt = (typeof MeshoptDecoder !== 'undefined') ? MeshoptDecoder : window.MeshoptDecoder;
                    if (meshopt) loader.setMeshoptDecoder(meshopt);

                    if (THREE.DRACOLoader) {
                        const dracoLoader = new THREE.DRACOLoader();
                        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                        loader.setDRACOLoader(dracoLoader);
                    }

                    loader.load(
                        window.ficha.modelo,
                        (gltf) => {
                            const model = gltf.scene;

                            // 1. Inicializar animaciones en loop infinito
                            if (gltf.animations && gltf.animations.length > 0) {
                                this.mixer = new THREE.AnimationMixer(model);
                                gltf.animations.forEach((clip) => {
                                    const action = this.mixer.clipAction(clip);
                                    action.setLoop(THREE.LoopRepeat, Infinity);
                                    action.play();
                                    this.actions.push(action);
                                });
                                this.mixer.update(0);
                            } else {
                                this.giroRespaldo = true;
                            }

                            // 2. Calcular Bounding Box y preparar materiales + capa wireframe holográfica
                            model.updateMatrixWorld(true);
                            const box = new THREE.Box3();

                            model.traverse((node) => {
                                if (node.isMesh) {
                                    node.frustumCulled = false;
                                    box.expandByObject(node);

                                    const mats = Array.isArray(node.material) ? node.material : [node.material];
                                    mats.forEach((mat) => {
                                        if (!mat) return;
                                        mat.side = THREE.DoubleSide;
                                        mat.clippingPlanes = [this.planoCorte];
                                        mat.clipShadows = true;
                                        if (mat.emissive) {
                                            mat.userData.origEmissive = mat.emissive.clone();
                                            mat.userData.origEmissiveIntensity = mat.emissiveIntensity ?? 1.0;
                                        }
                                        mat.needsUpdate = true;
                                        this.mallasOriginales.push(mat);
                                    });
                                }
                            });

                            if (box.isEmpty()) box.setFromObject(model);

                            const size = box.getSize(new THREE.Vector3());
                            const center = box.getCenter(new THREE.Vector3());
                            const maxDim = Math.max(size.x, size.y, size.z);

                            // 3. Jerarquía de doble grupo para centrado limpio sin romper animaciones
                            const pivotGroup = new THREE.Group();
                            const offsetGroup = new THREE.Group();

                            offsetGroup.add(model);
                            pivotGroup.add(offsetGroup);

                            const escalaObjetivo = window.ficha.escala || 3.6;
                            if (Number.isFinite(maxDim) && maxDim > 0.0001) {
                                const factor = escalaObjetivo / maxDim;
                                offsetGroup.position.set(-center.x, -center.y, -center.z);
                                pivotGroup.scale.setScalar(factor);
                            } else {
                                pivotGroup.scale.setScalar(escalaObjetivo);
                            }

                            // Rango vertical en espacio del contenedor para el barrido láser
                            this.minYLocal = -escalaObjetivo * 0.58;
                            this.maxYLocal = escalaObjetivo * 0.58;

                            // Anillo láser de materialización Cyberpunk
                            this.anilloEscaner = crearAnilloLaser(escalaObjetivo * 0.55);
                            el.object3D.add(this.anilloEscaner);

                            el.setObject3D('mesh', pivotGroup);
                            this.contenedor = pivotGroup;

                            if (estadoUI) {
                                estadoUI.textContent = "SYS.READY // ESCANEA EL STICKER";
                            }
                        },
                        undefined,
                        (error) => {
                            console.error("Error cargando GLB:", error);
                            if (estadoUI) {
                                estadoUI.textContent = "ERR // FALLO AL CARGAR GLB";
                                estadoUI.style.borderColor = "#ff0055";
                                estadoUI.style.color = "#ff0055";
                            }
                        }
                    );
                };

                const meshoptGlobal = (typeof MeshoptDecoder !== 'undefined') ? MeshoptDecoder : window.MeshoptDecoder;
                if (meshoptGlobal && meshoptGlobal.ready) {
                    meshoptGlobal.ready.then(cargarGLB).catch(() => cargarGLB());
                } else {
                    cargarGLB();
                }

                // ============================================================
                // EVENTOS DE DETECCIÓN CON RETENCIÓN DE VARIOS SEGUNDOS
                // ============================================================
                targetEl.addEventListener('targetFound', () => {
                    this.rastreandoEnVivo = true;
                    this.anclaObj.visible = true;
                    barraRetencionWrap.classList.remove('activo');

                    // Reanudar animaciones en loop
                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(a => {
                            a.paused = false;
                            a.play();
                        });
                    }

                    // Si estaba oculto o desmaterializándose, iniciar materialización Cyberpunk
                    if (this.estado === 'OCULTO' || this.estado === 'DESMATERIALIZANDO') {
                        if (this.estado === 'OCULTO') this.progresoMat = 0.0;
                        this.estado = 'MATERIALIZANDO';
                        this.aplicarClippingActivo(true);
                    } else if (this.estado === 'RETENCION') {
                        // Si se recuperó dentro de los segundos de tolerancia, continuar sin reiniciar
                        this.estado = this.progresoMat < 1.0 ? 'MATERIALIZANDO' : 'ACTIVO';
                    }

                    if (estadoUI) {
                        estadoUI.textContent = "LINK ACTIVO // HOLO-TRACKING ON";
                        estadoUI.style.borderColor = "#00ff9d";
                        estadoUI.style.color = "#00ff9d";
                    }
                });

                targetEl.addEventListener('targetLost', () => {
                    this.rastreandoEnVivo = false;
                    // En lugar de ocultar el modelo de inmediato, entramos en modo RETENCIÓN
                    if (this.estado !== 'OCULTO') {
                        this.estado = 'RETENCION';
                        this.tiempoPerdidaInicio = performance.now();
                        barraRetencionWrap.classList.add('activo');
                        if (estadoUI) {
                            estadoUI.textContent = "BUFFER NEURAL // ESTABILIZANDO POSE";
                            estadoUI.style.borderColor = "#fcee0a";
                            estadoUI.style.color = "#fcee0a";
                        }
                    }
                });

                this._barraRetencionWrap = barraRetencionWrap;
                this._retencionProgreso = retencionProgreso;
                this._retencionSegTxt = retencionSegTxt;
                this._estadoUI = estadoUI;
            },

            aplicarClippingActivo: function (activo) {
                for (let i = 0; i < this.mallasOriginales.length; i++) {
                    const mat = this.mallasOriginales[i];
                    mat.clippingPlanes = activo ? [this.planoCorte] : null;
                    if (!activo && mat.emissive && mat.userData.origEmissive) {
                        mat.emissive.copy(mat.userData.origEmissive);
                        mat.emissiveIntensity = mat.userData.origEmissiveIntensity;
                    }
                    mat.needsUpdate = true;
                }
                if (this.anilloEscaner) {
                    this.anilloEscaner.visible = activo;
                }
            },

            actualizarEfectoMaterializacion: function (delta) {
                const THREE = AFRAME.THREE;
                if (this.estado === 'MATERIALIZANDO') {
                    const dur = (window.ficha.duracionMaterializacionMs || 1800) / 1000;
                    this.progresoMat = Math.min(1.0, this.progresoMat + delta / dur);
                    if (this.progresoMat >= 1.0) {
                        this.estado = 'ACTIVO';
                        this.aplicarClippingActivo(false);
                        return;
                    }
                } else if (this.estado === 'DESMATERIALIZANDO') {
                    const dur = (window.ficha.duracionDesmaterializacionMs || 550) / 1000;
                    this.progresoMat = Math.max(0.0, this.progresoMat - delta / dur);
                    if (this.progresoMat <= 0.0) {
                        this.estado = 'OCULTO';
                        this.anclaObj.visible = false;
                        this.poseInicializada = false;
                        this.aplicarClippingActivo(false);
                        if (window.notificarPerdidaDefinitivaUI) window.notificarPerdidaDefinitivaUI();
                        return;
                    }
                } else {
                    return;
                }

                // Curva suave cubic easeInOut para el barrido láser
                const t = this.progresoMat;
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                const alturaLocal = THREE.MathUtils.lerp(this.minYLocal, this.maxYLocal, ease);

                if (this.anilloEscaner) {
                    this.anilloEscaner.visible = true;
                    this.anilloEscaner.position.set(0, alturaLocal, 0);
                    this.anilloEscaner.rotation.y += delta * 4.5;

                    // Actualizar plano de corte en espacio de mundo según la posición del anillo láser
                    this.el.object3D.updateMatrixWorld(true);
                    this.anilloEscaner.getWorldPosition(this._planePoint);

                    // Vector hacia arriba del modelo en coordenadas de mundo
                    this._planeNormal.set(0, -1, 0).transformDirection(this.el.object3D.matrixWorld).normalize();
                    this.planoCorte.setFromNormalAndCoplanarPoint(this._planeNormal, this._planePoint);
                }

                // Pulso de brillo Cyberpunk Cian/Magenta en los materiales durante la materialización
                const pulsoNeon = Math.sin(t * Math.PI);
                for (let i = 0; i < this.mallasOriginales.length; i++) {
                    const mat = this.mallasOriginales[i];
                    if (mat.emissive) {
                        mat.emissive.setRGB(
                            0.0 + pulsoNeon * 0.15,
                            pulsoNeon * 0.85,
                            pulsoNeon * 0.95
                        );
                        mat.emissiveIntensity = 1.0 + pulsoNeon * 1.6;
                    }
                }
            },

            tick: function (time, timeDelta) {
                if (this.estado === 'OCULTO') return;

                const delta = Math.min((timeDelta || 16.6) / 1000, 0.05);
                this.relojPulso += delta;

                // 1. Sincronizar pose suavizada cuando el sticker está a la vista
                if (this.rastreandoEnVivo && this.targetObj.visible) {
                    const mat = this.targetObj.matrix;
                    if (mat && mat.elements[15] !== 0) {
                        mat.decompose(this._tPos, this._tQuat, this._tScale);
                        if (this._tScale.lengthSq() > 0.000001) {
                            if (!this.poseInicializada) {
                                this.anclaObj.position.copy(this._tPos);
                                this.anclaObj.quaternion.copy(this._tQuat);
                                this.anclaObj.scale.copy(this._tScale);
                                this.poseInicializada = true;
                            } else {
                                const k = window.ficha.suavizadoPose || 16.0;
                                const alpha = 1.0 - Math.exp(-k * delta);
                                this.anclaObj.position.lerp(this._tPos, alpha);
                                this.anclaObj.quaternion.slerp(this._tQuat, alpha);
                                this.anclaObj.scale.lerp(this._tScale, alpha);
                            }
                        }
                    }
                } else if (this.estado === 'RETENCION') {
                    // 2. Si se perdió el sticker, mantener el modelo vivo durante varios segundos
                    const transcurrido = performance.now() - this.tiempoPerdidaInicio;
                    const maxRetencion = window.ficha.tiempoRetencionPerdidaMs || 4500;
                    const restanteRatio = Math.max(0, 1 - transcurrido / maxRetencion);

                    // Flotación holográfica suave mientras está en retención
                    this.anclaObj.position.y += Math.sin(this.relojPulso * 3.5) * 0.0004;

                    if (this._retencionProgreso) {
                        this._retencionProgreso.style.transform = `scaleX(${restanteRatio.toFixed(3)})`;
                    }
                    if (this._retencionSegTxt) {
                        const segRest = Math.max(0, (maxRetencion - transcurrido) / 1000).toFixed(1);
                        this._retencionSegTxt.textContent = `${segRest}s`;
                    }

                    if (transcurrido >= maxRetencion) {
                        this._barraRetencionWrap.classList.remove('activo');
                        this.estado = 'DESMATERIALIZANDO';
                        this.aplicarClippingActivo(true);
                    }
                }

                // 3. Actualizar barrido láser de materialización / desmaterialización
                if (this.estado === 'MATERIALIZANDO' || this.estado === 'DESMATERIALIZANDO') {
                    this.actualizarEfectoMaterializacion(delta);
                }

                // 4. Mantener animación del GLB en loop continuo
                if (this.mixer) {
                    this.mixer.update(delta);
                } else if (this.giroRespaldo && this.contenedor) {
                    this.contenedor.rotation.y += delta * 1.5;
                }
            }
        });
    </script>

    <!-- CONTROLES DE CAPTURA (FOTO, VIDEO, CAMBIO DE CÁMARA) -->
    <div class="contenedor-controles">

    <section id="panelInferior">
