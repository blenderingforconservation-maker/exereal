<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Experiencia AR - Tori Mask</title>

    <!-- ===================================================== -->
    <!-- MOTORES DE REALIDAD AUMENTADA Y ANIMACIÓN 3D          -->
    <!-- NO MODIFICAR                                          -->
    <!-- ===================================================== -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- aframe-extras es OBLIGATORIO para reproducir la animación .glb -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        /* ================================================= */
        /* UI/UX DESIGN - ESTILOS DE INTERFAZ                */
        /* ================================================= */
        :root {
            --color-primario: #202020;
            --color-acento: #ff3b30;
            --texto-claro: #f5f5f7;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }

        /* Pantalla de instrucciones de escaneo */
        #ui-escaneo {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            color: white;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.5s ease;
        }

        .icono-scan {
            width: 80px; height: 80px;
            border: 2px dashed rgba(255,255,255,0.8);
            border-radius: 12px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        #ui-escaneo h2 { margin: 0 0 10px 0; font-weight: 600; letter-spacing: 1px; }
        #ui-escaneo p { margin: 0; font-size: 14px; opacity: 0.8; max-width: 80%; }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* Ficha Informativa Flotante (Glassmorphism) */
        #ui-info {
            position: absolute;
            bottom: -200px; /* Oculto por defecto */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
            z-index: 200;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }

        #ui-info.activo { bottom: 0; }

        .etiqueta-categoria {
            display: inline-block;
            background: var(--color-primario);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 10px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        #tituloObra { margin: 0 0 5px 0; font-size: 22px; color: #111; }
        #autorObra { margin: 0 0 15px 0; font-size: 14px; color: #555; }
        
        #btnAccion {
            display: block; width: 100%;
            background: var(--color-primario); color: white;
            text-align: center; padding: 14px;
            border-radius: 12px; text-decoration: none;
            font-weight: bold; font-size: 14px; border: none;
        }
    </style>
</head>
<body>

    <!-- ===================================================== -->
    <!-- INTERFAZ DE USUARIO (UI) SOBREPUESTA                  -->
    <!-- ===================================================== -->
    
    <!-- Pantalla de Escaneo -->
    <div id="ui-escaneo">
        <div class="icono-scan"></div>
        <h2>Apunta a la imagen</h2>
        <p>Encuentra el marcador físico para revelar la obra tridimensional animada.</p>
    </div>

    <!-- Tarjeta de Información Flotante -->
    <div id="ui-info">
        <span class="etiqueta-categoria" id="categoriaObra">MÁSCARA TRADICIONAL</span>
        <h2 id="tituloObra">Tori Mask</h2>
        <p id="autorObra">Desconocido</p>
        <a href="#" id="btnAccion">Ver documentación completa</a>
    </div>

    <!-- ===================================================== -->
    <!-- ESCENA AR (A-FRAME + MINDAR)                          -->
    <!-- ===================================================== -->
    
    <!-- 
      Nota técnica: mindar-image gestiona el archivo .mind (tu imagen procesada).
      uiScanning: false oculta la UI fea por defecto para usar la nuestra.
    -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets/imagen_rastreo.mind; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Aquí cargamos tu modelo animado -->
            <a-asset-item id="modeloPrincipal" src="./models/giro-torimask-opt.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- targetIndex: 0 refiere a la primera imagen dentro del archivo .mind -->
        <a-entity mindar-image-target="targetIndex: 0" id="objetivoAR">
            
            <!-- 
               animation-mixer: ESTO ACTIVA LA ANIMACIÓN QUE TRAE EL GLB DESDE BLENDER.
               scale: Ajusta el tamaño de tu modelo respecto a la imagen física.
               rotation: Ajusta si el modelo sale acostado o de espaldas.
            -->
            <a-entity 
                gltf-model="#modeloPrincipal" 
                scale="0.5 0.5 0.5" 
                position="0 0 0" 
                rotation="0 0 0"
                animation-mixer="loop: repeat">
            </a-entity>

        </a-entity>
    </a-scene>

    <!-- ===================================================== -->
    <!-- LÓGICA DE INTERACCIÓN (UX)                            -->
    <!-- ===================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // Elementos de la interfaz
            const uiEscaneo = document.getElementById('ui-escaneo');
            const uiInfo = document.getElementById('ui-info');
            const objetivoAR = document.getElementById('objetivoAR');

            // Cuando la cámara detecta la imagen
            objetivoAR.addEventListener("targetFound", event => {
                console.log("¡Imagen detectada!");
                // Ocultar la pantalla de escaneo
                uiEscaneo.style.opacity = "0";
                setTimeout(() => uiEscaneo.style.display = "none", 500);
                
                // Subir la tarjeta de información con animación fluida
                uiInfo.classList.add('activo');
            });

            // Cuando la cámara pierde la imagen
            objetivoAR.addEventListener("targetLost", event => {
                console.log("Imagen perdida");
                // Bajar la tarjeta de información
                uiInfo.classList.remove('activo');
                
                // Volver a mostrar la instrucción de escaneo
                uiEscaneo.style.display = "flex";
                setTimeout(() => uiEscaneo.style.opacity = "1", 50);
            });
        });
    </script>
</body>
</html>
