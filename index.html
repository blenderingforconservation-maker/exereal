    <!-- ===================================================== -->
    <!-- ESCENA AR                                             -->
    <!-- ===================================================== -->
    <a-scene
        id="escenaAR"
        compositor-ar
        loading-screen="enabled: false"
        mindar-image="imageTargetSrc: ./targets/imagen_rastreo.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0005; filterBeta: 0.005; warmupTolerance: 1; missTolerance: 15;"
        color-space="sRGB"
        renderer="colorManagement: true; antialias: true; alpha: true; preserveDrawingBuffer: true; powerPreference: high-performance;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Iluminación con acentos Cyberpunk (Cian + Magenta + Luz principal) -->
        <a-light type="hemisphere" color="#e8faff" groundColor="#241634" intensity="1.0"></a-light>
        <a-light type="ambient" color="#ffffff" intensity="1.05"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2.1" position="1.5 2.5 2"></a-light>
        <a-light type="directional" color="#00f3ff" intensity="1.15" position="-2.0 1.2 1.5"></a-light>
        <a-light type="directional" color="#ff0055" intensity="0.95" position="2.0 -1.2 1.2"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Objetivo de rastreo de MindAR -->
        <a-entity mindar-image-target="targetIndex: 0" id="objetivoAR"></a-entity>

        <!-- Ancla estabilizada independiente que retiene el modelo varios segundos si se pierde el target -->
        <a-entity id="anclaEstableAR">
            <a-entity
                id="entidadModelo"
                position="0 0 0.1"
                rotation="0 0 0"
                modelo-cyberpunk-ar>
            </a-entity>
        </a-entity>

    </a-scene>

    <!-- ===================================================== -->
    <!-- LÓGICA DE INTERFAZ, CÁMARA, GRABACIÓN Y QR CYBERPUNK  -->
    <!-- ===================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const escenaEl = document.getElementById("escenaAR");

            // 1. Cargar datos de la ficha
            document.getElementById("uiCategoria").textContent = window.ficha.categoria;
            document.getElementById("uiTitulo").textContent = window.ficha.titulo;
            document.getElementById("uiAutor").textContent = window.ficha.autor;
            document.getElementById("uiAnio").textContent = window.ficha.anio;
            document.getElementById("uiUbicacion").textContent = window.ficha.ubicacion;
            document.getElementById("uiHistoria").textContent = window.ficha.historia;

            const entidadModelo = document.getElementById("entidadModelo");
            if (window.ficha.rotacionInicial) {
                entidadModelo.setAttribute("rotation", window.ficha.rotacionInicial);
            }

            const botonMapa = document.getElementById("botonMapa");
            if (window.ficha.mapa && window.ficha.mapa.trim() !== "") {
                botonMapa.href = window.ficha.mapa;
                botonMapa.style.display = "block";
            }

            // 2. Ajustar resolución del renderer
            function aplicarViewerPixelRatio() {
                const renderer = escenaEl && escenaEl.renderer;
                if (!renderer || typeof renderer.setPixelRatio !== 'function') return;
                const dpr = window.devicePixelRatio || 1;
                const target = Math.min(dpr, window.ficha.viewerPixelRatioMax || 2.0);
                const current = (typeof renderer.getPixelRatio === 'function') ? renderer.getPixelRatio() : 1;
                if (current < target) {
                    renderer.setPixelRatio(target);
                }
            }

            if (escenaEl.hasLoaded) {
                aplicarViewerPixelRatio();
            } else {
                escenaEl.addEventListener('loaded', aplicarViewerPixelRatio);
            }

            // 3. Ficha informativa
            const panelInferior = document.getElementById("panelInferior");
            const btnAbrirFicha = document.getElementById("btnAbrirFicha");
            const btnCerrarFicha = document.getElementById("btnCerrarFicha");

            btnAbrirFicha.addEventListener("click", () => panelInferior.classList.add("visible"));
            btnCerrarFicha.addEventListener("click", () => panelInferior.classList.remove("visible"));

            // 4. Detección con feedback visual y sincronización con el buffer de retención
            const objetivoAR = document.getElementById("objetivoAR");
            const uiEscaneo = document.getElementById("ui-escaneo");
            const marcoEscaner = document.getElementById("marcoEscaner");
            const instruccionAR = document.getElementById("instruccionAR");
            const estadoCarga = document.getElementById("estadoCarga");

            let timeoutOcultarUI = null;

            objetivoAR.addEventListener("targetFound", () => {
                clearTimeout(timeoutOcultarUI);
                marcoEscaner.classList.add("detectado");
                instruccionAR.classList.add("detectado");
                instruccionAR.textContent = "MATERIALIZANDO // GUERRERO DEMONIO";
                btnAbrirFicha.style.display = "inline-flex";
                if (navigator.vibrate) { try { navigator.vibrate([25, 40, 25]); } catch (e) {} }

                timeoutOcultarUI = setTimeout(() => {
                    uiEscaneo.style.opacity = "0";
                }, 550);
            });

            // Solo vuelve a mostrar la retícula de escaneo cuando termina el tiempo de retención y se desmaterializa
            window.notificarPerdidaDefinitivaUI = () => {
                clearTimeout(timeoutOcultarUI);
                uiEscaneo.style.opacity = "1";
                marcoEscaner.classList.remove("detectado");
                instruccionAR.classList.remove("detectado");
                instruccionAR.textContent = "ESCANEA EL STICKER // GUERRERO DEMONIO";
                panelInferior.classList.remove("visible");
                btnAbrirFicha.style.display = "none";
                estadoCarga.textContent = "SYS.READY // ESCANEA EL STICKER";
                estadoCarga.style.borderColor = "rgba(0, 243, 255, 0.45)";
                estadoCarga.style.color = "#00f3ff";
            };

            // 5. Cambio de cámara con respaldo
            const btnCambiarCamara = document.getElementById("btnCambiarCamara");

            function invalidarRectsCompositor() {
                const comp = escenaEl.components["compositor-ar"];
                if (comp && typeof comp.invalidarRects === "function") comp.invalidarRects();
            }

            async function cambiarCamara() {
                if (window._cambiandoCamara) return;
                window._cambiandoCamara = true;
                btnCambiarCamara.disabled = true;
                btnCambiarCamara.classList.toggle("girando");

                const modoPrevio = window.modoCamaraActual;
                const nuevoModo = modoPrevio === "environment" ? "user" : "environment";
                window.modoCamaraActual = nuevoModo;

                let ok = false;

                try {
                    const mindarSystem = escenaEl.systems["mindar-image-system"];
                    if (mindarSystem && typeof mindarSystem.switchCamera === "function") {
                        const r = mindarSystem.switchCamera();
                        if (r && typeof r.then === "function") await r;
                        ok = true;
                    }
                } catch (err) {
                    console.warn("[camera] switchCamera() falló:", err);
                }

                if (!ok) {
                    try {
                        const videos = document.querySelectorAll("video");
                        videos.forEach(v => {
                            if (v.srcObject) {
                                try { v.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {}
                            }
                        });

                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: {
                                facingMode: { ideal: nuevoModo },
                                width: { ideal: window.ficha.camara.width },
                                height: { ideal: window.ficha.camara.height }
                            },
                            audio: false
                        });

                        for (const video of videos) {
                            video.srcObject = stream;
                            try { await video.play(); } catch (e) {}
                        }
                        ok = true;
                    } catch (err) {
                        console.error("[camera] fallback getUserMedia falló:", err);
                    }
                }

                if (!ok) {
                    window.modoCamaraActual = modoPrevio;
                    btnCambiarCamara.classList.toggle("girando");
                } else {
                    invalidarRectsCompositor();
                    setTimeout(invalidarRectsCompositor, 400);
                }

                btnCambiarCamara.disabled = false;
                window._cambiandoCamara = false;
            }

            btnCambiarCamara.addEventListener("click", cambiarCamara);

            // 6. Captura de FOTO
            const btnFoto = document.getElementById("btnFoto");
            const flashPantalla = document.getElementById("flashPantalla");

            btnFoto.addEventListener("click", async () => {
                if (window.capturadorAR.grabandoVideo) return;

                flashPantalla.style.opacity = "0.75";
                setTimeout(() => { flashPantalla.style.opacity = "0"; }, 180);

                const renderer = escenaEl.renderer;
                const originalPR = renderer ? renderer.getPixelRatio() : 1;
                if (renderer) {
                    const boost = Math.min((window.devicePixelRatio || 1) * 1.5, 4);
                    renderer.setPixelRatio(Math.max(originalPR, boost));
                }

                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                window.capturadorAR.solicitarFoto = true;

                setTimeout(() => {
                    if (renderer) renderer.setPixelRatio(originalPR);
                }, 900);
            });

            // 7. Grabación de VIDEO HD
            const btnVideo = document.getElementById("btnVideo");
            const badgeTiempo = document.getElementById("badgeTiempo");
            const textoTiempo = document.getElementById("textoTiempo");

            let mediaRecorder = null;
            let fragmentosVideo = [];
            let intervaloTiempo = null;
            let segundosGrabados = 0;
            let originalPRForVideo = null;

            function obtenerMimeTypeOptimizado() {
                const tipos = [
                    "video/mp4;codecs=avc1.42E01E",
                    "video/mp4",
                    "video/webm;codecs=vp9",
                    "video/webm;codecs=vp8",
                    "video/webm"
                ];
                if (!window.MediaRecorder) return "";
                for (const t of tipos) {
                    if (MediaRecorder.isTypeSupported(t)) return t;
                }
                return "";
            }

            async function iniciarGrabacion() {
                const renderer = escenaEl.renderer;
                originalPRForVideo = renderer ? renderer.getPixelRatio() : 1;
                if (renderer) {
                    const boost = Math.min((window.devicePixelRatio || 1) * 1.5, 3);
                    renderer.setPixelRatio(Math.max(originalPRForVideo, boost));
                }

                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                const compCanvas = window.capturadorAR.canvasCompuesto;
                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;
                const target = calcularResolucionCaptura(vw, vh, 'video');
                compCanvas.width = target.w;
                compCanvas.height = target.h;

                invalidarRectsCompositor();

                window.capturadorAR.solicitarFoto = false;
                window.capturadorAR.grabandoVideo = true;

                const comp = escenaEl.components["compositor-ar"];
                if (comp) comp.dibujarFrame();

                fragmentosVideo = [];

                const stream = compCanvas.captureStream(window.ficha.fpsVideo || 30);
                const mimeType = obtenerMimeTypeOptimizado();

                const opciones = {
                    videoBitsPerSecond: window.ficha.bitrateVideo || 15000000
                };
                if (mimeType) opciones.mimeType = mimeType;

                try {
                    mediaRecorder = new MediaRecorder(stream, opciones);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) fragmentosVideo.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const tipoFinal = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : "video/mp4";
                    const blob = new Blob(fragmentosVideo, { type: tipoFinal });
                    if (blob.size > 0 && window.mostrarVistaPreviaArchivo) {
                        window.mostrarVistaPreviaArchivo(blob, "video");
                    }
                };

                mediaRecorder.start(250);
                btnVideo.classList.add("grabando");
                badgeTiempo.classList.add("activo");
                segundosGrabados = 0;
                textoTiempo.textContent = "REC 00:00";

                intervaloTiempo = setInterval(() => {
                    segundosGrabados++;
                    const min = String(Math.floor(segundosGrabados / 60)).padStart(2, "0");
                    const seg = String(segundosGrabados % 60).padStart(2, "0");
                    textoTiempo.textContent = `REC ${min}:${seg}`;

                    if (window.ficha.maxDuracionVideoSeg && segundosGrabados >= window.ficha.maxDuracionVideoSeg) {
                        detenerGrabacion();
                    }
                }, 1000);
            }

            function detenerGrabacion() {
                window.capturadorAR.grabandoVideo = false;
                clearInterval(intervaloTiempo);
                btnVideo.classList.remove("grabando");
                badgeTiempo.classList.remove("activo");

                if (escenaEl.renderer && originalPRForVideo !== null) {
                    setTimeout(() => {
                        escenaEl.renderer.setPixelRatio(originalPRForVideo);
                        originalPRForVideo = null;
                    }, 400);
                }

                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    try { mediaRecorder.requestData(); } catch (e) {}
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state !== "inactive") {
                            mediaRecorder.stop();
                        }
                    }, 120);
                }
            }

            btnVideo.addEventListener("click", () => {
                if (!window.capturadorAR.grabandoVideo) {
                    iniciarGrabacion().catch(err => {
                        console.error("[video] Error al iniciar grabación:", err);
                        window.capturadorAR.grabandoVideo = false;
                        btnVideo.classList.remove("grabando");
                        badgeTiempo.classList.remove("activo");
                        clearInterval(intervaloTiempo);
                    });
                } else {
                    detenerGrabacion();
                }
            });

            // 8. Modal de vista previa, guardado y descarga
            const modalPreview = document.getElementById("modalPreview");
            const contenedorMedia = document.getElementById("contenedorMedia");
            const pesoArchivo = document.getElementById("pesoArchivo");
            const tituloPreview = document.getElementById("tituloPreview");
            const btnCerrarPreview = document.getElementById("btnCerrarPreview");
            const btnCompartir = document.getElementById("btnCompartir");
            const btnDescargar = document.getElementById("btnDescargar");

            let urlArchivoActual = null;
            let archivoActualObj = null;
            let nombreArchivoActual = "";

            window.mostrarVistaPreviaArchivo = (blob, tipo) => {
                if (urlArchivoActual) {
                    try { URL.revokeObjectURL(urlArchivoActual); } catch (e) {}
                }

                urlArchivoActual = URL.createObjectURL(blob);
                contenedorMedia.innerHTML = "";

                const kb = blob.size / 1024;
                pesoArchivo.textContent = kb < 1024
                    ? `${Math.max(1, Math.round(kb))} KB`
                    : `${(kb / 1024).toFixed(2)} MB`;

                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");

                if (tipo === "foto") {
                    tituloPreview.textContent = "FOTO AR // CYBER-SIGIL";
                    nombreArchivoActual = `torimask-ar-${timestamp}.jpg`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: "image/jpeg" });

                    const img = document.createElement("img");
                    img.src = urlArchivoActual;
                    contenedorMedia.appendChild(img);
                } else {
                    tituloPreview.textContent = "VIDEO AR // HD";
                    const esMp4 = blob.type && blob.type.includes("mp4");
                    const ext = esMp4 ? "mp4" : "webm";
                    const mimeLimpio = esMp4 ? "video/mp4" : "video/webm";
                    nombreArchivoActual = `torimask-ar-${timestamp}.${ext}`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: mimeLimpio });

                    const vid = document.createElement("video");
                    vid.src = urlArchivoActual;
                    vid.controls = true;
                    vid.autoplay = true;
                    vid.loop = true;
                    vid.muted = true;
                    vid.playsInline = true;
                    contenedorMedia.appendChild(vid);
                }

                if (navigator.canShare && archivoActualObj && navigator.canShare({ files: [archivoActualObj] })) {
                    btnCompartir.style.display = "flex";
                } else {
                    btnCompartir.style.display = "none";
                }

                modalPreview.classList.add("activo");
            };

            btnCerrarPreview.addEventListener("click", () => {
                modalPreview.classList.remove("activo");
                contenedorMedia.innerHTML = "";
            });

            btnCompartir.addEventListener("click", async () => {
                if (!archivoActualObj) return;
                try {
                    await navigator.share({
                        files: [archivoActualObj],
                        title: window.ficha.titulo
                    });
                } catch (e) {
                    console.log("Compartir cancelado:", e);
                }
            });

            btnDescargar.addEventListener("click", () => {
                if (!urlArchivoActual) return;
                const a = document.createElement("a");
                a.style.display = "none";
                a.href = urlArchivoActual;
                a.download = nombreArchivoActual;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 200);
            });

            // ============================================================
            // 9. GENERADOR DE QR CYBERPUNK CON EL DISEÑO DEL STICKER
            // ============================================================
            const modalQR = document.getElementById("modalQR");
            const btnAbrirQR = document.getElementById("btnAbrirQR");
            const btnCerrarQR = document.getElementById("btnCerrarQR");
            const qrCanvas = document.getElementById("qrCanvas");
            const qrUrlInput = document.getElementById("qrUrlInput");
            const btnSubirLogoQR = document.getElementById("btnSubirLogoQR");
            const inputLogoQR = document.getElementById("inputLogoQR");
            const btnDescargarQR = document.getElementById("btnDescargarQR");

            let stickerImgCargada = null;

            // Intentar precargar ./kimage (1).png si está en el proyecto
            const imgPreload = new Image();
            imgPreload.crossOrigin = "anonymous";
            imgPreload.onload = () => {
                stickerImgCargada = imgPreload;
                if (modalQR.classList.contains("activo")) dibujarQRCyberpunk(qrUrlInput.value);
            };
            imgPreload.src = window.ficha.stickerLogo;

            // Dibuja la reconstrucción vectorial exacta del Sticker Cyber-Sigilism (Guerrero Demonio)
            function dibujarEmblemaDemonioVector(ctx, cx, cy, radio) {
                ctx.save();
                ctx.translate(cx, cy);
                const s = radio / 115;
                ctx.scale(s, s);

                // Fondo circular blanco puro como el sticker original con anillo doble cyberpunk
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(0, 0, 112, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 6;
                ctx.strokeStyle = "#05070e";
                ctx.stroke();

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#00f3ff";
                ctx.beginPath();
                ctx.arc(0, 0, 118, 0, Math.PI * 2);
                ctx.stroke();

                // Si el usuario subió o tiene kimage (1).png en la carpeta, dibujarla directamente
                if (stickerImgCargada && stickerImgCargada.complete && stickerImgCargada.naturalWidth > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, 106, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(stickerImgCargada, -96, -104, 192, 208);
                    ctx.restore();
                    ctx.restore();
                    return;
                }

                // Trazo simétrico negro de alta precisión (fiel al sticker kimage (1).png)
                ctx.fillStyle = "#05070e";
                ctx.strokeStyle = "#05070e";
                ctx.lineCap = "round";
                ctx.lineJoin = "miter";

                for (const dir of [-1, 1]) {
                    ctx.save();
                    ctx.scale(dir, 1);

                    // 1. Cuerno principal exterior curvado hacia adentro
                    ctx.beginPath();
                    ctx.moveTo(28, -96);
                    ctx.bezierCurveTo(68, -76, 78, -28, 54, 14);
                    ctx.bezierCurveTo(46, 26, 38, 34, 34, 44);
                    ctx.bezierCurveTo(44, 20, 56, -24, 44, -60);
                    ctx.bezierCurveTo(38, -76, 32, -86, 28, -96);
                    ctx.fill();

                    // 2. Rama secundaria externa del cuerno
                    ctx.beginPath();
                    ctx.moveTo(54, -74);
                    ctx.bezierCurveTo(78, -50, 74, -12, 52, 18);
                    ctx.bezierCurveTo(62, -12, 64, -44, 54, -74);
                    ctx.fill();

                    // 3. Cuerno interno flameado cyber-sigil
                    ctx.beginPath();
                    ctx.moveTo(22, -64);
                    ctx.bezierCurveTo(44, -44, 46, -10, 26, 16);
                    ctx.bezierCurveTo(18, 26, 12, 20, 16, 8);
                    ctx.bezierCurveTo(30, -12, 30, -40, 22, -64);
                    ctx.fill();

                    // 4. Espina lateral superior (alas afiladas)
                    ctx.beginPath();
                    ctx.moveTo(46, -16);
                    ctx.bezierCurveTo(68, -24, 86, -22, 96, -12);
                    ctx.bezierCurveTo(80, -14, 64, -8, 52, 6);
                    ctx.closePath();
                    ctx.fill();

                    // 5. Arco supraorbital y cuenca ocular demoníaca
                    ctx.beginPath();
                    ctx.moveTo(4, -8);
                    ctx.bezierCurveTo(18, -2, 36, -6, 56, -22);
                    ctx.bezierCurveTo(48, 2, 32, 16, 10, 14);
                    ctx.closePath();
                    ctx.fill();

                    // 6. Pómulo y espina lateral inferior barrida hacia afuera
                    ctx.beginPath();
                    ctx.moveTo(42, 16);
                    ctx.bezierCurveTo(62, 32, 76, 52, 94, 54);
                    ctx.bezierCurveTo(72, 58, 56, 44, 36, 26);
                    ctx.closePath();
                    ctx.fill();

                    // 7. Entramado tribal de la mandíbula y colmillos centrales
                    ctx.beginPath();
                    ctx.moveTo(6, 12);
                    ctx.lineTo(44, 24);
                    ctx.lineTo(18, 72);
                    ctx.lineTo(4, 56);
                    ctx.lineTo(28, 28);
                    ctx.lineTo(4, 22);
                    ctx.closePath();
                    ctx.fill();

                    // 8. Colmillo curvo inferior de la barbilla
                    ctx.beginPath();
                    ctx.moveTo(28, 48);
                    ctx.bezierCurveTo(40, 72, 28, 94, 6, 98);
                    ctx.bezierCurveTo(20, 88, 26, 70, 20, 52);
                    ctx.closePath();
                    ctx.fill();

                    // 9. Púas centrales del puente nasal
                    ctx.beginPath();
                    ctx.moveTo(2, -32);
                    ctx.quadraticCurveTo(12, -14, 4, 6);
                    ctx.quadraticCurveTo(6, -14, 2, -32);
                    ctx.fill();

                    ctx.restore();
                }

                ctx.restore();
            }

            function dibujarQRCyberpunk(urlTexto) {
                const ctx = qrCanvas.getContext("2d");
                const W = qrCanvas.width;
                const H = qrCanvas.height;
                const url = (urlTexto || location.href).trim();

                // Fondo oscuro Cyberpunk
                const bgGrad = ctx.createLinearGradient(0, 0, W, H);
                bgGrad.addColorStop(0, "#05070e");
                bgGrad.addColorStop(1, "#0b1124");
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                // Marco exterior biselado Neon Cyan & Magenta
                ctx.strokeStyle = "#00f3ff";
                ctx.lineWidth = 5;
                ctx.strokeRect(28, 28, W - 56, H - 56);

                ctx.strokeStyle = "#ff0055";
                ctx.lineWidth = 2;
                ctx.strokeRect(40, 40, W - 80, H - 80);

                // Encabezado Cyberpunk
                ctx.fillStyle = "#fcee0a";
                ctx.font = "900 22px 'Orbitron', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("STICKERS RA // EXPERIENCIA WEBAR", W / 2, 92);

                ctx.fillStyle = "#00f3ff";
                ctx.font = "900 44px 'Orbitron', sans-serif";
                ctx.fillText(window.ficha.titulo.toUpperCase(), W / 2, 146);

                // Placa blanca de alto contraste para lectura instantánea del QR en cualquier cámara
                const qrBoxSize = 680;
                const qrBoxX = (W - qrBoxSize) / 2;
                const qrBoxY = 185;

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(qrBoxX, qrBoxY, qrBoxSize, qrBoxSize);
                ctx.lineWidth = 6;
                ctx.strokeStyle = "#00f3ff";
                ctx.strokeRect(qrBoxX, qrBoxY, qrBoxSize, qrBoxSize);

                if (typeof qrcode === "function") {
                    const qr = qrcode(0, "H");
                    qr.addData(url);
                    qr.make();

                    const count = qr.getModuleCount();
                    const margin = 44;
                    const drawSize = qrBoxSize - margin * 2;
                    const cell = drawSize / count;
                    const startX = qrBoxX + margin;
                    const startY = qrBoxY + margin;

                    const centerR = count * 0.17;
                    const mid = count / 2;

                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (!qr.isDark(r, c)) continue;

                            // Dejar despejado el círculo central para el emblema del sticker
                            const dist = Math.hypot(r + 0.5 - mid, c + 0.5 - mid);
                            if (dist < centerR) continue;

                            const isFinder = (r < 7 && c < 7) || (r < 7 && c >= count - 7) || (r >= count - 7 && c < 7);
                            ctx.fillStyle = isFinder ? "#081226" : "#05070e";

                            const x = startX + c * cell;
                            const y = startY + r * cell;
                            ctx.fillRect(x + 0.3, y + 0.3, cell - 0.6, cell - 0.6);
                        }
                    }
                }

                // Dibujar el diseño del sticker en el centro del QR
                dibujarEmblemaDemonioVector(ctx, W / 2, qrBoxY + qrBoxSize / 2, 118);

                // Pie del póster QR
                ctx.fillStyle = "#e2f6ff";
                ctx.font = "700 24px 'Rajdhani', sans-serif";
                ctx.fillText("1. ESCANEA EL QR   //   2. APUNTA AL STICKER", W / 2, 935);

                ctx.fillStyle = "#ff0055";
                ctx.font = "700 20px 'Share Tech Mono', monospace";
                ctx.fillText(`${window.ficha.autor.toUpperCase()} · ${window.ficha.ubicacion.toUpperCase()} · ${window.ficha.anio}`, W / 2, 985);

                ctx.fillStyle = "rgba(0, 243, 255, 0.7)";
                ctx.font = "400 16px 'Share Tech Mono', monospace";
                ctx.fillText("SYS.ID // TORI-MASK-AR-HOLOGRAM", W / 2, 1085);
            }

            btnAbrirQR.addEventListener("click", () => {
                if (!qrUrlInput.value) {
                    qrUrlInput.value = location.href;
                }
                dibujarQRCyberpunk(qrUrlInput.value);
                modalQR.classList.add("activo");
            });

            btnCerrarQR.addEventListener("click", () => {
                modalQR.classList.remove("activo");
            });

            qrUrlInput.addEventListener("input", (e) => {
                dibujarQRCyberpunk(e.target.value);
            });

            btnSubirLogoQR.addEventListener("click", () => inputLogoQR.click());

            inputLogoQR.addEventListener("change", (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        stickerImgCargada = img;
                        dibujarQRCyberpunk(qrUrlInput.value);
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            btnDescargarQR.addEventListener("click", () => {
                dibujarQRCyberpunk(qrUrlInput.value);
                const link = document.createElement("a");
                link.download = "QR_Cyberpunk_ToriMask.png";
                link.href = qrCanvas.toDataURL("image/png");
                link.click();
            });
        });
    </script>
