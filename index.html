<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Experiencia AR - Tori Mask</title>

    <!-- ===================================================== -->
    <!-- 1. CONFIGURACIÓN DEL PROYECTO (EDITAR AQUÍ)           -->
    <!-- ===================================================== -->
    <script>
        window.ficha = {
            // Ruta del modelo en tu repositorio
            modelo: "./models/giro-torimask-opt.glb",

            // Ruta del archivo compilado de la imagen a detectar
            marcadorMind: "./targets/imagen_rastreo.mind",

            // Ajustes visuales del modelo sobre la imagen
            escala: 1.2,
            rotacionInicial: "0 0 0",

            // Parámetros de optimización de archivos descargados
            calidadFotoJPEG: 0.82,     // Compresión ligera JPEG
            resolucionMaxPx: 960,      // Resolución máxima optimizada
            bitrateVideo: 1200000,     // ~150 KB por segundo de video

            // Datos de la Ficha Informativa (UI)
            categoria: "EXPERIENCIA INTERACTIVA",
            titulo: "TORI MASK",
            autor: "Colección Digital",
            anio: "2026",
            ubicacion: "Realidad Aumentada Web",
            mapa: "",
            historia: "Pieza tridimensional animada desplegada mediante reconocimiento óptico de imagen."
        };

        // =====================================================
        // CONTROLADOR DE CÁMARA: FORZAR CÁMARA TRASERA AL INICIO
        // =====================================================
        window.modoCamaraActual = "environment"; // 'environment' = trasera, 'user' = frontal

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const getUserMediaOriginal = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
            navigator.mediaDevices.getUserMedia = function (constraints) {
                if (constraints && constraints.video) {
                    const videoBase = typeof constraints.video === "object" ? constraints.video : {};
                    constraints = {
                        ...constraints,
                        video: {
                            ...videoBase,
                            facingMode: { ideal: window.modoCamaraActual },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };
                }
                return getUserMediaOriginal(constraints);
            };
        }
    </script>

    <!-- ===================================================== -->
    <!-- 3. COMPONENTES 3D Y COMPOSITOR DE FOTO/VIDEO          -->
    <!-- ===================================================== -->
    <script>
        window.capturadorAR = {
            solicitarFoto: false,
            grabandoVideo: false,
            canvasCompuesto: null,
            ctxCompuesto: null
        };

        // Compositor que une cámara + 3D en tiempo real
        AFRAME.registerComponent('compositor-ar', {
            init: function () {
                const canvas = document.createElement('canvas');
                canvas.width = 720;
                canvas.height = 960;
                window.capturadorAR.canvasCompuesto = canvas;
                window.capturadorAR.ctxCompuesto = canvas.getContext('2d', { alpha: false });
            },

            tock: function () {
                if (!window.capturadorAR.solicitarFoto && !window.capturadorAR.grabandoVideo) return;
                this.dibujarFrame();
            },

            dibujarFrame: function () {
                const glCanvas = this.el.canvas;
                const video = document.querySelector('video');
                if (!glCanvas) return;

                const vw = window.innerWidth || 720;
                const vh = window.innerHeight || 960;
                const maxDim = window.ficha.resolucionMaxPx || 960;
                const escala = Math.min(1, maxDim / Math.max(vw, vh));

                const outW = Math.max(2, Math.round((vw * escala) / 2) * 2);
                const outH = Math.max(2, Math.round((vh * escala) / 2) * 2);

                const compCanvas = window.capturadorAR.canvasCompuesto;
                const ctx = window.capturadorAR.ctxCompuesto;

                if (!window.capturadorAR.grabandoVideo && (compCanvas.width !== outW || compCanvas.height !== outH)) {
                    compCanvas.width = outW;
                    compCanvas.height = outH;
                }

                const W = compCanvas.width;
                const H = compCanvas.height;

                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, W, H);

                if (video && video.readyState >= 2) {
                    const vRect = video.getBoundingClientRect();
                    ctx.save();
                    if (window.modoCamaraActual === "user") {
                        ctx.translate(W, 0);
                        ctx.scale(-1, 1);
                    }
                    ctx.drawImage(
                        video,
                        (vRect.left / vw) * W,
                        (vRect.top / vh) * H,
                        (vRect.width / vw) * W,
                        (vRect.height / vh) * H
                    );
                    ctx.restore();
                }

                const cRect = glCanvas.getBoundingClientRect();
                ctx.drawImage(
                    glCanvas,
                    (cRect.left / vw) * W,
                    (cRect.top / vh) * H,
                    (cRect.width / vw) * W,
                    (cRect.height / vh) * H
                );

                if (window.capturadorAR.solicitarFoto) {
                    window.capturadorAR.solicitarFoto = false;
                    compCanvas.toBlob((blob) => {
                        if (blob && window.mostrarVistaPreviaArchivo) {
                            window.mostrarVistaPreviaArchivo(blob, 'foto');
                        }
                    }, 'image/jpeg', window.ficha.calidadFotoJPEG || 0.82);
                }
            }
        });

        // Cargador GLB con soporte Meshopt y animación
        AFRAME.registerComponent('modelo-animado-ar', {
            init: function () {
                this.mixer = null;
                this.actions = [];
                this.activo = false;
                this.giroRespaldo = false;
                this.contenedor = null;

                const el = this.el;
                const estadoUI = document.getElementById('estadoCarga');

                const cargarGLB = () => {
                    const loader = new AFRAME.THREE.GLTFLoader();

                    if (window.MeshoptDecoder) {
                        loader.setMeshoptDecoder(window.MeshoptDecoder);
                    }

                    if (AFRAME.THREE.DRACOLoader) {
                        const dracoLoader = new AFRAME.THREE.DRACOLoader();
                        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                        loader.setDRACOLoader(dracoLoader);
                    }

                    loader.load(
                        window.ficha.modelo,
                        (gltf) => {
                            const model = gltf.scene;
                            const wrapper = new AFRAME.THREE.Group();
                            wrapper.add(model);

                            const box = new AFRAME.THREE.Box3().setFromObject(model);
                            const size = box.getSize(new AFRAME.THREE.Vector3());
                            const center = box.getCenter(new AFRAME.THREE.Vector3());

                            const maxDim = Math.max(size.x, size.y, size.z);
                            if (maxDim > 0) {
                                const factor = (window.ficha.escala || 1.2) / maxDim;
                                wrapper.scale.setScalar(factor);
                                model.position.set(-center.x, -center.y, -center.z);
                            }

                            el.setObject3D('mesh', wrapper);
                            this.contenedor = wrapper;

                            if (gltf.animations && gltf.animations.length > 0) {
                                this.mixer = new AFRAME.THREE.AnimationMixer(model);
                                gltf.animations.forEach((clip) => {
                                    const action = this.mixer.clipAction(clip);
                                    action.setLoop(AFRAME.THREE.LoopRepeat, Infinity);
                                    this.actions.push(action);
                                });
                            } else {
                                this.giroRespaldo = true;
                            }
                            estadoUI.textContent = "✓ Listo para escanear";
                        },
                        undefined,
                        (error) => {
                            console.error("Error cargando GLB:", error);
                            estadoUI.textContent = "⚠️ Error al cargar modelo";
                            estadoUI.style.backgroundColor = "#8b0000";
                        }
                    );
                };

                if (window.MeshoptDecoder && window.MeshoptDecoder.ready) {
                    window.MeshoptDecoder.ready.then(cargarGLB);
                } else {
                    cargarGLB();
                }

                const targetEl = document.getElementById('objetivoAR');

                targetEl.addEventListener('targetFound', () => {
                    this.activo = true;
                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(action => {
                            action.reset();
                            action.play();
                        });
                    }
                });

                targetEl.addEventListener('targetLost', () => {
                    this.activo = false;
                    if (this.mixer && this.actions.length > 0) {
                        this.actions.forEach(action => {
                            action.paused = true;
                        });
                    }
                });
            },

            tick: function (time, timeDelta) {
                if (!this.activo) return;
                const delta = timeDelta / 1000;
                if (this.mixer) {
                    this.mixer.update(delta);
                } else if (this.giroRespaldo && this.contenedor) {
                    this.contenedor.rotation.y += delta * 1.5;
                }
            }
        });
    </script>
</head>

<body>

    <!-- Flash para captura fotográfica -->
    <div id="flashPantalla"></div>

    <!-- Barra superior -->
    <div class="top-bar">
        <div id="estadoCarga">Iniciando cámara...</div>
        <button id="btnAbrirFicha" aria-label="Información de la pieza">i</button>
    </div>

    <!-- Guía de escaneo -->
    <div id="ui-escaneo">
        <div class="marco-escaner">
            <div class="linea-escaner"></div>
        </div>
        <div class="instruccion-ar">
            Apunta la cámara hacia la imagen marcador
        </div>
    </div>

    <!-- Controles inferiores UX/UI (Solo íconos, sin texto) -->
    <div class="contenedor-controles">
        <div id="badgeTiempo">
            <span class="punto-parpadeo"></span>
            <span id="textoTiempo">00:00</span>
        </div>

        <div class="dock-captura">
            <!-- Botón Foto -->
            <button class="btn-icono" id="btnFoto" aria-label="Tomar foto">
                <div class="nucleo-foto">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
            </button>

            <!-- Botón Video -->
            <button class="btn-icono" id="btnVideo" aria-label="Grabar video">
                <div class="nucleo-video"></div>
            </button>

            <!-- Botón Intercalar Cámara Frontal / Trasera -->
            <button class="btn-icono" id="btnCambiarCamara" aria-label="Cambiar cámara">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"></path>
                    <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Modal de vista previa y guardado de Foto/Video -->
    <div id="modalPreview">
        <div class="tarjeta-preview">
            <div class="cabecera-preview">
                <span id="tituloPreview">Captura lista</span>
                <span id="pesoArchivo">0 KB</span>
            </div>
            <div class="contenedor-media" id="contenedorMedia"></div>
            <div class="acciones-preview">
                <button class="btn-modal" id="btnCerrarPreview">✕</button>
                <button class="btn-modal" id="btnCompartir">Guardar</button>
                <button class="btn-modal" id="btnDescargar">⬇ Descargar</button>
            </div>
        </div>
    </div>

    <!-- Ficha informativa desplegable -->
    <section id="panelInferior">
        <div class="cabecera-ficha">
            <div>
                <span class="badge-categoria" id="uiCategoria"></span>
                <h1 class="titulo-obra" id="uiTitulo"></h1>
            </div>
            <button class="boton-cerrar-ficha" id="btnCerrarFicha">CERRAR</button>
        </div>

        <div class="datos-grid">
            <div>
                <span class="etiqueta">AUTOR</span>
                <div class="valor" id="uiAutor"></div>
            </div>
            <div>
                <span class="etiqueta">AÑO</span>
                <div class="valor" id="uiAnio"></div>
            </div>
            <div style="grid-column: span 2;">
                <span class="etiqueta">UBICACIÓN</span>
                <div class="valor" id="uiUbicacion"></div>
                <a id="botonMapa" href="#" target="_blank" rel="noopener noreferrer">
                    VER UBICACIÓN EN GOOGLE MAPS
                </a>
            </div>
        </div>
        <span class="etiqueta">DESCRIPCIÓN</span>
        <p class="historia-texto" id="uiHistoria"></p>
    </section>

    <!-- ===================================================== -->
    <!-- ESCENA AR                                             -->
    <!-- ===================================================== -->
    <a-scene
        id="escenaAR"
        compositor-ar
        mindar-image="imageTargetSrc: ./targets/imagen_rastreo.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
        color-space="sRGB"
        renderer="colorManagement: true, antialias: true, alpha: true, preserveDrawingBuffer: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-light type="ambient" color="#ffffff" intensity="1.6"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2.2" position="1.5 2.5 2"></a-light>
        <a-light type="directional" color="#ffdcb4" intensity="1.0" position="-1.5 -1 1"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="objetivoAR">
            <a-entity
                id="entidadModelo"
                position="0 0 0.1"
                rotation="0 0 0"
                modelo-animado-ar>
            </a-entity>
        </a-entity>

    </a-scene>

    <!-- ===================================================== -->
    <!-- LÓGICA DE INTERFAZ, CAMBIO DE CÁMARA Y GRABACIÓN      -->
    <!-- ===================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Cargar datos de la ficha
            document.getElementById("uiCategoria").textContent = window.ficha.categoria;
            document.getElementById("uiTitulo").textContent = window.ficha.titulo;
            document.getElementById("uiAutor").textContent = window.ficha.autor;
            document.getElementById("uiAnio").textContent = window.ficha.anio;
            document.getElementById("uiUbicacion").textContent = window.ficha.ubicacion;
            document.getElementById("uiHistoria").textContent = window.ficha.historia;

            const entidadModelo = document.getElementById("entidadModelo");
            if (window.ficha.rotacionInicial) {
                entidadModelo.setAttribute("rotation", window.ficha.rotacionInicial);
            }

            const botonMapa = document.getElementById("botonMapa");
            if (window.ficha.mapa && window.ficha.mapa.trim() !== "") {
                botonMapa.href = window.ficha.mapa;
                botonMapa.style.display = "block";
            }

            // 2. Control de la Ficha Informativa
            const panelInferior = document.getElementById("panelInferior");
            const btnAbrirFicha = document.getElementById("btnAbrirFicha");
            const btnCerrarFicha = document.getElementById("btnCerrarFicha");

            btnAbrirFicha.addEventListener("click", () => panelInferior.classList.add("visible"));
            btnCerrarFicha.addEventListener("click", () => panelInferior.classList.remove("visible"));

            // 3. Eventos de detección de imagen
            const objetivoAR = document.getElementById("objetivoAR");
            const uiEscaneo = document.getElementById("ui-escaneo");

            objetivoAR.addEventListener("targetFound", () => {
                uiEscaneo.style.opacity = "0";
                btnAbrirFicha.style.display = "flex";
            });

            objetivoAR.addEventListener("targetLost", () => {
                uiEscaneo.style.opacity = "1";
                panelInferior.classList.remove("visible");
            });

            // 4. Botón para Intercalar entre Cámara Trasera y Frontal
            const btnCambiarCamara = document.getElementById("btnCambiarCamara");
            const escenaEl = document.getElementById("escenaAR");

            btnCambiarCamara.addEventListener("click", async () => {
                btnCambiarCamara.classList.toggle("girando");
                window.modoCamaraActual = (window.modoCamaraActual === "environment") ? "user" : "environment";

                const mindarSystem = escenaEl.systems["mindar-image-system"];
                if (mindarSystem && typeof mindarSystem.switchCamera === "function") {
                    mindarSystem.switchCamera();
                } else {
                    // Respaldo directo sobre el elemento <video> si el sistema está ocupado
                    const videoEl = document.querySelector("video");
                    if (videoEl && videoEl.srcObject) {
                        videoEl.srcObject.getTracks().forEach(t => t.stop());
                        try {
                            const nuevoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                            videoEl.srcObject = nuevoStream;
                            await videoEl.play();
                        } catch (err) {
                            console.error("Error al cambiar de cámara:", err);
                        }
                    }
                }
            });

            // 5. Captura de Foto y Grabación de Video Optimizado
            const btnFoto = document.getElementById("btnFoto");
            const btnVideo = document.getElementById("btnVideo");
            const badgeTiempo = document.getElementById("badgeTiempo");
            const textoTiempo = document.getElementById("textoTiempo");
            const flashPantalla = document.getElementById("flashPantalla");

            let mediaRecorder = null;
            let fragmentosVideo = [];
            let intervaloTiempo = null;
            let segundosGrabados = 0;
            let urlArchivoActual = null;
            let archivoActualObj = null;
            let nombreArchivoActual = "";

            // Acción Foto
            btnFoto.addEventListener("click", () => {
                flashPantalla.style.opacity = "0.85";
                setTimeout(() => { flashPantalla.style.opacity = "0"; }, 180);
                window.capturadorAR.solicitarFoto = true;
            });

            // Selección de códec compatible
            function obtenerMimeTypeOptimizado() {
                const tipos = [
                    "video/mp4;codecs=avc1.42E01E",
                    "video/mp4",
                    "video/webm;codecs=vp9",
                    "video/webm;codecs=vp8",
                    "video/webm"
                ];
                if (!window.MediaRecorder) return "";
                for (const t of tipos) {
                    if (MediaRecorder.isTypeSupported(t)) return t;
                }
                return "";
            }

            // Acción Video
            btnVideo.addEventListener("click", () => {
                if (!window.capturadorAR.grabandoVideo) {
                    iniciarGrabacion();
                } else {
                    detenerGrabacion();
                }
            });

            function iniciarGrabacion() {
                const comp = escenaEl.components["compositor-ar"];
                if (comp) {
                    window.capturadorAR.solicitarFoto = false;
                    comp.dibujarFrame();
                }

                window.capturadorAR.grabandoVideo = true;
                fragmentosVideo = [];

                const canvasStream = window.capturadorAR.canvasCompuesto.captureStream(24);
                const mimeType = obtenerMimeTypeOptimizado();

                const opciones = {
                    videoBitsPerSecond: window.ficha.bitrateVideo || 1200000
                };
                if (mimeType) opciones.mimeType = mimeType;

                try {
                    mediaRecorder = new MediaRecorder(canvasStream, opciones);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(canvasStream);
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        fragmentosVideo.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const tipoFinal = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : "video/mp4";
                    const blob = new Blob(fragmentosVideo, { type: tipoFinal });
                    if (blob.size > 0) {
                        window.mostrarVistaPreviaArchivo(blob, "video");
                    }
                };

                mediaRecorder.start(250);
                btnVideo.classList.add("grabando");
                badgeTiempo.classList.add("activo");
                segundosGrabados = 0;
                textoTiempo.textContent = "00:00";

                intervaloTiempo = setInterval(() => {
                    segundosGrabados++;
                    const min = String(Math.floor(segundosGrabados / 60)).padStart(2, "0");
                    const seg = String(segundosGrabados % 60).padStart(2, "0");
                    textoTiempo.textContent = `${min}:${seg}`;
                }, 1000);
            }

            function detenerGrabacion() {
                window.capturadorAR.grabandoVideo = false;
                clearInterval(intervaloTiempo);
                btnVideo.classList.remove("grabando");
                badgeTiempo.classList.remove("activo");

                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    try {
                        mediaRecorder.requestData();
                    } catch (e) {}
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state !== "inactive") {
                            mediaRecorder.stop();
                        }
                    }, 120);
                }
            }

            // 6. Modal de Vista Previa, Guardado en Galería y Descarga
            const modalPreview = document.getElementById("modalPreview");
            const contenedorMedia = document.getElementById("contenedorMedia");
            const pesoArchivo = document.getElementById("pesoArchivo");
            const tituloPreview = document.getElementById("tituloPreview");
            const btnCerrarPreview = document.getElementById("btnCerrarPreview");
            const btnCompartir = document.getElementById("btnCompartir");
            const btnDescargar = document.getElementById("btnDescargar");

            window.mostrarVistaPreviaArchivo = (blob, tipo) => {
                if (urlArchivoActual) {
                    try { URL.revokeObjectURL(urlArchivoActual); } catch (e) {}
                }

                urlArchivoActual = URL.createObjectURL(blob);
                contenedorMedia.innerHTML = "";

                const kb = blob.size / 1024;
                pesoArchivo.textContent = kb < 1024
                    ? `${Math.max(1, Math.round(kb))} KB`
                    : `${(kb / 1024).toFixed(2)} MB`;

                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");

                if (tipo === "foto") {
                    tituloPreview.textContent = "Fotografía AR";
                    nombreArchivoActual = `foto-ar-${timestamp}.jpg`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: "image/jpeg" });

                    const img = document.createElement("img");
                    img.src = urlArchivoActual;
                    contenedorMedia.appendChild(img);
                } else {
                    tituloPreview.textContent = "Video AR";
                    const esMp4 = blob.type && blob.type.includes("mp4");
                    const ext = esMp4 ? "mp4" : "webm";
                    const mimeLimpio = esMp4 ? "video/mp4" : "video/webm";
                    nombreArchivoActual = `video-ar-${timestamp}.${ext}`;
                    archivoActualObj = new File([blob], nombreArchivoActual, { type: mimeLimpio });

                    const vid = document.createElement("video");
                    vid.src = urlArchivoActual;
                    vid.controls = true;
                    vid.autoplay = true;
                    vid.loop = true;
                    vid.muted = true;
                    vid.playsInline = true;
                    contenedorMedia.appendChild(vid);
                }

                // Activar botón nativo "Guardar" si el móvil soporta Web Share API para archivos
                if (navigator.canShare && archivoActualObj && navigator.canShare({ files: [archivoActualObj] })) {
                    btnCompartir.style.display = "flex";
                } else {
                    btnCompartir.style.display = "none";
                }

                modalPreview.classList.add("activo");
            };

            btnCerrarPreview.addEventListener("click", () => {
                modalPreview.classList.remove("activo");
                contenedorMedia.innerHTML = "";
            });

            btnCompartir.addEventListener("click", async () => {
                if (!archivoActualObj) return;
                try {
                    await navigator.share({
                        files: [archivoActualObj],
                        title: window.ficha.titulo
                    });
                } catch (e) {
                    console.log("Compartir cancelado:", e);
                }
            });

            btnDescargar.addEventListener("click", () => {
                if (!urlArchivoActual) return;
                const a = document.createElement("a");
                a.style.display = "none";
                a.href = urlArchivoActual;
                a.download = nombreArchivoActual;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 200);
            });
        });
    </script>

</body>
</html>
